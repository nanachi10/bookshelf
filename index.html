<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141C2E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>本棚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 初回の検索と表紙表示が、接続確立（DNS+TLS）ぶんだけ遅れないよう先に張っておく -->
<link rel="preconnect" href="https://ndlsearch.ndl.go.jp" crossorigin>
<link rel="preconnect" href="https://images-na.ssl-images-amazon.com">
<link rel="preconnect" href="https://books.google.com">
<link rel="dns-prefetch" href="https://api.openbd.jp">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141C2E; --ink-2:#1D2740; --ink-3:#2A3555; --ink-4:#3D4A6E;
  --paper:#EFEAE0; --dim:#8E98AF;
  --foil:#C9A34E; --foil-dim:#8A7133;
  --jade:#5E9E8C; --violet:#9285C8; --alert:#D2604A;
  --shelf:#3A2E22; --r:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--paper);
  font-family:"Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.7;
  padding-bottom:env(safe-area-inset-bottom);overscroll-behavior-y:contain}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
input,textarea{font:inherit}
img{background:var(--ink-3)}

/* ══ ヘッダ ══ */
header{position:sticky;top:0;z-index:20;background:var(--ink);
  padding:14px 16px 9px;padding-top:calc(14px + env(safe-area-inset-top));
  border-bottom:1px solid var(--ink-2)}
.brand{display:flex;align-items:baseline;gap:11px}
h1{font-family:"Noto Serif JP",serif;font-weight:700;font-size:19px;
  letter-spacing:.22em;margin:0;color:var(--foil)}
.stat{font-size:11.5px;letter-spacing:.08em;color:var(--dim);font-variant-numeric:tabular-nums}
/* 指で押す前提なので、見た目の丸より広い当たり判定を持たせる（44px確保） */
.sortbtn{margin-left:auto;font-size:11.5px;color:var(--dim);white-space:nowrap;
  border:1px solid var(--ink-3);border-radius:999px;padding:6px 12px;min-height:44px;
  display:inline-flex;align-items:center}
.sortbtn:active{color:var(--paper)}
.stat b{color:var(--alert);font-weight:700}
.search{margin-top:9px;width:100%;background:var(--ink-2);border:1px solid var(--ink-3);
  border-radius:var(--r);color:var(--paper);padding:9px 13px;font-size:14px}
.search::placeholder{color:#5C687F}
.search:focus{outline:2px solid var(--foil-dim);outline-offset:1px}
.chips{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:10px 14px;border-radius:999px;font-size:12.5px;
  border:1px solid var(--ink-3);color:var(--dim);white-space:nowrap;
  min-height:44px;display:inline-flex;align-items:center}
.chip.on{background:var(--foil);border-color:var(--foil);color:#1A1305;font-weight:700}

main{padding:14px 16px 130px}
.h{display:flex;align-items:baseline;gap:8px;margin:24px 0 10px;
  font-size:11px;letter-spacing:.2em;color:var(--dim)}
.h:first-child{margin-top:0}
.h::after{content:"";flex:1;height:1px;background:var(--ink-2)}

/* ══ 巻数ストリップ ＝ この棚の背骨 ══
   金＝紙で所有／金の枠＝電子／翡翠＝読了／菫＝アニメで見た／赤の破線＝未登録 */
.strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.v{min-width:21px;height:27px;padding:0 2px;border-radius:1px 3px 3px 1px;font-size:10px;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;line-height:1}
.v.paper{background:linear-gradient(180deg,var(--foil),var(--foil-dim));color:#1A1305;font-weight:700}
.v.paper.read{background:linear-gradient(180deg,var(--jade),#3F7466);color:#06120E}
.v.digital{border:1.5px solid var(--foil);color:var(--foil);font-weight:700}
.v.digital.read{border-color:var(--jade);color:var(--jade)}
.v.none{border:1px solid var(--ink-4);color:var(--dim)}
.v.none.read{border-color:var(--jade);color:var(--jade)}
.v.none.anime{border-color:var(--violet);color:var(--violet)}
.v.gap{border:1px dashed rgba(210,96,74,.8);color:var(--alert)}
.v.next{border:1px dashed var(--ink-4);color:var(--dim)}
/* 巻ピッカー：タップで選ぶので当たり判定を広く取る */
.pickgrid{gap:5px}
.pickgrid .v{min-width:38px;height:42px;font-size:13px;border-radius:4px;cursor:pointer}
.v.can{border:1px dashed var(--ink-4);color:var(--dim)}
.v.pick{background:linear-gradient(180deg,var(--foil),var(--foil-dim));color:#1A1305;font-weight:700}
/* 棚から出す選択。入れる（金）と取り違えないよう赤で示す */
.v.kill{background:var(--alert);color:#fff;font-weight:700;border:0}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;font-size:10.5px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:4px}
.key{width:11px;height:14px;border-radius:1px 2px 2px 1px;display:inline-block}

/* ══ シリーズ札 ══ */
.series{display:flex;gap:12px;width:100%;padding:12px;margin-bottom:10px;
  background:var(--ink-2);border-radius:var(--r);border:1px solid var(--ink-3);
  animation:rise .3s cubic-bezier(.2,.8,.3,1) both}
.series.buy{border-color:rgba(210,96,74,.5)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mini{flex:0 0 50px;height:75px;border-radius:2px 4px 4px 2px;overflow:hidden;
  box-shadow:0 3px 8px rgba(0,0,0,.45);position:relative}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.sbody{flex:1;min-width:0}
.stitle{font-family:"Noto Serif JP",serif;font-size:15px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ssub{font-size:11.5px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
.ssub .miss{color:var(--alert);font-weight:700}
.ssub .fin{color:var(--jade);font-weight:700}
/* 新刊＝まだ棚に無い、所持より先の巻。買い逃しを金で目立たせる */
.fresh{color:var(--foil);font-weight:700}
.v.fresh{border:1px dashed var(--foil);color:var(--foil);font-weight:700}

/* ══ 単巻グリッド ══ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:15px 11px;align-items:end}
.book{display:block;width:100%;animation:rise .3s cubic-bezier(.2,.8,.3,1) both}
.jacket{position:relative;width:100%;aspect-ratio:2/3;background:var(--ink-2);
  border-radius:3px 5px 5px 3px;overflow:hidden;
  box-shadow:0 5px 10px rgba(0,0,0,.45),inset 3px 0 0 rgba(0,0,0,.3)}
.jacket img{width:100%;height:100%;object-fit:cover;display:block}
.jacket.ghost{opacity:.62}
.jacket.ghost::after{content:"";position:absolute;inset:0;border:1px dashed var(--ink-4);border-radius:inherit}
.fallback{position:absolute;inset:0;display:flex;align-items:center;padding:9px 8px 9px 12px;
  font-family:"Noto Serif JP",serif;font-size:11px;line-height:1.45;color:var(--paper);
  background:linear-gradient(100deg,var(--ink-3),var(--ink-2));overflow:hidden}
.pin{position:absolute;top:0;right:6px;width:11px;height:21px;background:var(--foil);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.pin.read{background:var(--jade)} .pin.now{background:var(--alert)} .pin.anime{background:var(--violet)}
.t{margin-top:7px;font-size:11.5px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail{height:5px;margin-top:12px;border-radius:2px;
  background:linear-gradient(180deg,#4A3B2C,var(--shelf));box-shadow:0 3px 7px rgba(0,0,0,.5)}

/* 圏外のときに「壊れた」と誤解されないよう、検索が使えない理由を先に示す */
.offline{display:block;padding:8px 13px;margin-bottom:10px;border-radius:var(--r);
  font-size:12px;color:var(--ink);background:var(--foil);font-weight:700}
.hint{display:block;width:100%;padding:10px 13px;margin-bottom:12px;border-radius:var(--r);
  font-size:12.5px;line-height:1.5;color:var(--paper);
  background:var(--ink-2);border:1px solid var(--foil-dim)}
.empty{padding:56px 6px;text-align:center;color:var(--dim);font-size:13.5px}
.empty strong{display:block;font-family:"Noto Serif JP",serif;color:var(--paper);
  font-size:16px;letter-spacing:.1em;margin-bottom:8px}

/* ══ 下部バー ══ */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;
  padding:11px 16px;padding-bottom:calc(11px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,var(--ink) 70%,rgba(20,28,46,0))}
.btn{flex:1;padding:13px;border-radius:var(--r);text-align:center;font-weight:700;
  letter-spacing:.08em;font-size:14px;background:var(--foil);color:#1A1305}
.btn:active{transform:translateY(1px)}
.btn.ghost{flex:0 0 auto;padding:13px 15px;background:var(--ink-2);color:var(--paper);
  border:1px solid var(--ink-3);font-weight:500;letter-spacing:0}

/* ══ スキャナ ══ */
.scanner{position:fixed;inset:0;z-index:50;background:#000;display:none}
.scanner.on{display:block}
video{width:100%;height:100%;object-fit:cover}
.reticle{position:absolute;top:40%;left:8%;right:8%;height:126px;transform:translateY(-50%);
  border:2px solid var(--foil);border-radius:6px;box-shadow:0 0 0 100vmax rgba(0,0,0,.58)}
.reticle::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;
  background:var(--alert);opacity:.85;animation:sweep 2s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-54px)}50%{transform:translateY(54px)}}
.scanhint{position:absolute;left:0;right:0;top:calc(40% + 80px);text-align:center;
  font-size:13px;color:#fff;text-shadow:0 1px 4px #000;padding:0 24px}
.log{position:absolute;left:16px;right:16px;bottom:calc(102px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:5px}
.log div{background:rgba(0,0,0,.55);border-left:3px solid var(--foil);padding:6px 10px;
  font-size:12px;border-radius:0 5px 5px 0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;animation:rise .25s both}
.close{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(34px + env(safe-area-inset-bottom));background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.3);color:#fff;padding:12px 34px;border-radius:999px;font-size:14px}
.flash{position:absolute;inset:0;background:var(--foil);opacity:0;pointer-events:none}
.flash.go{animation:fl .3s ease-out}
@keyframes fl{from{opacity:.5}to{opacity:0}}

/* ══ シート ══ */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;background:rgba(6,9,17,.76)}
.sheet.on{display:flex}
/* 詳細シートは画面の9割を覆うので、背景をタップして閉じる余白がほとんど残らない。
   指の届く位置に閉じるボタンを重ねる */
.sheetx{position:absolute;top:0;right:8px;width:48px;height:48px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;line-height:1;color:var(--paper);
  background:rgba(20,28,46,.82);border-radius:50%;z-index:61;
  margin-top:calc(env(safe-area-inset-top) + 8px)}
.card{width:100%;background:var(--ink-2);border-radius:16px 16px 0 0;
  padding:20px 17px calc(22px + env(safe-area-inset-bottom));
  border-top:2px solid var(--foil-dim);animation:up .26s cubic-bezier(.2,.8,.3,1);
  max-height:90vh;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.head{display:flex;gap:14px}
.head .big{flex:0 0 88px;height:132px;border-radius:2px 5px 5px 2px;overflow:hidden;position:relative;
  box-shadow:0 6px 14px rgba(0,0,0,.5)}
.head .big img{width:100%;height:100%;object-fit:cover;display:block}
.head .info{flex:1;min-width:0}
.card h2{font-family:"Noto Serif JP",serif;font-size:16.5px;margin:0 0 5px;line-height:1.5}
.meta{font-size:12.5px;color:var(--dim);margin:0 0 2px}
.isbn{font-size:11px;color:var(--foil-dim);letter-spacing:.08em;margin-top:7px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;padding:9px 0;border-radius:8px;text-align:center;font-size:12.5px;
  background:var(--ink-3);color:var(--dim)}
.seg button.on{background:var(--foil);color:#1A1305;font-weight:700}
.seg.four button{font-size:12px}
.lab{font-size:10.5px;letter-spacing:.16em;color:var(--dim);margin:15px 0 5px}
.toggle{display:flex;align-items:center;justify-content:space-between;
  background:var(--ink-3);border-radius:8px;padding:10px 13px;margin-top:8px;width:100%;font-size:13.5px}
.toggle.on{background:var(--violet);color:#0B0716;font-weight:700}
.stars{display:flex;gap:5px;margin-top:8px}
.stars button{flex:1;padding:8px 0;text-align:center;border-radius:8px;background:var(--ink-3);
  color:var(--ink-4);font-size:16px;line-height:1}
.stars button.on{color:var(--foil)}
.field{margin-top:9px}
.field input,.field textarea{width:100%;background:var(--ink);border:1px solid var(--ink-3);
  border-radius:8px;color:var(--paper);padding:9px 11px;font-size:13.5px;resize:vertical}
.field select{background:var(--ink);border:1px solid var(--ink-3);border-radius:8px;
  color:var(--paper);padding:9px 11px;font:inherit;font-size:13.5px;min-height:44px}
.acts{display:flex;gap:8px;margin-top:18px}
.acts button{flex:1;padding:12px;border-radius:var(--r);text-align:center;font-size:14px;background:var(--ink-3)}
.acts .del{background:transparent;border:1px solid var(--alert);color:var(--alert);flex:0 0 32%}
.acts .save{background:var(--foil);color:#1A1305;font-weight:700}

.covers{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.covers::-webkit-scrollbar{display:none}
.covers button{flex:0 0 54px;position:relative}
.covers .c{width:54px;height:81px;border-radius:2px 4px 4px 2px;overflow:hidden;position:relative;
  box-shadow:0 3px 8px rgba(0,0,0,.45)}
.covers .c img{width:100%;height:100%;object-fit:cover;display:block}
.covers .c.ghost{opacity:.55}
.covers .num{text-align:center;font-size:10.5px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}

.hit{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ink-3);width:100%}
.hit img,.hit .ph{width:38px;height:56px;object-fit:cover;border-radius:2px;flex:0 0 38px}
.hit .ph{background:var(--ink-3)}
.hit .n{flex:1;min-width:0;font-size:13px;line-height:1.4}
.hit .n .alt{font-style:normal;font-size:10px;color:var(--foil);border:1px solid var(--foil-dim);
  border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:1px}
.hit .n small{display:block;color:var(--dim);font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit .go{flex:0 0 auto;background:var(--foil);color:#1A1305;font-weight:700;
  padding:8px 14px;border-radius:8px;font-size:12.5px}
.hit .go.done{background:transparent;color:var(--dim);font-weight:400}
/* 選択の印。指で押す前提なので枠を大きめに取る */
.tick{flex:0 0 26px;height:26px;border-radius:6px;border:1px solid var(--ink-4);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--dim)}
.tick.on{background:var(--alert);border-color:var(--alert);color:#fff;font-weight:700}
.bulk{display:block;width:100%;padding:12px;border-radius:11px;text-align:center;
  background:var(--foil);color:#1A1305;font-weight:700;font-size:13.5px;margin:8px 0 4px}
.bulk.done{background:transparent;border:1px solid var(--ink-4);color:var(--dim);font-weight:400}
.rows .r{display:flex;justify-content:space-between;padding:8px 0;
  border-bottom:1px solid var(--ink-3);font-size:13.5px}
.rows .r span:last-child{color:var(--foil);font-variant-numeric:tabular-nums}
.menu button{display:block;width:100%;padding:13px 2px;border-bottom:1px solid var(--ink-3);font-size:14px}
.ghost2{padding:13px 16px;border-radius:var(--r);background:var(--ink-3);color:var(--paper);
  font-size:13.5px;white-space:nowrap}
.menu button.on{color:var(--foil);font-weight:700}
.menu button.on::after{content:"　✓"}

.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(92px + env(safe-area-inset-bottom));z-index:70;background:var(--paper);color:var(--ink);
  font-size:13.5px;font-weight:500;padding:11px 20px;border-radius:999px;
  box-shadow:0 6px 20px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.toast.warn{background:var(--alert);color:#fff}
.toast.act{pointer-events:auto}
.toast button{margin-left:14px;font-weight:700;color:#7A5417;text-decoration:underline;white-space:nowrap}

/* ══ 機能CSS（見た目の刷新時も消さない） ══
   画面外のカードのレイアウト・描画をブラウザに飛ばさせる。
   棚が育っても、見えているぶんのコストしか払わない */
.series{content-visibility:auto;contain-intrinsic-size:auto 110px}
.book{content-visibility:auto;contain-intrinsic-size:auto 190px}
/* 初回以降の描き直し（絞り込み・保存後）では出現アニメを繰り返さない */
main.still .series,main.still .book{animation:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--foil);outline-offset:2px}
.sync-book{margin:16px 0;padding:12px;border:1px solid #ccc;border-radius:8px;overflow-wrap:anywhere}
.sync-book summary{cursor:pointer;min-height:44px;line-height:1.6}
.sync-field{padding:10px 0;border-top:1px solid #ccc}
.sync-choice{display:block;width:100%;min-height:44px;margin:8px 0;font:inherit}
.sync-values{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.sync-values p{margin:6px 0}
.sync-check{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;overflow-wrap:anywhere}
.sync-check input{flex-shrink:0;width:20px;height:20px}
#syncresult,#syncmessage{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>

<header>
  <div class="brand"><h1>本棚</h1><span class="stat" id="stat"></span>
    <button class="sortbtn" id="sortbtn"></button></div>
  <input class="search" id="q" type="search" placeholder="棚の中を絞り込む（タイトル・著者・場所）"
    aria-label="棚の中を絞り込む" autocomplete="off">
  <div class="chips" id="chips"></div>
</header>

<main id="main"></main>

<div class="bar">
  <button class="btn" id="scan">バーコードを読む</button>
  <button class="btn ghost" id="find">探す</button>
  <button class="btn ghost" id="more">…</button>
</div>

<div class="scanner" id="scanner">
  <video id="video" playsinline muted></video>
  <div class="reticle"></div>
  <div class="flash" id="flash"></div>
  <p class="scanhint" id="hint">裏表紙の<b>上段</b>（978…）を枠に合わせてください</p>
  <div class="log" id="log"></div>
  <button class="close" id="stop">閉じる</button>
</div>

<div class="sheet" id="sheet"><div class="card" id="card"></div>
  <button class="sheetx" id="sheetx" aria-label="閉じる">×</button></div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   保存先：Claudeのプレビュー内では window.storage、
   自分でホストしたときは localStorage。
   ══════════════════════════════════════════════════════════════ */
const T0=performance.now();   // 起動の所要時間を測る基準点（スクリプト評価開始）
const KEY='bookshelf:v3', PREV=['bookshelf:v2','bookshelf:v1'];
const store={
  bad:false,   // 読み込みに失敗した印。立っている間は起動時の上書き保存をしない
  missing:new Set(), blocked:new Set(),
  async quarantine(k){
    this.bad=true; this.blocked.add(k);
    // 起動後の表紙補完や編集も、読めなかった元データを上書きしてはいけない。
    // 退避先が既にある場合は、その復旧材料も保持する。
    try{
      const read=async key=>window.storage?(await window.storage.get(key))?.value:localStorage.getItem(key);
      const raw=await read(k), old=await read(k+':broken');
      if(raw!=null&&old==null){
        if(window.storage) await window.storage.set(k+':broken',raw);
        else localStorage.setItem(k+':broken',raw);
      }
    }catch(e){}                         // 退避不能でも元キーへの書き込みは止める
  },
  async get(k){
    let raw=null;
    try{
      if(window.storage){ const r=await window.storage.get(k); raw=r?r.value:null; }
      else raw=localStorage.getItem(k);
    }catch(e){ this.bad=true; this.blocked.add(k); return null; }
    if(raw==null){ this.missing.add(k); return null; }
    this.missing.delete(k);
    try{ return JSON.parse(raw); }
    catch(e){
      // 壊れたデータは消さずに退避する。空で上書きすると復旧の手がかりごと失う
      await this.quarantine(k);
      return null;
    }
  },
  async set(k,v,quiet){
    if(this.blocked.has(k)){
      if(!quiet) toast('元の保存データを保護しているため、保存できません。控えの復旧が必要です',true);
      return false;
    }
    const s=JSON.stringify(v);
    try{
      if(window.storage){ await window.storage.set(k,s); return true; }
      localStorage.setItem(k,s);
      return true;
    }catch(e){
      /* 置き場所が足りないのなら、まず検索の控えを捨てて場所を空ける。
         棚そのものより控えのほうが失って構わないのに、
         先に場所を取っていたせいで大事なほうが負ける、を防ぐ */
      if(!quiet&&k!==QKEY&&dropQCache()){
        try{
          if(window.storage){
            await window.storage.set(QKEY,'{}');
            await window.storage.set(k,s);
          }else localStorage.setItem(k,s);
          return true;
        }catch(e2){}
      }
      if(!quiet) toast('保存できませんでした',true);   // 検索の控えの保存失敗は騒がない
      return false;
    }
  }
};
// 保存＝棚が変わった印。束ねの計算結果（build のメモ）はここで捨てる
const save=(next=books)=>{ buildCache=null; return store.set(KEY,next); };
// 非同期保存中の別操作も直列にする。失敗した候補を棚や履歴へ反映しない。
let stateQueue=Promise.resolve();
const stateJob=fn=>{ const p=stateQueue.then(fn); stateQueue=p.catch(()=>{}); return p; };
async function changeBooks(make){
  return stateJob(async()=>{
    const next=make(books);
    if(!next||await save(next)===false) return false;
    books=next; buildCache=null; return true;
  });
}
const metaSnapshot=()=>Object.assign({},meta,{done:[...doneKeys],sort:sortBy,dir:sortDir});
async function changeMeta(make){
  return stateJob(async()=>{
    const next=make(JSON.parse(JSON.stringify(metaSnapshot())));
    if(!next||await store.set(META,next)===false) return false;
    meta=next; loadMeta(next); return true;
  });
}
const PENDING='bookshelf:pending-import';
// 2キーの読み込みは旧値を先に保存。途中で電源が切れても起動時に旧状態へ戻す。
async function restorePending(record){
  const a=await store.set(KEY,record.before.books,true);
  const b=await store.set(META,record.before.meta,true);
  const cleared=a&&b&&await store.set(PENDING,null,true);
  if(!cleared){ store.blocked.add(KEY); store.blocked.add(META); }
  return !!cleared;
}
async function importState(incoming,data){
  return stateJob(async()=>{
    if(store.blocked.has(KEY)||store.blocked.has(META)||store.blocked.has(PENDING)) return false;
    const seen=new Set(books.map(b=>b.isbn)), next=books.slice(), nextMeta=JSON.parse(JSON.stringify(metaSnapshot()));
    incoming.forEach(b=>{ if(!seen.has(b.isbn)){ next.push(b); seen.add(b.isbn); } });
    next.sort((x,y)=>(y.added||0)-(x.added||0));
    if(!Array.isArray(data)){
      nextMeta.done=[...new Set(nextMeta.done.concat((Array.isArray(data.done)?data.done:[]).filter(k=>typeof k==='string')))];
      if(data.sort&&SORTS.some(x=>x.id===data.sort)) nextMeta.sort=data.sort;
      if(data.dir===1||data.dir===-1) nextMeta.dir=data.dir;
    }
    const added=next.length-books.length;
    return await writeShelfState(next,nextMeta)?{added}:false;
  });
}
// 読み込みと端末間の反映で同じ復旧手順を使う。stateJob の中から呼ぶ。
async function writeShelfState(next,nextMeta){
  const record={version:1,before:{books,meta:metaSnapshot()}};
  if(await store.set(PENDING,record)===false) return false;
  const written=await store.set(KEY,next)&&await store.set(META,nextMeta);
  if(!written||await store.set(PENDING,null,true)===false){
    const restored=await restorePending(record);
    toast(restored?'読み込みを保存できませんでした。元の棚に戻しました。もう一度試してください'
      :'読み込みを保存できませんでした。元の棚を表示し、変更を停止しています。控えを取り、再起動してください',true);
    return false;
  }
  books=next; meta=nextMeta; loadMeta(nextMeta); buildCache=null; return true;
}
async function recoverPending(){
  const record=await store.get(PENDING);
  if(store.blocked.has(PENDING)){ store.blocked.add(KEY); store.blocked.add(META); return null; }
  if(record==null) return null;
  try{
    if(record.version!==1||!record.before||!Array.isArray(record.before.books)) throw new Error('復旧記録が不正です');
    const before={books:record.before.books.map(normalize),meta:record.before.meta};
    validateMeta(before.meta);
    if(!before.meta) throw new Error('復旧設定がありません');
    const restored=await restorePending(record);
    return {before,restored};
  }catch(e){
    await store.quarantine(PENDING); store.blocked.add(KEY); store.blocked.add(META); return null;
  }
}

let books=[], filter='', mode='all', addOwn='paper';
/* 探す画面のワンタップ候補。
   棚が空のうちは例として有名どころを出し、本が入ったら
   「抜けのあるシリーズ」を先に出す。探したいのはたいてい足りない巻なので。 */
const SEEDS=['オーバーロード','幼女戦記','Re:ゼロから始める異世界生活','ソードアート・オンライン'];
function presets(){
  if(!books.length) return SEEDS;
  const gs=build(books).filter(g=>g.isSeries);
  const holes=gs.filter(g=>g.buy.length).sort((a,b)=>b.buy.length-a.buy.length).map(g=>g.series);
  const recent=[...gs].sort((a,b)=>
    Math.max(...b.items.map(x=>x.added||0))-Math.max(...a.items.map(x=>x.added||0))).map(g=>g.series);
  const seen=new Set(), out=[];
  [...holes,...recent,...SEEDS].forEach(n=>{
    const k=skey(n); if(n&&!seen.has(k)&&out.length<4){ seen.add(k); out.push(n); }
  });
  return out;
}

/* 所有と体験を別の軸にする（Libro の考え方）。
   「持ってないけど読んだ」も「アニメだけ見た」もこれで表せる。 */
const OWNS  =[{id:'paper',label:'紙'},{id:'digital',label:'電子'},{id:'none',label:'未所持'}];
const STATES=[{id:'stock',label:'未読'},{id:'now',label:'読書中'},
              {id:'read',label:'読了'},{id:'stop',label:'中断'}];
const ownLabel=id=>(OWNS.find(o=>o.id===id)||OWNS[0]).label;

const isISBN13=s=>/^97[89]\d{10}$/.test(s)&&cd(s);
function cd(s){let n=0;for(let i=0;i<12;i++)n+=(+s[i])*(i%2?3:1);return (10-n%10)%10===+s[12];}
// 古い本は ISBN-10 しか持たないレコードが珍しくないので変換して拾う
function isbn13from10(v){
  const t=String(v||'').replace(/[^0-9Xx]/g,'').toUpperCase();
  if(t.length!==10) return null;
  // ISBN-10 側のチェックデジットも確かめる。誤記のまま変換すると偽のISBNができる
  let s=0; for(let i=0;i<9;i++) s+=(+t[i])*(10-i);
  const chk=(11-s%11)%11;
  if(t[9]!==(chk===10?'X':String(chk))) return null;
  const core='978'+t.slice(0,9);
  let n=0; for(let i=0;i<12;i++) n+=(+core[i])*(i%2?3:1);
  return core+((10-n%10)%10);
}

/* ══════════════════════════════════════════════════════════════
   シリーズ判定：タイトルから作品名と巻数を切り出す
   ══════════════════════════════════════════════════════════════ */
const KAN={'上':1,'中':2,'下':3};
// 全角英数記号をすべて半角に寄せる（「Ｒｅ：ゼロ」と「Re:ゼロ」を同じ作品として扱うため）
const norm=s=>String(s||'').replace(/[\uFF01-\uFF5E]/g,
  c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\u3000/g,' ').trim();
// シリーズ名の突き合わせ鍵。表記ゆれで同じ作品が二段に割れるのを防ぐ
const skey=s=>norm(s).toLowerCase().replace(/\s+/g,'');
/* 読み仮名の表記ゆれだけを揃える。「亜人(デミ)」は「亜人」と同じ。
   副題の一律削除は氷結の絆・外伝まで本編に混ぜるため、確認済みの別見出しだけ扱う。 */
const mainTitle=s=>norm(s)
  .replace(/^亜人\s*[（(]\s*デミ\s*[)）]\s*/,'亜人')
  .replace(/^電波教師\s*:\s*HE IS A ULTIMATE TEACHER\s*$/i,'電波教師');
const mkey=s=>skey(mainTitle(s));
// NDLでは短編集・Ex・章が題名ではなく巻表示に入る。取得は本題、採用はシリーズ完全一致。
const seriesQuery=s=>mainTitle(s).replace(/\s+(短編集|Ex|第\d+章(?:\s*[（(].*[)）])?)$/i,'');
function parseSeries(raw){
  let t=norm(raw);
  const family=t.match(/^(.+?)\s*(短編集|Ex)\s*(\d{1,3})(?:\s*[（(].*[)）])?$/i);
  if(family&&+family[3]>=1&&+family[3]<=200) return {series:mainTitle(family[1])+' '+(family[2].toLowerCase()==='ex'?'Ex':'短編集'),vol:+family[3]};
  t=t.replace(/\s*[（(][^（）()]*[)）]\s*$/,m=>/[\d上中下]/.test(m)?m:'');
  const pats=[
    /^(.+?)\s*第\s*(\d{1,3})\s*[巻話]\s*$/,
    /^(.+?)\s*[（(]\s*(\d{1,3})\s*[)）]\s*$/,
    /^(.+?)\s+(\d{1,3})\s*[〜~ー-].*$/,
    /^(.+?)\s*(\d{1,3})\s*巻\s*$/,
    /^(.+?)\s+(\d{1,3})\s*$/,
    /^(.+?)\s*[-–—]\s*(\d{1,3})\s*$/,
    /^(.+?[^\x00-\x7F])(\d{1,3})$/,          // 直前が非ASCIIのときだけ（"Python3 入門"を弾く）
    /^(.+?[^\x00-\x7F])(\d{1,3})\s+\S.*$/
  ];
  for(const p of pats){
    const m=t.match(p); if(!m) continue;
    const v=+m[2], name=m[1].trim();
    if(/[全巻第]$/.test(name)) continue;                        // 「全14巻」は箱入り
    if(/^0\d/.test(m[2])||v<1||v>200||name.length<2) continue;  // 0079 のような型番
    return {series:name, vol:v};
  }
  const k=t.match(/^(.+?)\s*[（(]?\s*([上中下])\s*[)）]?\s*$/);
  if(k&&k[1].trim().length>=2) return {series:k[1].trim(), vol:KAN[k[2]]};
  return {series:null, vol:null};
}
const classificationIssue=b=>{
  if(!/(短編集|Ex)\s*\d/i.test(norm(b.title))) return false;
  const p=parseSeries(b.title);
  return !!(p.series&&b.series&&(mkey(p.series)!==mkey(b.series)||p.vol!==b.vol));
};

/* ══ 書誌の取得 ══
   国会図書館を先に引く。openBD の題名は「オーバーロード = OVERLORD. 1」のように
   原題が併記されていて、そのままだとバーコードで入れた巻が
   検索で入れた巻と別のシリーズに割れてしまう。 */
async function fetchByISBN(isbn,signal){
  let error=null;
  try{
    const j=await ndlQuery({isbn,cnt:5,signal});
    const hit=j.find(x=>x.isbn===isbn);
    if(hit){ lastError=null; return hit; }
  }catch(e){ if(isCancelled(e,signal)) throw e; error=e; }
  try{
    const [d]=await requestData(`https://api.openbd.jp/v1/get?isbn=${isbn}`,'json',{signal}); const s=d&&d.summary;
    if(s&&s.title){ lastError=null; return {isbn,title:ndlTitle(s.title),author:s.author||'',
      // 刊行日は国会図書館と同じ YYYYMM に揃える。生のままだと刊行順の並びが壊れる
      publisher:s.publisher||'',date:ym(s.pubdate),cover:s.cover||'',src:'openBD'}; }
  }catch(e){ if(isCancelled(e,signal)) throw e; error=e; }
  checkSignal(signal); lastError=error;
  return null;
}
/* 国会図書館サーチを共通の検索口にする。
   Google Books はキー無しの利用が打ち切られており（quota 0 のまま 429 を返す）、
   和書の網羅率もこちらが上。巻数は dcndl:volume として構造化されて返るので、
   題名から巻数を推測する必要がそもそも無い。 */
let lastError=null;                      // 直近の通信エラー。原因を利用者に見せるため保持する
const errText=e=>{
  if(e&&e.name==='TimeoutError') return '応答に時間がかかりすぎました。もう一度試すか、手で登録できます';
  if(e&&e.name==='AbortError') return '調査を中止しました';
  if(e&&e.name==='EditionAmbiguousError') return e.message;
  if(e&&['PartialResultsError','SeriesMismatchError'].includes(e.name)) return e.message;
  if(e&&e.name==='UnresolvedVolumesError') return e.message;
  const m=(e&&e.message)||'';
  if(/保存できません/.test(m)) return m;
  if(/HTTP 429/.test(m)) return 'アクセスが多すぎると断られました（しばらく待つと戻ります）';
  if(/^HTTP /.test(m))   return '相手のサーバがエラーを返しました（'+m+'）';
  return '通信が届きませんでした。ネットワークか、ページの置き場所の制限かもしれません';
};

const NDL='https://ndlsearch.ndl.go.jp/api/opensearch';
const isCancelled=(e,signal)=>!!(signal&&signal.aborted)||e&&e.name==='AbortError';
const checkSignal=signal=>{ if(signal&&signal.aborted) throw signal.reason||new DOMException('中止しました','AbortError'); };
function abortable(p,signal){
  checkSignal(signal);
  if(!signal) return p;
  return new Promise((resolve,reject)=>{
    const stop=()=>reject(signal.reason||new DOMException('中止しました','AbortError'));
    signal.addEventListener('abort',stop,{once:true});
    Promise.resolve(p).then(resolve,reject).finally(()=>signal.removeEventListener('abort',stop));
  });
}
const waitRequest=(ms,signal)=>{
  checkSignal(signal);
  return new Promise((resolve,reject)=>{
    const end=()=>{ clearTimeout(timer); if(signal) signal.removeEventListener('abort',stop); };
    const stop=()=>{ end(); reject(signal.reason||new DOMException('中止しました','AbortError')); };
    const timer=setTimeout(()=>{end();resolve();},ms);
    if(signal) signal.addEventListener('abort',stop,{once:true});
  });
};
// 応答本文まで30秒を上限にする。混雑/一時障害だけ1回再試行し、連打しない。
async function requestData(url,kind,{signal,timeout=30000}={}){
  for(let attempt=0;attempt<2;attempt++){
    checkSignal(signal);
    const ctl=new AbortController(), relay=()=>ctl.abort(signal.reason);
    if(signal) signal.addEventListener('abort',relay,{once:true});
    const timer=setTimeout(()=>ctl.abort(new DOMException('応答待ちの期限を超えました','TimeoutError')),timeout);
    let retry=0;
    try{
      const r=await abortable(fetch(url,{signal:ctl.signal}),ctl.signal);
      if(attempt===0&&[429,502,503,504].includes(r.status)){
        const raw=r.headers&&r.headers.get('Retry-After');
        const seconds=Number(raw), date=Date.parse(raw||'');
        retry=raw?(Number.isFinite(seconds)?seconds*1000:Math.max(0,date-Date.now())):1500;
        // 長いRetry-Afterは自動再試行せず利用者に待ってもらう。
        if(!Number.isFinite(retry)||retry>5000) throw new Error('HTTP '+r.status);
        retry=Math.max(1500,retry);
        if(r.body&&r.body.cancel) await abortable(r.body.cancel(),ctl.signal);
      }else{
        if(!r.ok) throw new Error('HTTP '+r.status);
        return await abortable(kind==='json'?r.json():r.text(),ctl.signal);
      }
    }finally{
      clearTimeout(timer); if(signal) signal.removeEventListener('abort',relay);
    }
    await waitRequest(retry,signal);
  }
}
// 同じ画面でやり直す／画面を離れると通信も止め、遅い旧応答を使わない。
const viewJobs=new Map();
function viewJob(key){
  const old=viewJobs.get(key); if(old) old.abort();
  const ctl=new AbortController(); viewJobs.set(key,ctl);
  return {signal:ctl.signal,current:()=>viewJobs.get(key)===ctl&&!ctl.signal.aborted,
    cancel:()=>{ctl.abort();if(viewJobs.get(key)===ctl)viewJobs.delete(key);}};
}
function cancelViewJobs(){ viewJobs.forEach(ctl=>ctl.abort()); viewJobs.clear(); }

const textOf=(el,tag)=>{ const n=el.getElementsByTagName(tag)[0]; return n?n.textContent.trim():''; };

/* 刊行日を YYYYMM に揃える。国会図書館は "2015.11" "2009.6" "[2019]" と形がまちまちで、
   数字だけ抜くと "201511" と "20096" のように桁数が揃わず、刊行順に並べられなくなる。 */
function ym(s){
  const t=String(s||'').trim();
  // openBD は "20151109" や "201511" の数字ひと続きで来る
  let m=t.match(/^(\d{4})(\d{2})(\d{2})?$/);
  if(m&&+m[2]>=1&&+m[2]<=12) return m[1]+m[2];
  m=t.match(/(\d{4})(?:\s*[.\-\/年]\s*(\d{1,2}))?/);
  if(!m) return '';
  return m[1]+(m[2]?String(+m[2]).padStart(2,'0'):'');
}
// dcndl:volume は "3" のことも "上" のことも "3上" のこともある
function volOf(s){
  const t=norm(s); if(!t) return null;
  const m=t.match(/^(?:第\s*|Vol\.?\s*)?(\d{1,3})(?:\s*巻|[上中下])?$/i);
  if(m){ const v=+m[1]; return (v>=1&&v<=200)?v:null; }
  return KAN[t]||null;
}
function ndlSeries(base,label){
  const t=norm(label), title=mainTitle(base);
  if(!t){ const p=parseSeries(title); return {series:p.series||title,vol:p.vol}; }
  let m=t.match(/^(短編集|Ex)\s*(\d{1,3})?(?:\s*[（(].*[)）])?$/i);
  if(m){ const family=m[1].toLowerCase()==='ex'?'Ex':'短編集';
    return {series:title+' '+family,vol:m[2]?volOf(m[2]):null,volumeLabel:t,volumeAmbiguous:!m[2]}; }
  m=t.match(/^(第\d+章(?:\s*[（(].*[)）])?)\s+(\d{1,3})$/);
  if(m) return {series:title+' '+m[1],vol:volOf(m[2]),volumeLabel:t};
  const vol=volOf(t);
  return {series:title,vol,volumeLabel:t,volumeAmbiguous:!vol};
}
/* 「オーバーロード = OVERLORD. 1」→ 見出し「オーバーロード 1」＋原題「OVERLORD」。
   原題は捨てずに持っておく。英語の題で探す人はここに当たる。
   「… : 第三章」は別作品なので触らない。 */
function ndlSplit(s){
  const t=norm(s), i=t.indexOf('=');
  if(i<0) return {base:t, alt:''};
  const head=t.slice(0,i).trim(), tail=t.slice(i+1).trim();
  if(!head||!/^[A-Za-z0-9 .,:'’!?&-]+$/.test(tail)) return {base:t, alt:''};   // ラテン文字の併記だけを対象にする
  const v=tail.match(/(\d{1,3})\s*$/);
  return {base:head+(v?' '+v[1]:''),
          alt:tail.replace(/[.,\s]*\d{1,3}\s*$/,'').trim()};
}
const ndlTitle=s=>ndlSplit(s).base;

/* 同じ検索を二段で覚えておく。
   メモリ（10分・進行中の取得も共有）に加えて、端末にも控えを残す：
   ISBN照会は30日（既刊の書誌は変わらない）、題名・全項目検索は6時間。
   リロードや翌日のやり直し（まとめて入力・巻ピッカー）が2〜6秒→即時になる。
   新刊チェックだけは fresh:true で両方を飛ばして必ず引き直す
   （キャッシュのせいで新刊が出ない、を仕組みで防ぐ）。
   SWで書誌を固定化しない方針はそのまま——これは期限と逃げ道つきの控え。 */
const qcache=new Map();
const QKEY='bookshelf:qcache';
const QVER=3; // 分割取得の完全性・番号未確定の記録を持たない旧控えは再利用しない。
const queryIssue=items=>{
  const c=items&&items.coverage;
  if(c&&(!c.complete||c.stale)){
    const e=new Error(c.stale?'通信できず古い結果を表示しています。全巻・新刊の確認は完了していません'
      :'検索応答が一部だけです。取得できた巻を表示していますが、全巻・新刊の確認は完了していません');
    e.name='PartialResultsError'; return e;
  }
  return null;
};
let qdisk=null, qdiskT=0;
async function qload(){
  if(!qdisk){
    qdisk=(await store.get(QKEY))||{};
    if(typeof qdisk!=='object'||Array.isArray(qdisk)) qdisk={};
  }
  return qdisk;
}
// 置き場所が足りないときの逃がし弁。控えは捨ててよい（次に引き直せばいい）
function dropQCache(){
  clearTimeout(qdiskT);
  const had=qdisk&&Object.keys(qdisk).length;
  qdisk={};
  try{ localStorage.removeItem(QKEY); }catch(e){}
  return !!had;
}
function qsave(){
  clearTimeout(qdiskT);
  qdiskT=setTimeout(()=>{
    // 棚本体の保存領域を控えで食い潰さないよう、古い順に間引いてから書く
    const ks=Object.keys(qdisk).sort((a,b)=>qdisk[a].t-qdisk[b].t);
    while(ks.length&&JSON.stringify(qdisk).length>1500000) delete qdisk[ks.shift()];
    store.set(QKEY,qdisk,true);
  },800);
}
let staleAt=0;                  // 「古い結果でしのいだ」通知を連発しないための時刻
async function ndlQuery(p){
  const u=NDL+'?mediatype=books&cnt='+(p.cnt||200)+'&idx='+(p.idx||1)
    +(p.title?'&title='+encodeURIComponent(p.title):'')
    +(p.isbn ?'&isbn=' +encodeURIComponent(p.isbn) :'')
    +(p.any  ?'&any='  +encodeURIComponent(p.any)  :'')
    +(p.from ?'&from='+encodeURIComponent(p.from):'')
    +(p.until?'&until='+encodeURIComponent(p.until):'');
  const qd=await qload(); checkSignal(p.signal);
  if(!p.fresh){
    const hit=qcache.get(u);
    if(hit&&Date.now()-hit.t<600000&&(!p.signal||hit.items)) return hit.items||hit.p;
    const dk=qd[u];
    if(dk&&dk.v===QVER&&Date.now()-dk.t<(p.isbn?2592000000:21600000)){
      const items=dk.items.slice(); items.coverage=dk.coverage; return items;
    }
  }
  const entry={t:Date.now()};
  const job=ndlFetch(u,p.signal).then(items=>{
    checkSignal(p.signal);
    if(qcache.get(u)!==entry) return items;
    entry.items=items;
    /* 端末に残すのは「大きく引いて実際に当たった」応答だけ。
       0件を残すと、NDLが一時的に不調で 200＋空を返したときに
       「見つかりませんでした」が6時間固定されてしまう。
       打鍵ごとのサジェスト（cnt=25）も残さない——数が多く、
       古い順の間引きで肝心の全巻リスト（cnt=500）を押し流す。 */
    if(items.length&&!queryIssue(items)&&(p.cnt||200)>=200){ qd[u]={v:QVER,t:Date.now(),items,coverage:items.coverage}; qsave(); }
    return items;
  });
  entry.p=job; qcache.set(u,entry);
  try{ return await job; }
  catch(e){
    if(qcache.get(u)===entry) qcache.delete(u); // 旧応答の失敗で新しい結果を消さない
    if(isCancelled(e,p.signal)) throw e;
    /* 期限切れでも手元に控えがあれば、それでしのぐ。429で真っ白より
       「少し前の結果」のほうがましで、その旨は一度だけ知らせる。
       新刊チェック（fresh）は正直に失敗させる——古い控えで「新刊なし」を装わない */
    const dk=!p.fresh&&qd[u];
    if(dk&&dk.v===QVER){
      if(Date.now()-staleAt>4000){ staleAt=Date.now(); toast('通信できないため、少し前の結果を出しています',true); }
      const items=dk.items.slice(); items.coverage=Object.assign({},dk.coverage,{stale:true}); return items;
    }
    throw e;
  }
}
/* 501件目へページ送りはできない。出版年の重ならない区間に分け、件数・記録IDが
   合う場合だけ取得完了とする。日付不明・同年500件超・途中失敗・予算切れは未完了。
   通常の500件以内の問い合わせは増やさない。追加は最大6回、逐次・中止可能。 */
async function ndlSeriesQuery(p){
  const root=await ndlQuery(Object.assign({},p,{cnt:500}));
  const initial=root.coverage;
  if(!initial||initial.complete||initial.stale||initial.total<=500||!initial.received||p.from||p.until) return root;
  let remaining=6, issue=null;
  const observed=new Set((initial.recordKeys||[]).filter(Boolean));
  const merge=(a,b)=>{
    const seen=new Set();
    return a.concat(b).filter(x=>{const k=x._recordId||JSON.stringify([x.isbn,x.title,x.volumeLabel]);
      if(seen.has(k)) return false; seen.add(k); return true;});
  };
  const visit=async(items,lo,hi)=>{
    const c=items.coverage;
    if(!c||c.stale) return {items,complete:false,keys:[]};
    if(c.complete) return {items,complete:true,keys:c.recordKeys||[]};
    if(c.total<=500||lo>=hi||remaining<2) return {items,complete:false,keys:[]};
    const years=(c.years||[]).filter(y=>y>=lo&&y<=hi).sort((a,b)=>a-b);
    if(!years.length) return {items,complete:false,keys:[]};
    const pivot=Math.max(lo,Math.min(hi-1,years[Math.floor((years.length-1)/2)]));
    let a,b;
    try{
      remaining--; await waitRequest(250,p.signal);
      a=await ndlQuery(Object.assign({},p,{cnt:500,from:lo===1?null:String(lo).padStart(4,'0')+'-01-01',until:String(pivot).padStart(4,'0')+'-12-31'}));
      (a.coverage&&a.coverage.recordKeys||[]).filter(Boolean).forEach(k=>observed.add(k));
      remaining--; await waitRequest(250,p.signal);
      b=await ndlQuery(Object.assign({},p,{cnt:500,from:String(pivot+1).padStart(4,'0')+'-01-01',until:hi===9999?null:String(hi).padStart(4,'0')+'-12-31'}));
      (b.coverage&&b.coverage.recordKeys||[]).filter(Boolean).forEach(k=>observed.add(k));
    }catch(e){if(isCancelled(e,p.signal)) throw e; issue=e; return {items:merge(items,a||[]),complete:false,keys:[]};}
    // 年の無い記録が除外されたり、検索中に件数が変わった場合は全取得と断定しない。
    const usable=a.coverage&&b.coverage&&!a.coverage.stale&&!b.coverage.stale
      &&a.coverage.total!==null&&b.coverage.total!==null&&a.coverage.total+b.coverage.total<=c.total;
    if(!usable) return {items:merge(items,merge(a,b)),complete:false,keys:[]};
    const consistent=a.coverage.total+b.coverage.total===c.total;
    const left=await visit(a,lo,pivot), right=await visit(b,pivot+1,hi);
    const keys=left.keys.concat(right.keys);
    const keySet=new Set(keys);
    const complete=consistent&&left.complete&&right.complete&&keys.length===c.total
      &&keys.every(Boolean)&&keySet.size===c.total&&(c.recordKeys||[]).every(k=>keySet.has(k));
    return {items:merge(items,merge(left.items,right.items)),complete,keys};
  };
  const result=await visit(root,1,9999); checkSignal(p.signal);
  result.items.coverage=Object.assign({},initial,{complete:result.complete,partitioned:true,
    extraRequests:6-remaining,observedRecords:observed.size,recordKeys:result.keys,error:issue?issue.message:null});
  return result.items;
}
async function ndlFetch(u,signal){
  const text=await requestData(u,'text',{signal});
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('応答を読み取れませんでした');
  /* ここでISBNの重複を潰してはいけない。国会図書館は同じ本を複数の見出しで返し
     （「ソードアート・オンライン 1」は「アインクラッド」名義のレコードが先に来る）、
     先勝ちで潰すと正しい見出しのほうが消えて巻に穴が開く。
     重複はシリーズを絞り込んだ後、呼び出し側で落とす。 */
  const out=[];
  Array.prototype.forEach.call(doc.getElementsByTagName('item'),it=>{
    // 露・西・独語版などが混ざる。棚に入れたいのは日本で出た版だけ。
    // 値は "JP" のことも小文字 "ja" のこともある（実データで両方確認済み）
    const place=textOf(it,'dcndl:publicationPlace');
    if(place&&!/^j[ap]/i.test(place)) return;
    let isbn=null;
    Array.prototype.forEach.call(it.getElementsByTagName('dc:identifier'),n=>{
      if(isbn||!/^dcndl:ISBN(13)?$/.test(n.getAttribute('xsi:type')||'')) return;
      const raw=n.textContent.replace(/[^0-9Xx]/g,'');
      isbn = raw.length===10 ? isbn13from10(raw) : raw;
    });
    if(!isbn||!isISBN13(isbn)) return;
    const sp=ndlSplit(textOf(it,'dc:title'));
    const base=sp.base; if(!base) return;
    const label=textOf(it,'dcndl:volume'), parsed=ndlSeries(base,label);
    out.push(Object.assign({isbn, alt:sp.alt, _recordId:textOf(it,'guid')||textOf(it,'link'),title: label?base+' '+norm(label):base,
      // 「夏目, 漱石, 1867-1916」の形で来る。生没年は落として姓名だけ繋ぐ
      author:(textOf(it,'dc:creator')||'').replace(/,\s*\d{4}-(\d{4})?/g,'').replace(/,\s*/g,''),
      publisher:textOf(it,'dc:publisher'),
      date:ym(textOf(it,'dcterms:issued')||textOf(it,'dc:date')),
      cover:'', src:'国会図書館'},parsed));
  });
  const all=doc.getElementsByTagName('item').length;
  const totalText=textOf(doc,'openSearch:totalResults')||textOf(doc,'opensearch:totalResults');
  const total=/^\d+$/.test(totalText)?Number(totalText):null;
  const params=new URL(u).searchParams, start=Number(params.get('idx')||1), requested=Number(params.get('cnt')||200);
  // 件数はISBN・言語で除外する前のRSS item数と照合する。
  const rawItems=[...doc.getElementsByTagName('item')];
  const recordKeys=rawItems.map(it=>textOf(it,'guid')||textOf(it,'link'));
  const years=rawItems.map(it=>Number(ym(textOf(it,'dcterms:issued')||textOf(it,'dc:date')).slice(0,4))).filter(y=>y>=1&&y<=9999);
  out.coverage={total,received:all,start,requested,recordKeys,years,complete:total!==null&&all===total&&start===1};
  return out;
}
// 国会図書館が巻数を持っていればそれを使い、無いときだけ題名から推測する
const seriesOf=x=>x&&x.volumeAmbiguous?{series:x.series,vol:null}
  :(x&&x.vol)?{series:x.series,vol:x.vol}:parseSeries(x.title);

// 国会図書館は関連度順に返してくれないので、入力に近いものを手前へ寄せる。
// 原題（OVERLORD など）でも比べ、英語で探した人にも近い順で見せる
function rank(list,q){
  const k=mkey(q);
  const one=s=>s===k?0 : s.indexOf(k)===0?1 : s.indexOf(k)>=0?2 : 3;
  const score=x=>Math.min(one(mkey(x.series||x.title)), x.alt?one(skey(x.alt)):3);
  return list.map((x,i)=>[score(x),x.vol||999,i,x])
             .sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]).map(z=>z[3]);
}

// 題名で当たらなければ全項目検索に広げる。13桁の数字が来たらISBN照会に回す
async function searchBooks(q,signal){
  let error=null;
  let out=[];
  const t=norm(q), digits=t.replace(/[^0-9]/g,'');
  if(isISBN13(digits)){
    try{ const b=await fetchByISBN(digits,signal); if(b){ lastError=null; return [b]; } }catch(e){ if(isCancelled(e,signal)) throw e; error=e; }
    checkSignal(signal); if(error) lastError=error; return [];
  }
  /* 英数字の入力（OVERLORD 等の原題）は、題名検索だけだと外伝ばかり集まって
     本編が入らないことがある。全項目検索も足す——直列に待つと倍かかるので同時に投げる。
     日本語はたいてい題名検索だけで足りるので、足りないときだけ広げる（無駄撃ちしない）。 */
  const ascii=/^[\x20-\x7E]+$/.test(t);
  if(ascii){
    const [a,b]=await Promise.all([
      ndlQuery({title:t,cnt:200,signal}).catch(e=>{ if(isCancelled(e,signal)) throw e; error=e; return []; }),
      ndlQuery({any:t,cnt:200,signal}).catch(e=>{ if(isCancelled(e,signal)) throw e; error=e; return []; })]);
    error=error||queryIssue(a)||queryIssue(b); out=a.concat(b);
  }else{
    try{ out=await ndlQuery({title:t,cnt:200,signal}); error=error||queryIssue(out); }catch(e){ if(isCancelled(e,signal)) throw e; error=e; }
    if(out.length<8){
      try{ const more=await ndlQuery({any:t,cnt:200,signal}); error=error||queryIssue(more); out=out.concat(more); }catch(e){ if(isCancelled(e,signal)) throw e; error=e; }
    }
  }
  // 入力に近い見出しを先に並べてから重複を落とす。こうすると残るのが正しい見出しになる
  checkSignal(signal); lastError=error;
  return dedupe(rank(out,t));
}
const dedupe=list=>{ const s=new Set();
  return list.filter(x=>s.has(x.isbn)?false:(s.add(x.isbn),true)); };

/* シリーズ名から巻を集め、版（著者）ごとに束ねて返す。
   同じ題名に小説版と漫画版が同居することがある——「オーバーロード」は
   丸山くがね＝小説19巻 と 深山フギン＝漫画8巻 が同じ見出し。
   どの版を入れるかは呼び出し側（＝利用者）が選ぶ。
   NDLの上限500件を超える応答は確認未完了として扱う。 */
async function searchSeriesAll(name,fresh,signal){
  let error=null;
  let out=[];
  const q=seriesQuery(name);
  try{ out=await ndlSeriesQuery({title:q,fresh,signal}); error=queryIssue(out); }catch(e){ if(isCancelled(e,signal)) throw e; error=e; }
  if(out.length<3){ try{ const more=await ndlQuery({any:q,cnt:200,fresh,signal}); error=error||queryIssue(more); out=out.concat(more); }catch(e){ if(isCancelled(e,signal)) throw e; error=e; } }
  checkSignal(signal); lastError=error;
  const k=skey(name), mk=mkey(name);
  const cand=out.map(x=>Object.assign({},x,seriesOf(x))).filter(x=>x.vol||x.volumeAmbiguous);
  // 原題（OVERLORD 等）で探されたときも、日本語見出しの束に正しく集める
  const exact=cand.filter(x=>skey(x.series)===k||mkey(x.series)===mk
                            ||(x.alt&&skey(x.alt)===k));
  // 既存ISBNの誤分類は警告だけ。写真・手入力の番号や蔵書そのものは変更しない。
  const conflicts=books.filter(b=>mkey(b.series||'')===mk).filter(b=>{
    const records=out.filter(x=>x.isbn===b.isbn);
    return records.length&&!records.some(x=>mkey(x.series||'')===mk&&x.vol===b.vol);
  });
  if(conflicts.length&&!error){ error=new Error('登録済みのISBNに別シリーズ・巻の書誌があります。該当本の「シリーズ・巻を確認」で内容を確認してください'); error.name='SeriesMismatchError'; }
  lastError=error;
  const eds=splitEditions(exact);
  const unresolved=exact.filter(x=>!x.vol&&x.volumeAmbiguous);
  if(unresolved.length&&!error){error=new Error('巻番号を確定できない記録があります。候補を確認してください。新刊の確認は完了していません');error.name='UnresolvedVolumesError';}
  lastError=error;
  const result=eds.map(e=>{
    const vols=new Map();
    e.items.forEach(x=>{ if(x.vol&&!vols.has(x.vol)) vols.set(x.vol,x); });
    return {ak:e.ak, pk:e.pk, author:e.author, publisher:e.publisher,
            label:edLabel(e), count:vols.size,
            unplaced:dedupe(e.items.filter(x=>!x.vol&&x.volumeAmbiguous)),items:[...vols.values()].sort((a,b)=>a.vol-b.vol)};
  }).sort((a,b)=>b.count-a.count);
  Object.defineProperty(result,'error',{value:error}); return result;
}
/* ══ 外伝・スピンオフ ══
   「オーバーロード」で調べると本編以外に
   「オーバーロード不死者のOh!」「オーバーロード〈新〉世界編」
   「オーバーロード公式コミックアラカルト」が出てくる。
   同時に「オーバーロードの街」（神林長平）のような無関係な同名作品も来るので、
   作品名が前に付いているだけでは足りない。本編の著者と1人でも重なるものを
   「関連作品」として前に出し、そうでないものは「同じ名前の別作品」として後ろに置く。 */
const authSet=s=>new Set(String(s||'').split(/[、,\/／]/)
  .map(a=>skey(a.replace(/\s*(著|作|画|原作|イラスト|漫画)\s*$/,''))).filter(Boolean));
async function searchRelated(name,author,signal){
  let error=null;
  const q=seriesQuery(name), qk=mkey(name);
  let out=[];
  try{ out=await ndlSeriesQuery({title:q,signal}); error=queryIssue(out); }catch(e){ if(isCancelled(e,signal)) throw e; error=e; }
  checkSignal(signal); lastError=error;
  const mine=authSet(author);
  const byT=new Map();
  out.forEach(x=>{
    const p=seriesOf(x), s=mainTitle(p.series||x.title||'');
    const t=mkey(s);
    // 本編そのものは除く。作品名が前に付いているものだけを関連とみなす
    if(!t||t===qk||t.indexOf(qk)!==0) return;
    if(!byT.has(t)) byT.set(t,{title:s, items:[], auth:new Set()});
    const g=byT.get(t);
    g.items.push(Object.assign({},x,p));
    authSet(x.author).forEach(a=>g.auth.add(a));
  });
  return [...byT.values()].map(g=>{
    const vols=new Map();
    g.items.forEach(x=>{ if(x.vol&&!vols.has(x.vol)) vols.set(x.vol,x); });
    const shared=[...g.auth].some(a=>mine.has(a));
    return {title:g.title, shared, count:vols.size||g.items.length,
            author:(g.items[0]||{}).author||'',
            unplaced:dedupe(g.items.filter(x=>!x.vol&&x.volumeAmbiguous)),items:vols.size?[...vols.values()].sort((a,b)=>a.vol-b.vol):g.items};
  }).sort((a,b)=>(b.shared?1:0)-(a.shared?1:0)||b.count-a.count);
}

/* 新刊は選択した版だけ。版が曖昧なら別版の候補を選んでもらい、蔵書は動かさない。 */
function selectEdition(eds,prefer,name){
  const [ak,pk]=String(prefer||'').split('|');
  const exact=eds.filter(e=>e.ak===ak&&e.pk===(pk||''));
  let main=exact.length===1?exact[0]:null;
  if(!main){
    const owned=new Set(books.filter(b=>mkey(b.series||'')===mkey(name)&&akey(b.author)===ak
      &&(!pk||pkey(b.publisher)===pk)).map(b=>b.isbn));
    const matches=eds.filter(e=>e.items.some(b=>owned.has(b.isbn)));
    if(matches.length===1) main=matches[0];
  }
  if(!eds.length){ const out=[]; out.editions=[]; return out; }
  if(!main){ const e=new Error('版を特定できませんでした。別の版・出版社の候補を確認してください'); e.name='EditionAmbiguousError'; e.editions=eds; throw e; }
  const out=main.items.slice(); out.editions=eds.filter(e=>e!==main); return out;
}
async function searchSeries(name,prefer,fresh,signal,session){
  const key=mainTitle(name);
  let promise=session&&session.get(key);
  if(!promise){ promise=searchSeriesAll(name,fresh,signal); if(session) session.set(key,promise); }
  const eds=await promise; checkSignal(signal);
  if(eds.error) throw eds.error;
  return selectEdition(eds,prefer,name);
}

async function add(isbn,opts){
  opts=opts||{};
  if(store.blocked.has(KEY)){ toast('元の保存データを保護しています。復旧するまで登録できません',true); return null; }
  if(books.some(b=>b.isbn===isbn)){ if(!opts.quiet) toast('この本はもう棚にあります',true); return null; }
  if(!opts.quiet) toast('調べています…');
  // 検索結果から入れるときは書誌がもう手元にある。1冊ずつ引き直さない
  const b=opts.rec ? Object.assign({},opts.rec) : await fetchByISBN(isbn,opts.signal);
  if(!b){ if(!opts.quiet) toast(lastError?errText(lastError):'この ISBN の情報が見つかりません',true); return null; }
  // 通信を待っている間に別の登録が完了することがある（USB連続読取など）。
  if(books.some(x=>x.isbn===isbn)) return null;
  Object.keys(b).forEach(k=>{ if(k[0]==='_') delete b[k]; });   // 表示用の作業フィールドは保存しない
  Object.assign(b,seriesOf(b),{added:Date.now(),
    own:opts.own||'paper', status:'stock', anime:false, rate:0, place:'', note:''});
  if(opts.signal&&opts.signal.aborted) return null;
  if(!await changeBooks(current=>(opts.signal&&opts.signal.aborted)||current.some(x=>x.isbn===isbn)?null:[b,...current])) return null;
  logAct('追加',`${b.title}｜${ownLabel(b.own)}`);
  render();
  return b;
}

async function addMany(records,own){
  let got=[];
  const ok=await changeBooks(current=>{
    const seen=new Set(current.map(b=>b.isbn)); got=[];
    for(const rec of records){
      if(seen.has(rec.isbn)) continue;
      const b=Object.assign({},rec,seriesOf(rec),{added:Date.now(),own:own||'paper',status:'stock',anime:false,rate:0,place:'',note:''});
      Object.keys(b).forEach(k=>{ if(k[0]==='_') delete b[k]; });
      got.push(b); seen.add(b.isbn);
    }
    return got.length?[...got].reverse().concat(current):current.slice();
  });
  if(!ok) return null;
  got.forEach(b=>logAct('追加',`${b.title}｜${ownLabel(b.own)}`));
  render(); return got;
}

/* ══════════════════════════════════════════════════════════════
   棚の組み立て。「買うべき巻」＝ 未登録の穴 ＋ 未所持で登録した巻
   ══════════════════════════════════════════════════════════════ */
/* 束ねる鍵は「題名＋著者」。題名だけで束ねると、同じ題名の小説版と漫画版が
   1つに潰れ、巻が重なったほうが棚から見えなくなる（オーバーロードは
   小説19巻と漫画8巻が同じ見出しで、漫画の1〜8巻が触れなくなっていた）。
   著者は「丸山くがね／著」「丸山くがね、so-bin」のような揺れがあるので、
   先頭の1人だけを取り、肩書きを落として比べる。 */
const akey=s=>skey(String(s||'').split(/[、,\/／]/)[0]
  .replace(/\s*[／\/]?\s*(著|作|画|原作|イラスト|漫画)\s*$/,''));
// 出版社の突き合わせ鍵。「[KADOKAWA]」のような角括弧や「株式会社」の飾りを落とす
const pkey=s=>skey(String(s||'').replace(/[\[\]（）()]/g,'').replace(/^株式会社/,''));

/* ══ 版（小説版／漫画版）の切り分け ══
   同じ作品名・同じ著者でも、小説と漫画が別々に出ていることがある。
   「超人高校生たちは異世界でも余裕で生き抜くようです!」は国会図書館が
   漫画版でも原作者（海空りく）だけを返すので、著者では版を分けられない。
   そこで出版社を見る——ただし「オーバーロード」のように
   エンターブレイン→KADOKAWA と版元が変わっただけの作品を割ってはいけない。
   巻番号が重なる（同じ巻が両方にある）ときにだけ、別の版と見なす。 */
function splitEditions(items){
  const byA=new Map();
  items.forEach(x=>{ const a=akey(x.author||'');
    if(!byA.has(a)) byA.set(a,[]);
    byA.get(a).push(x); });
  const out=[];
  byA.forEach((list,a)=>{
    const whole=()=>out.push({ak:a, pk:'', author:(list[0]||{}).author||'',
                              publisher:'', items:list});
    const byP=new Map();
    list.forEach(x=>{ const p=pkey(x.publisher||'');
      if(!byP.has(p)) byP.set(p,[]);
      byP.get(p).push(x); });
    if(byP.size<2) return whole();
    const gs=[...byP.values()].map(l=>({l, vols:new Set(l.map(x=>x.vol).filter(Boolean))}));
    let overlap=false;
    for(let i=0;i<gs.length&&!overlap;i++)
      for(let j=i+1;j<gs.length&&!overlap;j++)
        if([...gs[i].vols].some(v=>gs[j].vols.has(v))) overlap=true;
    if(!overlap) return whole();                 // 版元の引き継ぎ。1つの版として扱う
    gs.forEach(g=>out.push({ak:a, pk:pkey(g.l[0].publisher||''),
      author:g.l[0].author||'', publisher:g.l[0].publisher||'', items:g.l}));
  });
  return out;
}
// 版の呼び名。同じ著者で版が分かれたときは出版社で見分ける
const edLabel=e=>(e.author||'').split(/[、,\/／]/)[0].trim()
  +(e.publisher?`／${e.publisher}`:'');

/* build は1回の描画で複数箇所（一覧・統計・催促・候補）から呼ばれ、
   棚が変わらない限り毎回同じ答えを返す。前回の結果を持っておき、
   棚が変わったとき（save）に捨てる。絞り込みの打鍵ごとの再計算が消える */
let buildCache=null;
function build(list){
  if(list===books&&buildCache) return buildCache;
  /* 読み仮名・確認済み別見出しだけを揃える。短編集・外伝の副題は残す。 */
  const m=new Map();
  list.forEach(b=>{
    const k=b.series?('S'+mkey(b.series)+'|'+akey(b.author)):('B'+b.isbn);
    if(!m.has(k)) m.set(k,{key:k,series:mainTitle(b.series||''),author:b.author||'',items:[]});
    const g=m.get(k);
    g.items.push(b);
    // 表示は短いほう（＝副題なし）を使う。「電波教師」と出したい
    const t=mainTitle(b.series||'');
    if(t&&t.length<g.series.length) g.series=t;
  });
  /* 著者が空の本（手入力など）は、同じ題名の束が1つだけならそこへ寄せる。
     2つ以上あるとどちらの版か決められないので、そのまま独立させる。 */
  const byTitle=new Map();
  m.forEach(g=>{ if(!g.series) return;
    const t=mkey(g.series);
    if(!byTitle.has(t)) byTitle.set(t,[]);
    byTitle.get(t).push(g); });
  byTitle.forEach(groups=>{
    const named=groups.filter(g=>akey(g.author));
    const blank=groups.filter(g=>!akey(g.author));
    if(named.length!==1||!blank.length) return;
    blank.forEach(g=>{ named[0].items.push(...g.items); m.delete(g.key); });
  });
  /* 同じ著者名で小説版と漫画版が混ざっている束を割る。
     国会図書館が漫画版でも原作者名だけを返す作品があり、
     このまま1つの束にすると同じ巻が二重になって片方が見えなくなる。 */
  const gs=[];
  m.forEach(g=>{
    if(!g.series){ gs.push(g); return; }
    const eds=splitEditions(g.items);
    if(eds.length<2){ gs.push(g); return; }
    eds.forEach(e=>{
      const sub=Object.assign({},g,{key:g.key+'|'+e.pk, items:e.items,
        author:e.author, edition:e.publisher||''});
      // 表示名は、その版が持つ最も短い見出しに合わせる
      e.items.forEach(b=>{ const t2=mainTitle(b.series||'');
        if(t2&&t2.length<sub.series.length) sub.series=t2; });
      gs.push(sub);
    });
  });
  gs.forEach(g=>{
    g.items.sort((a,b)=>(a.vol||0)-(b.vol||0)||(a.added||0)-(b.added||0));
    g.by=new Map(); g.extra=[];
    g.unplaced=g.items.filter(x=>!x.vol);
    // 同じ巻が2冊以上あるとき、はみ出したぶんは捨てずに持つ（棚から消えたように見えるため）
    g.items.filter(x=>x.vol).forEach(x=>{
      g.by.has(x.vol)?g.extra.push(x):g.by.set(x.vol,x); });
    g.max=Math.max(0,...g.by.keys());
    g.gaps=[]; g.want=[];
    if(g.series) for(let i=1;i<=g.max;i++){
      const b=g.by.get(i);
      if(!b) g.gaps.push(i);
      else if(b.own==='none') g.want.push(i);
    }
    g.buy=[...g.gaps,...g.want].sort((a,b)=>a-b);
    g.have=g.items.filter(x=>x.own!=='none').length;
    g.newest=Math.max(...g.items.map(x=>x.added||0));
    g.isSeries=!!g.series&&g.max>0;
  });
  // 同じ題名の束が2つ以上あるときだけ、札に著者や版元を添えて見分けられるようにする
  const cnt={};
  gs.forEach(g=>{ if(g.series){ const t=mkey(g.series); cnt[t]=(cnt[t]||0)+1; } });
  gs.forEach(g=>{ g.dup=!!(g.series&&cnt[mkey(g.series)]>1&&(g.author||g.edition)); });
  const out=gs.sort((a,b)=>b.newest-a.newest);
  if(list===books) buildCache=out;
  return out;
}

/* ══ 描画 ══ */
const CHIPS=[{id:'all',label:'すべて'},{id:'buy',label:'買うもの'},{id:'paper',label:'紙'},
  {id:'digital',label:'電子'},{id:'none',label:'未所持'},{id:'read',label:'読了'},{id:'anime',label:'アニメ'}];

/* ══ 並び替え ══
   棚が育つと「最近入れた順」だけでは目当てに辿り着けない。
   シリーズは束ねて扱うので、束ごとの代表値で並べる。 */
const SORTS=[
  {id:'added', label:'追加順',   pick:g=>-Math.max(...g.items.map(b=>b.added||0))},
  // 日付は "2020"（年のみ）と "201401"（年月）が混ざる。桁を6に揃えてから比べる
  {id:'date',  label:'刊行が新しい順', pick:g=>{
     const d=g.items.map(b=>b.date||'').filter(Boolean).sort();
     return d.length?-(+(d[d.length-1]+'00').slice(0,6)):0; }},
  {id:'old',   label:'刊行が古い順', pick:g=>{
     const d=g.items.map(b=>b.date||'').filter(Boolean).sort();
     return d.length?+(d[0]+'00').slice(0,6):Infinity; }},
  {id:'title', label:'題名順',   pick:g=>skey(g.series||g.items[0].title)},
  {id:'vol',   label:'巻数の多い順', pick:g=>-g.max},
  {id:'buy',   label:'買う巻が多い順', pick:g=>-g.buy.length},
  {id:'rate',  label:'評価の高い順', pick:g=>-Math.max(...g.items.map(b=>b.rate||0))}
];
let sortBy='added', sortDir=1;
const sortLabel=()=>((SORTS.find(s=>s.id===sortBy)||SORTS[0]).label)+(sortDir<0?'（逆順）':'');
// 題名は文字コード順だと「よ」が「オ」より前に来てしまうので、日本語の並びで比べる
const cmp=(a,b)=>(typeof a==='string'&&typeof b==='string')
  ? a.localeCompare(b,'ja') : (a<b?-1:a>b?1:0);
function applySort(gs){
  const s=SORTS.find(x=>x.id===sortBy)||SORTS[0];
  return gs.map((g,i)=>[s.pick(g),i,g])
           .sort((a,b)=>cmp(a[0],b[0])*sortDir||a[1]-b[1])
           .map(z=>z[2]);
}

let rendered=false, shelfLimit=60;
const bookSearch=new WeakMap();
function searchText(b){
  let text=bookSearch.get(b);
  if(text===undefined){ text=norm(b.title+' '+b.author+' '+b.publisher+' '+(b.series||'')+' '+(b.place||'')+' '+(b.note||'')).toLowerCase(); bookSearch.set(b,text); }
  return text;
}
function render(){
  // 2回目以降は出現アニメを止める（絞り込みや保存のたびに全カードが跳ねない）
  if(rendered) document.getElementById('main').classList.add('still');
  rendered=true;
  const owned=books.filter(b=>b.own!=='none').length;
  const all0=build(books);
  const buy=all0.reduce((n,g)=>n+g.buy.length,0);
  const fresh=all0.reduce((n,g)=>n+newOf(g).length,0);
  document.getElementById('stat').innerHTML=
    `所持${owned} / 登録${books.length}`+(buy?` · <b>買う${buy}</b>`:'')
    +(fresh?` · <span class="fresh">新刊${fresh}</span>`:'');
  document.getElementById('chips').innerHTML=CHIPS.map(c=>
    `<button class="chip ${mode===c.id?'on':''}" data-m="${c.id}">${c.label}</button>`).join('');
  document.getElementById('sortbtn').textContent=sortLabel()+' ▾';

  // 巻数ストリップは常に棚の全体から組み立てる。
  // 絞り込みは「どの作品を出すか」だけに効かせる（さもないと最大巻数が縮んで穴が増える）
  const hit=b=>{
    // norm() を通して全角半角ゆれを吸収する（「Re:ゼロ」で「Ｒｅ：ゼロ」も当てる）
    if(filter && !searchText(b).includes(filter)) return false;
    if(['paper','digital','none'].includes(mode)) return b.own===mode;
    if(mode==='read')  return b.status==='read';
    if(mode==='anime') return !!b.anime;
    return true;
  };
  const gs=build(books).filter(g=> mode==='buy'
    ? g.buy.length && (!filter || g.items.some(hit))
    : g.items.some(hit));

  const main=document.getElementById('main');
  if(!gs.length){
    main.innerHTML=books.length
      ? `<div class="empty"><strong>該当なし</strong>条件を変えてみてください。</div>`
      : `<div class="empty"><strong>棚はまだ空です</strong>
           手元の本は「バーコードを読む」、<br>
           持っていない本やアニメで見た作品は「探す」から。<br>
           シリーズは丸ごとまとめて入れられます。</div>`;
    return;
  }

  const series=applySort(gs.filter(g=>g.isSeries)), singles=applySort(gs.filter(g=>!g.isSeries));
  const singleBooks=singles.flatMap(g=>g.items), totalRows=series.length+singleBooks.length;
  const visibleSeries=series.slice(0,shelfLimit), visibleSingles=singleBooks.slice(0,Math.max(0,shelfLimit-series.length));
  let html=(navigator.onLine===false
    ? `<div class="offline">オフラインです。棚は見られますが、検索と新刊の確認はできません</div>` : '')
    + newHint() + exportHint();

  if(series.length){
    html+=`<div class="h">シリーズ ${series.length}</div>`;
    visibleSeries.forEach(g=>{
      const head=[...g.by.values()].pop()||g.items[0];
      const nv=newOf(g);
      let strip='';
      for(let i=1;i<=g.max;i++){
        const b=g.by.get(i);
        strip+=b?`<span class="v ${vcls(b)}">${i}</span>`:`<span class="v gap">${i}</span>`;
      }
      // 前回の新刊確認で見つかった、まだ棚に無い巻
      nv.forEach(v=>{ strip+=`<span class="v fresh">${v}</span>`; });
      strip+=`<span class="v next">+</span>`;
      html+=`<button class="series ${g.buy.length?'buy':''}" data-g="${esc(g.key)}">
        <div class="mini">${jacketImg(head,50,75)}</div>
        <div class="sbody">
          <div class="stitle">${esc(g.series)}</div>
          <div class="ssub">${g.dup?esc(g.author.split(/[、,\/／]/)[0]
            +(g.edition?'／'+g.edition:''))+' · ':''}所持${g.have} / 最新${g.max}巻${
            isDone(g)?' · <span class="fin">完結</span>':''}${
            g.buy.length?` · <span class="miss">未所持 ${g.buy.join('、')}</span>`:''}${
            nv.length?` · <span class="fresh">新刊 ${nv.join('、')}</span>`:''}</div>
          <div class="strip">${strip}</div>
        </div></button>`;
    });
  }

  if(singles.length){
    html+=`<div class="h">単巻 ${singles.reduce((n,g)=>n+g.items.length,0)}</div><div class="grid">`;
    // 巻の無い本が同じ束に複数入ることがある（手編集した読み込みなど）。全部描く
    let d=0;
    visibleSingles.forEach(b=>{
      html+=`<button class="book" data-isbn="${esc(b.isbn)}" style="animation-delay:${Math.min(d++,10)*20}ms">
        <div class="jacket ${b.own==='none'?'ghost':''}">${jacketImg(b)}${pin(b)}</div>
        <div class="t">${esc(b.title)}</div>
        <div class="a">${esc(b.author)}</div></button>`;
    });
    html+=`</div><div class="rail"></div>`;
  }

  if(totalRows>shelfLimit) html+=`<button class="bulk" id="morecards">続きを表示（残り${totalRows-shelfLimit}件）</button>`;
  html+=`<div class="legend">
    <span><i class="key" style="background:linear-gradient(180deg,#C9A34E,#8A7133)"></i>紙</span>
    <span><i class="key" style="border:1.5px solid #C9A34E"></i>電子</span>
    <span><i class="key" style="background:linear-gradient(180deg,#5E9E8C,#3F7466)"></i>読了</span>
    <span><i class="key" style="border:1px solid #9285C8"></i>アニメ</span>
    <span><i class="key" style="border:1px dashed #D2604A"></i>未登録</span></div>`;
  reconcileMain(main,html);
}
function reconcileMain(main,html){
  const template=document.createElement('template'); template.innerHTML=html;
  const key=el=>el.dataset.g?'S'+el.dataset.g:'B'+el.dataset.isbn;
  const old=new Map([...main.querySelectorAll('[data-g],[data-isbn]')].map(el=>[key(el),el]));
  template.content.querySelectorAll('[data-g],[data-isbn]').forEach(el=>{
    const signature=el.outerHTML, previous=old.get(key(el));
    if(previous&&previous._renderHTML===signature) el.replaceWith(previous);
    else el._renderHTML=signature;
  });
  main.replaceChildren(template.content);
}
const ymd=t=>{ const d=new Date(t);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; };
// "201511" → "2015年11月"。月が無ければ年だけ
const dateLabel=d=>d.slice(0,4)+'年'+(d.length>=6?(+d.slice(4,6))+'月':'');
/* 読了にした日を残す。読書ペースを振り返るための唯一の記録なので、
   読了を取り消したときだけ消す。既に読了の本を再保存しても日付は動かさない。 */
function setStatus(b,st){
  if(st==='read') b.readAt=b.readAt||Date.now();
  else b.readAt=0;
  b.status=st;
}
function vcls(b){
  return [b.own, b.status==='read'?'read':'', b.anime&&b.status!=='read'?'anime':'']
    .filter(Boolean).join(' ');
}
function pin(b){
  if(b.status==='read') return '<span class="pin read"></span>';
  if(b.status==='now')  return '<span class="pin now"></span>';
  if(b.anime)           return '<span class="pin anime"></span>';
  return '';
}
/* ══ 書影は3段構え ══
   Amazon（和書の網羅率が最も高く、353x500 と解像度も上）→ Google → 題名の文字。
   国会図書館の書影は Referer を自ドメインに限っていて他所からは403なので使えない。

   厄介なのは「表紙が無い」ときの返し方が業者ごとに違うこと。
   404 ではなく 200 で代替画像が返るため、寸法で見分ける必要がある。
     Amazon → 1x1 の透明画像
     Google → 128x170 の灰色画像                                    */
function isbn10from13(i13){
  if(!/^978\d{10}$/.test(i13||'')) return null;
  const c=i13.slice(3,12); let s=0;
  for(let i=0;i<9;i++) s+=(+c[i])*(10-i);
  const r=(11-s%11)%11;
  return c+(r===10?'X':r);
}
const aCover=isbn=>{ const t=isbn10from13(isbn);
  return t?`https://images-na.ssl-images-amazon.com/images/P/${t}.09.LZZZZZZZ.jpg`:''; };
const gCover=isbn=>/^\d{13}$/.test(isbn||'')
  ? `https://books.google.com/books/content?vid=ISBN${isbn}&printsec=frontcover&img=1&zoom=1` : '';
const coverKnown=new Map(), coverFailed=new Map(), coverUpdates=new Map();
const coverSrcs=b=>{
  const known=coverKnown.get(b.isbn), first=known&&known.original===(b.cover||'')?known.src:b.cover;
  return [...new Set([first,b.cover,aCover(b.isbn),gCover(b.isbn)].filter(Boolean))]
    .filter(url=>Date.now()-(coverFailed.get(url)||0)>300000);
};

function jacketImg(b){
  const s=coverSrcs(b);
  if(!s.length) return `<div class="fallback">${esc(b.title.slice(0,26))}</div>`;
  return `<img src="${esc(s[0])}" alt="" loading="lazy" decoding="async" data-t="${esc(b.title.slice(0,26))}"
    data-b="${esc(b.isbn)}" data-original="${esc(b.cover||'')}"
    data-n="${esc(s.slice(1).map(encodeURIComponent).join(' '))}" onload="ckCover(this)" onerror="nextCover(this)">`;
}
// 次の候補へ送る。候補が尽きたら文字（検索結果では灰色の枠）に落とす
function nextCover(el){
  coverFailed.set(el.src,Date.now());
  // 候補URLは encodeURIComponent 済み（利用者が入れたURLに空白があっても壊れない）
  const rest=(el.dataset.n||'').split(' ').filter(Boolean);
  if(rest.length){
    el.dataset.n=rest.slice(1).join(' ');
    try{ el.src=decodeURIComponent(rest[0]); }catch(e){ el.src=rest[0]; }
    return;
  }
  if(el.dataset.p){ const d=document.createElement('div'); d.className='ph'; el.replaceWith(d); return; }
  fbCover(el);
}
// 読み込めても中身が「表紙なし」画像のことがある
let coverT=0;
function ckCover(el){
  if(el.naturalWidth<=1||(el.naturalWidth===128&&el.naturalHeight===170)) return nextCover(el);
  /* 表示に成功したURLを本に書き戻す。書かないと、描画のたびに
     同じ当てずっぽう（Amazon→Google）の失敗をやり直すことになる。
     検索結果の画像（data-b なし）は棚の本ではないので触らない */
  const isbn=el.dataset.b;
  if(isbn){
    const original=el.dataset.original||'', src=el.src;
    coverKnown.set(isbn,{original,src});
    if(original===src) return;
    coverUpdates.set(isbn,{original,src});
    clearTimeout(coverT); coverT=setTimeout(async()=>{
      const updates=new Map(coverUpdates); coverUpdates.clear();
      await changeBooks(current=>current.map(b=>{
        const update=updates.get(b.isbn);
        return update&&(b.cover||'')===update.original?Object.assign({},b,{cover:update.src}):b;
      }));
    },1200);
  }
}
function fbCover(el){
  const d=document.createElement('div');
  d.className='fallback';

const sheet=document.getElementById('sheet'), card=document.getElementById('card');
/* Android の戻るキーでシートを閉じる。
   これが無いと、シートを開いた状態で戻ったときにアプリごと離脱してしまう。
   ホーム画面から起動していると、そのまま閉じたのと同じことになる。
   開くときに履歴を1つ積み、閉じるときに戻す。 */
let sheetOpen=false;
const openWith=h=>{
  cancelViewJobs(); bulkSeq++; checkSeq++; // 別画面の通信と応答を取り消す
  card.innerHTML=h; card.scrollTop=0;
  if(sheetOpen) return;
  sheetOpen=true; sheet.classList.add('on');
  try{ history.pushState({sh:1},''); }catch(e){}
};
/* history.back() は非同期で、popstate は後から届く。
   閉じた直後に別のシートを開くと、その遅れて届いた popstate が
   開いたばかりのシートを閉じてしまう。自分で戻したぶんは1回読み飛ばす。 */
let ignorePop=0;
const closeSheet=fromPop=>{
  if(!sheetOpen) return;
  cancelViewJobs(); sheetOpen=false; hid.on=false; bulkSeq++; checkSeq++; sheet.classList.remove('on');
  // 戻るキー由来のときは、履歴はもう戻っているので二重に戻さない
  if(!fromPop && history.state && history.state.sh){ ignorePop++; history.back(); }
};
window.addEventListener('popstate',()=>{
  if(ignorePop>0){ ignorePop--; return; }
  if(sheetOpen) return closeSheet(true);
  if(document.getElementById('scanner').classList.contains('on')) stopScan(true);
});
sheet.addEventListener('click',e=>{ if(e.target===sheet) closeSheet(); });
document.getElementById('sheetx').onclick=()=>closeSheet();
