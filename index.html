<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141C2E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>本棚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141C2E; --ink-2:#1D2740; --ink-3:#2A3555; --ink-4:#3D4A6E;
  --paper:#EFEAE0; --dim:#8E98AF;
  --foil:#C9A34E; --foil-dim:#8A7133;
  --jade:#5E9E8C; --violet:#9285C8; --alert:#D2604A;
  --shelf:#3A2E22; --r:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--paper);
  font-family:"Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.7;
  padding-bottom:env(safe-area-inset-bottom);overscroll-behavior-y:contain}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
input,textarea{font:inherit}
img{background:var(--ink-3)}

/* ══ ヘッダ ══ */
header{position:sticky;top:0;z-index:20;background:var(--ink);
  padding:14px 16px 9px;padding-top:calc(14px + env(safe-area-inset-top));
  border-bottom:1px solid var(--ink-2)}
.brand{display:flex;align-items:baseline;gap:11px}
h1{font-family:"Noto Serif JP",serif;font-weight:700;font-size:19px;
  letter-spacing:.22em;margin:0;color:var(--foil)}
.stat{font-size:11.5px;letter-spacing:.08em;color:var(--dim);font-variant-numeric:tabular-nums}
/* 指で押す前提なので、見た目の丸より広い当たり判定を持たせる（44px確保） */
.sortbtn{margin-left:auto;font-size:11.5px;color:var(--dim);white-space:nowrap;
  border:1px solid var(--ink-3);border-radius:999px;padding:6px 12px;min-height:44px;
  display:inline-flex;align-items:center}
.sortbtn:active{color:var(--paper)}
.stat b{color:var(--alert);font-weight:700}
.search{margin-top:9px;width:100%;background:var(--ink-2);border:1px solid var(--ink-3);
  border-radius:var(--r);color:var(--paper);padding:9px 13px;font-size:14px}
.search::placeholder{color:#5C687F}
.search:focus{outline:2px solid var(--foil-dim);outline-offset:1px}
.chips{display:flex;gap:6px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:10px 14px;border-radius:999px;font-size:12.5px;
  border:1px solid var(--ink-3);color:var(--dim);white-space:nowrap;
  min-height:44px;display:inline-flex;align-items:center}
.chip.on{background:var(--foil);border-color:var(--foil);color:#1A1305;font-weight:700}

main{padding:14px 16px 130px}
.h{display:flex;align-items:baseline;gap:8px;margin:24px 0 10px;
  font-size:11px;letter-spacing:.2em;color:var(--dim)}
.h:first-child{margin-top:0}
.h::after{content:"";flex:1;height:1px;background:var(--ink-2)}

/* ══ 巻数ストリップ ＝ この棚の背骨 ══
   金＝紙で所有／金の枠＝電子／翡翠＝読了／菫＝アニメで見た／赤の破線＝未登録 */
.strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.v{min-width:21px;height:27px;padding:0 2px;border-radius:1px 3px 3px 1px;font-size:10px;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;line-height:1}
.v.paper{background:linear-gradient(180deg,var(--foil),var(--foil-dim));color:#1A1305;font-weight:700}
.v.paper.read{background:linear-gradient(180deg,var(--jade),#3F7466);color:#06120E}
.v.digital{border:1.5px solid var(--foil);color:var(--foil);font-weight:700}
.v.digital.read{border-color:var(--jade);color:var(--jade)}
.v.none{border:1px solid var(--ink-4);color:var(--dim)}
.v.none.read{border-color:var(--jade);color:var(--jade)}
.v.none.anime{border-color:var(--violet);color:var(--violet)}
.v.gap{border:1px dashed rgba(210,96,74,.8);color:var(--alert)}
.v.next{border:1px dashed var(--ink-4);color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;font-size:10.5px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:4px}
.key{width:11px;height:14px;border-radius:1px 2px 2px 1px;display:inline-block}

/* ══ シリーズ札 ══ */
.series{display:flex;gap:12px;width:100%;padding:12px;margin-bottom:10px;
  background:var(--ink-2);border-radius:var(--r);border:1px solid var(--ink-3);
  animation:rise .3s cubic-bezier(.2,.8,.3,1) both}
.series.buy{border-color:rgba(210,96,74,.5)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mini{flex:0 0 50px;height:75px;border-radius:2px 4px 4px 2px;overflow:hidden;
  box-shadow:0 3px 8px rgba(0,0,0,.45);position:relative}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.sbody{flex:1;min-width:0}
.stitle{font-family:"Noto Serif JP",serif;font-size:15px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ssub{font-size:11.5px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
.ssub .miss{color:var(--alert);font-weight:700}
.ssub .fin{color:var(--jade);font-weight:700}

/* ══ 単巻グリッド ══ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:15px 11px;align-items:end}
.book{display:block;width:100%;animation:rise .3s cubic-bezier(.2,.8,.3,1) both}
.jacket{position:relative;width:100%;aspect-ratio:2/3;background:var(--ink-2);
  border-radius:3px 5px 5px 3px;overflow:hidden;
  box-shadow:0 5px 10px rgba(0,0,0,.45),inset 3px 0 0 rgba(0,0,0,.3)}
.jacket img{width:100%;height:100%;object-fit:cover;display:block}
.jacket.ghost{opacity:.62}
.jacket.ghost::after{content:"";position:absolute;inset:0;border:1px dashed var(--ink-4);border-radius:inherit}
.fallback{position:absolute;inset:0;display:flex;align-items:center;padding:9px 8px 9px 12px;
  font-family:"Noto Serif JP",serif;font-size:11px;line-height:1.45;color:var(--paper);
  background:linear-gradient(100deg,var(--ink-3),var(--ink-2));overflow:hidden}
.pin{position:absolute;top:0;right:6px;width:11px;height:21px;background:var(--foil);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.pin.read{background:var(--jade)} .pin.now{background:var(--alert)} .pin.anime{background:var(--violet)}
.t{margin-top:7px;font-size:11.5px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail{height:5px;margin-top:12px;border-radius:2px;
  background:linear-gradient(180deg,#4A3B2C,var(--shelf));box-shadow:0 3px 7px rgba(0,0,0,.5)}

/* 圏外のときに「壊れた」と誤解されないよう、検索が使えない理由を先に示す */
.offline{display:block;padding:8px 13px;margin-bottom:10px;border-radius:var(--r);
  font-size:12px;color:var(--ink);background:var(--foil);font-weight:700}
.hint{display:block;width:100%;padding:10px 13px;margin-bottom:12px;border-radius:var(--r);
  font-size:12.5px;line-height:1.5;color:var(--paper);
  background:var(--ink-2);border:1px solid var(--foil-dim)}
.empty{padding:56px 6px;text-align:center;color:var(--dim);font-size:13.5px}
.empty strong{display:block;font-family:"Noto Serif JP",serif;color:var(--paper);
  font-size:16px;letter-spacing:.1em;margin-bottom:8px}

/* ══ 下部バー ══ */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;
  padding:11px 16px;padding-bottom:calc(11px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,var(--ink) 70%,rgba(20,28,46,0))}
.btn{flex:1;padding:13px;border-radius:var(--r);text-align:center;font-weight:700;
  letter-spacing:.08em;font-size:14px;background:var(--foil);color:#1A1305}
.btn:active{transform:translateY(1px)}
.btn.ghost{flex:0 0 auto;padding:13px 15px;background:var(--ink-2);color:var(--paper);
  border:1px solid var(--ink-3);font-weight:500;letter-spacing:0}

/* ══ スキャナ ══ */
.scanner{position:fixed;inset:0;z-index:50;background:#000;display:none}
.scanner.on{display:block}
video{width:100%;height:100%;object-fit:cover}
.reticle{position:absolute;top:40%;left:8%;right:8%;height:126px;transform:translateY(-50%);
  border:2px solid var(--foil);border-radius:6px;box-shadow:0 0 0 100vmax rgba(0,0,0,.58)}
.reticle::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;
  background:var(--alert);opacity:.85;animation:sweep 2s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-54px)}50%{transform:translateY(54px)}}
.scanhint{position:absolute;left:0;right:0;top:calc(40% + 80px);text-align:center;
  font-size:13px;color:#fff;text-shadow:0 1px 4px #000;padding:0 24px}
.log{position:absolute;left:16px;right:16px;bottom:calc(102px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:5px}
.log div{background:rgba(0,0,0,.55);border-left:3px solid var(--foil);padding:6px 10px;
  font-size:12px;border-radius:0 5px 5px 0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;animation:rise .25s both}
.close{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(34px + env(safe-area-inset-bottom));background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.3);color:#fff;padding:12px 34px;border-radius:999px;font-size:14px}
.flash{position:absolute;inset:0;background:var(--foil);opacity:0;pointer-events:none}
.flash.go{animation:fl .3s ease-out}
@keyframes fl{from{opacity:.5}to{opacity:0}}

/* ══ シート ══ */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;background:rgba(6,9,17,.76)}
.sheet.on{display:flex}
/* 詳細シートは画面の9割を覆うので、背景をタップして閉じる余白がほとんど残らない。
   指の届く位置に閉じるボタンを重ねる */
.sheetx{position:absolute;top:0;right:8px;width:48px;height:48px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;line-height:1;color:var(--paper);
  background:rgba(20,28,46,.82);border-radius:50%;z-index:61;
  margin-top:calc(env(safe-area-inset-top) + 8px)}
.card{width:100%;background:var(--ink-2);border-radius:16px 16px 0 0;
  padding:20px 17px calc(22px + env(safe-area-inset-bottom));
  border-top:2px solid var(--foil-dim);animation:up .26s cubic-bezier(.2,.8,.3,1);
  max-height:90vh;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.head{display:flex;gap:14px}
.head .big{flex:0 0 88px;height:132px;border-radius:2px 5px 5px 2px;overflow:hidden;position:relative;
  box-shadow:0 6px 14px rgba(0,0,0,.5)}
.head .big img{width:100%;height:100%;object-fit:cover;display:block}
.head .info{flex:1;min-width:0}
.card h2{font-family:"Noto Serif JP",serif;font-size:16.5px;margin:0 0 5px;line-height:1.5}
.meta{font-size:12.5px;color:var(--dim);margin:0 0 2px}
.isbn{font-size:11px;color:var(--foil-dim);letter-spacing:.08em;margin-top:7px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;padding:9px 0;border-radius:8px;text-align:center;font-size:12.5px;
  background:var(--ink-3);color:var(--dim)}
.seg button.on{background:var(--foil);color:#1A1305;font-weight:700}
.seg.four button{font-size:12px}
.lab{font-size:10.5px;letter-spacing:.16em;color:var(--dim);margin:15px 0 5px}
.toggle{display:flex;align-items:center;justify-content:space-between;
  background:var(--ink-3);border-radius:8px;padding:10px 13px;margin-top:8px;width:100%;font-size:13.5px}
.toggle.on{background:var(--violet);color:#0B0716;font-weight:700}
.stars{display:flex;gap:5px;margin-top:8px}
.stars button{flex:1;padding:8px 0;text-align:center;border-radius:8px;background:var(--ink-3);
  color:var(--ink-4);font-size:16px;line-height:1}
.stars button.on{color:var(--foil)}
.field{margin-top:9px}
.field input,.field textarea{width:100%;background:var(--ink);border:1px solid var(--ink-3);
  border-radius:8px;color:var(--paper);padding:9px 11px;font-size:13.5px;resize:vertical}
.field select{background:var(--ink);border:1px solid var(--ink-3);border-radius:8px;
  color:var(--paper);padding:9px 11px;font:inherit;font-size:13.5px;min-height:44px}
.acts{display:flex;gap:8px;margin-top:18px}
.acts button{flex:1;padding:12px;border-radius:var(--r);text-align:center;font-size:14px;background:var(--ink-3)}
.acts .del{background:transparent;border:1px solid var(--alert);color:var(--alert);flex:0 0 32%}
.acts .save{background:var(--foil);color:#1A1305;font-weight:700}

.covers{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.covers::-webkit-scrollbar{display:none}
.covers button{flex:0 0 54px;position:relative}
.covers .c{width:54px;height:81px;border-radius:2px 4px 4px 2px;overflow:hidden;position:relative;
  box-shadow:0 3px 8px rgba(0,0,0,.45)}
.covers .c img{width:100%;height:100%;object-fit:cover;display:block}
.covers .c.ghost{opacity:.55}
.covers .num{text-align:center;font-size:10.5px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}

.hit{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ink-3);width:100%}
.hit img,.hit .ph{width:38px;height:56px;object-fit:cover;border-radius:2px;flex:0 0 38px}
.hit .ph{background:var(--ink-3)}
.hit .n{flex:1;min-width:0;font-size:13px;line-height:1.4}
.hit .n .alt{font-style:normal;font-size:10px;color:var(--foil);border:1px solid var(--foil-dim);
  border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:1px}
.hit .n small{display:block;color:var(--dim);font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hit .go{flex:0 0 auto;background:var(--foil);color:#1A1305;font-weight:700;
  padding:8px 14px;border-radius:8px;font-size:12.5px}
.hit .go.done{background:transparent;color:var(--dim);font-weight:400}
.bulk{display:block;width:100%;padding:12px;border-radius:11px;text-align:center;
  background:var(--foil);color:#1A1305;font-weight:700;font-size:13.5px;margin:8px 0 4px}
.bulk.done{background:transparent;border:1px solid var(--ink-4);color:var(--dim);font-weight:400}
.rows .r{display:flex;justify-content:space-between;padding:8px 0;
  border-bottom:1px solid var(--ink-3);font-size:13.5px}
.rows .r span:last-child{color:var(--foil);font-variant-numeric:tabular-nums}
.menu button{display:block;width:100%;padding:13px 2px;border-bottom:1px solid var(--ink-3);font-size:14px}
.ghost2{padding:13px 16px;border-radius:var(--r);background:var(--ink-3);color:var(--paper);
  font-size:13.5px;white-space:nowrap}
.menu button.on{color:var(--foil);font-weight:700}
.menu button.on::after{content:"　✓"}

.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(92px + env(safe-area-inset-bottom));z-index:70;background:var(--paper);color:var(--ink);
  font-size:13.5px;font-weight:500;padding:11px 20px;border-radius:999px;
  box-shadow:0 6px 20px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.toast.warn{background:var(--alert);color:#fff}
.toast.act{pointer-events:auto}
.toast button{margin-left:14px;font-weight:700;color:#7A5417;text-decoration:underline;white-space:nowrap}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--foil);outline-offset:2px}
</style>
</head>
<body>

<header>
  <div class="brand"><h1>本棚</h1><span class="stat" id="stat"></span>
    <button class="sortbtn" id="sortbtn"></button></div>
  <input class="search" id="q" type="search" placeholder="棚の中を絞り込む（タイトル・著者・場所）"
    aria-label="棚の中を絞り込む" autocomplete="off">
  <div class="chips" id="chips"></div>
</header>

<main id="main"></main>

<div class="bar">
  <button class="btn" id="scan">バーコードを読む</button>
  <button class="btn ghost" id="find">探す</button>
  <button class="btn ghost" id="more">…</button>
</div>

<div class="scanner" id="scanner">
  <video id="video" playsinline muted></video>
  <div class="reticle"></div>
  <div class="flash" id="flash"></div>
  <p class="scanhint" id="hint">裏表紙の<b>上段</b>（978…）を枠に合わせてください</p>
  <div class="log" id="log"></div>
  <button class="close" id="stop">閉じる</button>
</div>

<div class="sheet" id="sheet"><div class="card" id="card"></div>
  <button class="sheetx" id="sheetx" aria-label="閉じる">×</button></div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   保存先：Claudeのプレビュー内では window.storage、
   自分でホストしたときは localStorage。
   ══════════════════════════════════════════════════════════════ */
const KEY='bookshelf:v3', PREV=['bookshelf:v2','bookshelf:v1'];
const store={
  bad:false,   // 読み込みに失敗した印。立っている間は起動時の上書き保存をしない
  async get(k){
    let raw=null;
    try{
      if(window.storage){ const r=await window.storage.get(k); raw=r?r.value:null; }
      else raw=localStorage.getItem(k);
    }catch(e){ this.bad=true; return null; }
    if(raw==null) return null;
    try{ return JSON.parse(raw); }
    catch(e){
      // 壊れたデータは消さずに退避する。空で上書きすると復旧の手がかりごと失う
      this.bad=true;
      try{ localStorage.setItem(k+':broken',raw); }catch(e2){}
      return null;
    }
  },
  async set(k,v){
    const s=JSON.stringify(v);
    try{
      if(window.storage){ await window.storage.set(k,s); return; }
      localStorage.setItem(k,s);
    }catch(e){ toast('保存できませんでした',true); }
  }
};
const save=()=>store.set(KEY,books);

let books=[], filter='', mode='all', addOwn='paper';
/* 探す画面のワンタップ候補。
   棚が空のうちは例として有名どころを出し、本が入ったら
   「抜けのあるシリーズ」を先に出す。探したいのはたいてい足りない巻なので。 */
const SEEDS=['オーバーロード','幼女戦記','Re:ゼロから始める異世界生活','ソードアート・オンライン'];
function presets(){
  if(!books.length) return SEEDS;
  const gs=build(books).filter(g=>g.isSeries);
  const holes=gs.filter(g=>g.buy.length).sort((a,b)=>b.buy.length-a.buy.length).map(g=>g.series);
  const recent=[...gs].sort((a,b)=>
    Math.max(...b.items.map(x=>x.added||0))-Math.max(...a.items.map(x=>x.added||0))).map(g=>g.series);
  const seen=new Set(), out=[];
  [...holes,...recent,...SEEDS].forEach(n=>{
    const k=skey(n); if(n&&!seen.has(k)&&out.length<4){ seen.add(k); out.push(n); }
  });
  return out;
}

/* 所有と体験を別の軸にする（Libro の考え方）。
   「持ってないけど読んだ」も「アニメだけ見た」もこれで表せる。 */
const OWNS  =[{id:'paper',label:'紙'},{id:'digital',label:'電子'},{id:'none',label:'未所持'}];
const STATES=[{id:'stock',label:'未読'},{id:'now',label:'読書中'},
              {id:'read',label:'読了'},{id:'stop',label:'中断'}];
const ownLabel=id=>(OWNS.find(o=>o.id===id)||OWNS[0]).label;

const isISBN13=s=>/^97[89]\d{10}$/.test(s)&&cd(s);
function cd(s){let n=0;for(let i=0;i<12;i++)n+=(+s[i])*(i%2?3:1);return (10-n%10)%10===+s[12];}
// 古い本は ISBN-10 しか持たないレコードが珍しくないので変換して拾う
function isbn13from10(v){
  const t=String(v||'').replace(/[^0-9Xx]/g,'').toUpperCase();
  if(t.length!==10) return null;
  // ISBN-10 側のチェックデジットも確かめる。誤記のまま変換すると偽のISBNができる
  let s=0; for(let i=0;i<9;i++) s+=(+t[i])*(10-i);
  const chk=(11-s%11)%11;
  if(t[9]!==(chk===10?'X':String(chk))) return null;
  const core='978'+t.slice(0,9);
  let n=0; for(let i=0;i<12;i++) n+=(+core[i])*(i%2?3:1);
  return core+((10-n%10)%10);
}

/* ══════════════════════════════════════════════════════════════
   シリーズ判定：タイトルから作品名と巻数を切り出す
   ══════════════════════════════════════════════════════════════ */
const KAN={'上':1,'中':2,'下':3};
// 全角英数記号をすべて半角に寄せる（「Ｒｅ：ゼロ」と「Re:ゼロ」を同じ作品として扱うため）
const norm=s=>String(s||'').replace(/[\uFF01-\uFF5E]/g,
  c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\u3000/g,' ').trim();
// シリーズ名の突き合わせ鍵。表記ゆれで同じ作品が二段に割れるのを防ぐ
const skey=s=>norm(s).toLowerCase().replace(/\s+/g,'');
function parseSeries(raw){
  let t=norm(raw);
  t=t.replace(/\s*[（(][^（）()]*[)）]\s*$/,m=>/[\d上中下]/.test(m)?m:'');
  const pats=[
    /^(.+?)\s*第\s*(\d{1,3})\s*[巻話]\s*$/,
    /^(.+?)\s*[（(]\s*(\d{1,3})\s*[)）]\s*$/,
    /^(.+?)\s+(\d{1,3})\s*[〜~ー-].*$/,
    /^(.+?)\s*(\d{1,3})\s*巻\s*$/,
    /^(.+?)\s+(\d{1,3})\s*$/,
    /^(.+?)\s*[-–—]\s*(\d{1,3})\s*$/,
    /^(.+?[^\x00-\x7F])(\d{1,3})$/,          // 直前が非ASCIIのときだけ（"Python3 入門"を弾く）
    /^(.+?[^\x00-\x7F])(\d{1,3})\s+\S.*$/
  ];
  for(const p of pats){
    const m=t.match(p); if(!m) continue;
    const v=+m[2], name=m[1].trim();
    if(/[全巻第]$/.test(name)) continue;                        // 「全14巻」は箱入り
    if(/^0\d/.test(m[2])||v<1||v>200||name.length<2) continue;  // 0079 のような型番
    return {series:name, vol:v};
  }
  const k=t.match(/^(.+?)\s*[（(]?\s*([上中下])\s*[)）]?\s*$/);
  if(k&&k[1].trim().length>=2) return {series:k[1].trim(), vol:KAN[k[2]]};
  return {series:null, vol:null};
}

/* ══ 書誌の取得 ══
   国会図書館を先に引く。openBD の題名は「オーバーロード = OVERLORD. 1」のように
   原題が併記されていて、そのままだとバーコードで入れた巻が
   検索で入れた巻と別のシリーズに割れてしまう。 */
async function fetchByISBN(isbn){
  try{
    const j=await ndlQuery({isbn,cnt:5});
    if(j[0]) return j[0];
  }catch(e){}
  try{
    const r=await fetch(`https://api.openbd.jp/v1/get?isbn=${isbn}`);
    const [d]=await r.json(); const s=d&&d.summary;
    if(s&&s.title) return {isbn,title:ndlTitle(s.title),author:s.author||'',
      // 刊行日は国会図書館と同じ YYYYMM に揃える。生のままだと刊行順の並びが壊れる
      publisher:s.publisher||'',date:ym(s.pubdate),cover:s.cover||'',src:'openBD'};
  }catch(e){}
  return null;
}
/* 国会図書館サーチを共通の検索口にする。
   Google Books はキー無しの利用が打ち切られており（quota 0 のまま 429 を返す）、
   和書の網羅率もこちらが上。巻数は dcndl:volume として構造化されて返るので、
   題名から巻数を推測する必要がそもそも無い。 */
let lastError=null;                      // 直近の通信エラー。原因を利用者に見せるため保持する
const errText=e=>{
  const m=(e&&e.message)||'';
  if(/HTTP 429/.test(m)) return 'アクセスが多すぎると断られました（しばらく待つと戻ります）';
  if(/^HTTP /.test(m))   return '相手のサーバがエラーを返しました（'+m+'）';
  return '通信が届きませんでした。ネットワークか、ページの置き場所の制限かもしれません';
};

const NDL='https://ndlsearch.ndl.go.jp/api/opensearch';
const textOf=(el,tag)=>{ const n=el.getElementsByTagName(tag)[0]; return n?n.textContent.trim():''; };

/* 刊行日を YYYYMM に揃える。国会図書館は "2015.11" "2009.6" "[2019]" と形がまちまちで、
   数字だけ抜くと "201511" と "20096" のように桁数が揃わず、刊行順に並べられなくなる。 */
function ym(s){
  const t=String(s||'').trim();
  // openBD は "20151109" や "201511" の数字ひと続きで来る
  let m=t.match(/^(\d{4})(\d{2})(\d{2})?$/);
  if(m&&+m[2]>=1&&+m[2]<=12) return m[1]+m[2];
  m=t.match(/(\d{4})(?:\s*[.\-\/年]\s*(\d{1,2}))?/);
  if(!m) return '';
  return m[1]+(m[2]?String(+m[2]).padStart(2,'0'):'');
}
// dcndl:volume は "3" のことも "上" のことも "3上" のこともある
function volOf(s){
  const t=norm(s); if(!t) return null;
  const m=t.match(/\d{1,3}/);
  if(m){ const v=+m[0]; return (v>=1&&v<=200)?v:null; }
  return KAN[t[0]]||null;
}
/* 「オーバーロード = OVERLORD. 1」→ 見出し「オーバーロード 1」＋原題「OVERLORD」。
   原題は捨てずに持っておく。英語の題で探す人はここに当たる。
   「… : 第三章」は別作品なので触らない。 */
function ndlSplit(s){
  const t=norm(s), i=t.indexOf('=');
  if(i<0) return {base:t, alt:''};
  const head=t.slice(0,i).trim(), tail=t.slice(i+1).trim();
  if(!head||!/^[A-Za-z0-9 .,:'’!?&-]+$/.test(tail)) return {base:t, alt:''};   // ラテン文字の併記だけを対象にする
  const v=tail.match(/(\d{1,3})\s*$/);
  return {base:head+(v?' '+v[1]:''),
          alt:tail.replace(/[.,\s]*\d{1,3}\s*$/,'').trim()};
}
const ndlTitle=s=>ndlSplit(s).base;

async function ndlQuery(p){
  const u=NDL+'?mediatype=books&cnt='+(p.cnt||200)+'&idx='+(p.idx||1)
    +(p.title?'&title='+encodeURIComponent(p.title):'')
    +(p.isbn ?'&isbn=' +encodeURIComponent(p.isbn) :'')
    +(p.any  ?'&any='  +encodeURIComponent(p.any)  :'');
  let r=await fetch(u);
  // 混んでいて断られたら、少し待って一度だけ引き直す
  if(r.status===429){ await sleep(1500); r=await fetch(u); }
  if(!r.ok) throw new Error('HTTP '+r.status);
  const doc=new DOMParser().parseFromString(await r.text(),'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('応答を読み取れませんでした');
  /* ここでISBNの重複を潰してはいけない。国会図書館は同じ本を複数の見出しで返し
     （「ソードアート・オンライン 1」は「アインクラッド」名義のレコードが先に来る）、
     先勝ちで潰すと正しい見出しのほうが消えて巻に穴が開く。
     重複はシリーズを絞り込んだ後、呼び出し側で落とす。 */
  const out=[];
  Array.prototype.forEach.call(doc.getElementsByTagName('item'),it=>{
    // 露・西・独語版などが混ざる。棚に入れたいのは日本で出た版だけ。
    // 値は "JP" のことも小文字 "ja" のこともある（実データで両方確認済み）
    const place=textOf(it,'dcndl:publicationPlace');
    if(place&&!/^j[ap]/i.test(place)) return;
    let isbn=null;
    Array.prototype.forEach.call(it.getElementsByTagName('dc:identifier'),n=>{
      if(isbn||!/^dcndl:ISBN(13)?$/.test(n.getAttribute('xsi:type')||'')) return;
      const raw=n.textContent.replace(/[^0-9Xx]/g,'');
      isbn = raw.length===10 ? isbn13from10(raw) : raw;
    });
    if(!isbn||!isISBN13(isbn)) return;
    const sp=ndlSplit(textOf(it,'dc:title'));
    const base=sp.base; if(!base) return;
    const vol=volOf(textOf(it,'dcndl:volume'));
    out.push({isbn, alt:sp.alt, title: vol?base+' '+vol:base,
      // 「夏目, 漱石, 1867-1916」の形で来る。生没年は落として姓名だけ繋ぐ
      author:(textOf(it,'dc:creator')||'').replace(/,\s*\d{4}-(\d{4})?/g,'').replace(/,\s*/g,''),
      publisher:textOf(it,'dc:publisher'),
      date:ym(textOf(it,'dcterms:issued')||textOf(it,'dc:date')),
      cover:'', src:'国会図書館', series:base, vol});
  });
  return out;
}
// 国会図書館が巻数を持っていればそれを使い、無いときだけ題名から推測する
const seriesOf=x=>(x&&x.vol)?{series:x.series,vol:x.vol}:parseSeries(x.title);

// 国会図書館は関連度順に返してくれないので、入力に近いものを手前へ寄せる。
// 原題（OVERLORD など）でも比べ、英語で探した人にも近い順で見せる
function rank(list,q){
  const k=skey(q);
  const one=s=>s===k?0 : s.indexOf(k)===0?1 : s.indexOf(k)>=0?2 : 3;
  const score=x=>Math.min(one(skey(x.series||x.title)), x.alt?one(skey(x.alt)):3);
  return list.map((x,i)=>[score(x),x.vol||999,i,x])
             .sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]).map(z=>z[3]);
}

// 題名で当たらなければ全項目検索に広げる。13桁の数字が来たらISBN照会に回す
async function searchBooks(q){
  lastError=null;
  let out=[];
  const t=norm(q), digits=t.replace(/[^0-9]/g,'');
  if(isISBN13(digits)){
    try{ out=await ndlQuery({isbn:digits,cnt:5}); }catch(e){ lastError=e; }
    if(out.length) return dedupe(out);
  }
  /* 英数字の入力（OVERLORD 等の原題）は、題名検索だけだと外伝ばかり集まって
     本編が入らないことがある。全項目検索も必ず足してから並べ直す。 */
  const ascii=/^[\x20-\x7E]+$/.test(t);
  for(const p of [{title:t},{any:t}]){
    try{ out=out.concat(await ndlQuery(Object.assign({cnt:200},p))); }catch(e){ lastError=e; }
    if(out.length>=8&&!ascii) break;
  }
  // 入力に近い見出しを先に並べてから重複を落とす。こうすると残るのが正しい見出しになる
  return dedupe(rank(out,t));
}
const dedupe=list=>{ const s=new Set();
  return list.filter(x=>s.has(x.isbn)?false:(s.add(x.isbn),true)); };

// シリーズ名から巻を集める。cnt=500 で一度に取り切れるのでページ送りは要らない
async function searchSeries(name,prefer){
  lastError=null;
  let out=[];
  try{ out=await ndlQuery({title:name,cnt:500}); }catch(e){ lastError=e; }
  if(out.length<3){ try{ out=out.concat(await ndlQuery({any:name,cnt:200})); }catch(e){ lastError=e; } }
  const k=skey(name);
  // 原題（OVERLORD 等）で探されたときも、日本語見出しの束に正しく集める
  const mine=out.map(x=>Object.assign({},x,seriesOf(x)))
                .filter(x=>x.vol&&(skey(x.series)===k||(x.alt&&skey(x.alt)===k)));
  /* 同じ題名に小説版と漫画版が同居することがある。
     「オーバーロード」は 丸山くがね＝小説19巻 と 深山フギン＝漫画8巻 が同じ見出し。
     巻を最も多く持つ著者を本編とみなし、そちらを優先して採る。
     これをしないと、巻ごとに版がまちまちに混ざる。 */
  const byAuthor=new Map();
  mine.forEach(x=>{ const a=akey(x.author||''); if(!a) return;
    if(!byAuthor.has(a)) byAuthor.set(a,new Set());
    byAuthor.get(a).add(x.vol); });
  let main=null, best=0;
  byAuthor.forEach((vols,a)=>{ if(vols.size>best){ best=vols.size; main=a; } });
  // 呼び出し側が著者を知っているとき（棚の束から探すとき）はその版に合わせる。
  // 巻数の多寡だけで選ぶと、漫画版を集めている人に小説版を差し出してしまう
  if(prefer&&byAuthor.has(prefer)) main=prefer;

  const vols=new Map();
  mine.forEach(x=>{
    const cur=vols.get(x.vol);
    if(!cur){ vols.set(x.vol,x); return; }
    if(main && akey(x.author||'')===main && akey(cur.author||'')!==main) vols.set(x.vol,x);
  });
  return [...vols.values()].sort((a,b)=>a.vol-b.vol);
}

async function add(isbn,opts){
  opts=opts||{};
  if(books.some(b=>b.isbn===isbn)){ if(!opts.quiet) toast('この本はもう棚にあります',true); return null; }
  if(!opts.quiet) toast('調べています…');
  // 検索結果から入れるときは書誌がもう手元にある。1冊ずつ引き直さない
  const b=opts.rec ? Object.assign({},opts.rec) : await fetchByISBN(isbn);
  if(!b){ if(!opts.quiet) toast('この ISBN の情報が見つかりません',true); return null; }
  Object.keys(b).forEach(k=>{ if(k[0]==='_') delete b[k]; });   // 表示用の作業フィールドは保存しない
  Object.assign(b,seriesOf(b),{added:Date.now(),
    own:opts.own||'paper', status:'stock', anime:false, rate:0, place:'', note:''});
  books.unshift(b);
  /* まとめて入れるときは defer を立て、呼び出し側が最後に1回だけ保存・描画する。
     1冊ごとに棚全体を書き出して描き直すと、巻数ぶん二乗で遅くなる */
  if(!opts.defer){ await save(); render(); }
  return b;
}

/* ══════════════════════════════════════════════════════════════
   棚の組み立て。「買うべき巻」＝ 未登録の穴 ＋ 未所持で登録した巻
   ══════════════════════════════════════════════════════════════ */
/* 束ねる鍵は「題名＋著者」。題名だけで束ねると、同じ題名の小説版と漫画版が
   1つに潰れ、巻が重なったほうが棚から見えなくなる（オーバーロードは
   小説19巻と漫画8巻が同じ見出しで、漫画の1〜8巻が触れなくなっていた）。
   著者は「丸山くがね／著」「丸山くがね、so-bin」のような揺れがあるので、
   先頭の1人だけを取り、肩書きを落として比べる。 */
const akey=s=>skey(String(s||'').split(/[、,\/／]/)[0]
  .replace(/\s*[／\/]?\s*(著|作|画|原作|イラスト|漫画)\s*$/,''));

function build(list){
  const m=new Map();
  list.forEach(b=>{
    const k=b.series?('S'+skey(b.series)+'|'+akey(b.author)):('B'+b.isbn);
    if(!m.has(k)) m.set(k,{key:k,series:b.series,author:b.author||'',items:[]});
    m.get(k).items.push(b);
  });
  /* 著者が空の本（手入力など）は、同じ題名の束が1つだけならそこへ寄せる。
     2つ以上あるとどちらの版か決められないので、そのまま独立させる。 */
  const byTitle=new Map();
  m.forEach(g=>{ if(!g.series) return;
    const t=skey(g.series);
    if(!byTitle.has(t)) byTitle.set(t,[]);
    byTitle.get(t).push(g); });
  byTitle.forEach(groups=>{
    const named=groups.filter(g=>akey(g.author));
    const blank=groups.filter(g=>!akey(g.author));
    if(named.length!==1||!blank.length) return;
    blank.forEach(g=>{ named[0].items.push(...g.items); m.delete(g.key); });
  });
  const gs=[...m.values()];
  gs.forEach(g=>{
    g.items.sort((a,b)=>(a.vol||0)-(b.vol||0));
    g.by=new Map(g.items.filter(x=>x.vol).map(x=>[x.vol,x]));
    g.max=Math.max(0,...g.by.keys());
    g.gaps=[]; g.want=[];
    if(g.series) for(let i=1;i<=g.max;i++){
      const b=g.by.get(i);
      if(!b) g.gaps.push(i);
      else if(b.own==='none') g.want.push(i);
    }
    g.buy=[...g.gaps,...g.want].sort((a,b)=>a-b);
    g.have=g.items.filter(x=>x.own!=='none').length;
    g.newest=Math.max(...g.items.map(x=>x.added||0));
    g.isSeries=!!g.series&&g.max>0;
  });
  // 同じ題名の束が2つ以上あるときだけ、札に著者を添えて見分けられるようにする
  const cnt={};
  gs.forEach(g=>{ if(g.series){ const t=skey(g.series); cnt[t]=(cnt[t]||0)+1; } });
  gs.forEach(g=>{ g.dup=!!(g.series&&cnt[skey(g.series)]>1&&g.author); });
  return gs.sort((a,b)=>b.newest-a.newest);
}

/* ══ 描画 ══ */
const CHIPS=[{id:'all',label:'すべて'},{id:'buy',label:'買うもの'},{id:'paper',label:'紙'},
  {id:'digital',label:'電子'},{id:'none',label:'未所持'},{id:'read',label:'読了'},{id:'anime',label:'アニメ'}];

/* ══ 並び替え ══
   棚が育つと「最近入れた順」だけでは目当てに辿り着けない。
   シリーズは束ねて扱うので、束ごとの代表値で並べる。 */
const SORTS=[
  {id:'added', label:'追加順',   pick:g=>-Math.max(...g.items.map(b=>b.added||0))},
  // 日付は "2020"（年のみ）と "201401"（年月）が混ざる。桁を6に揃えてから比べる
  {id:'date',  label:'刊行が新しい順', pick:g=>{
     const d=g.items.map(b=>b.date||'').filter(Boolean).sort();
     return d.length?-(+(d[d.length-1]+'00').slice(0,6)):0; }},
  {id:'old',   label:'刊行が古い順', pick:g=>{
     const d=g.items.map(b=>b.date||'').filter(Boolean).sort();
     return d.length?+(d[0]+'00').slice(0,6):Infinity; }},
  {id:'title', label:'題名順',   pick:g=>skey(g.series||g.items[0].title)},
  {id:'vol',   label:'巻数の多い順', pick:g=>-g.max},
  {id:'buy',   label:'買う巻が多い順', pick:g=>-g.buy.length},
  {id:'rate',  label:'評価の高い順', pick:g=>-Math.max(...g.items.map(b=>b.rate||0))}
];
let sortBy='added', sortDir=1;
const sortLabel=()=>((SORTS.find(s=>s.id===sortBy)||SORTS[0]).label)+(sortDir<0?'（逆順）':'');
// 題名は文字コード順だと「よ」が「オ」より前に来てしまうので、日本語の並びで比べる
const cmp=(a,b)=>(typeof a==='string'&&typeof b==='string')
  ? a.localeCompare(b,'ja') : (a<b?-1:a>b?1:0);
function applySort(gs){
  const s=SORTS.find(x=>x.id===sortBy)||SORTS[0];
  return gs.map((g,i)=>[s.pick(g),i,g])
           .sort((a,b)=>cmp(a[0],b[0])*sortDir||a[1]-b[1])
           .map(z=>z[2]);
}

function render(){
  const owned=books.filter(b=>b.own!=='none').length;
  const buy=build(books).reduce((n,g)=>n+g.buy.length,0);
  document.getElementById('stat').innerHTML=
    `所持${owned} / 登録${books.length}`+(buy?` · <b>買う${buy}</b>`:'');
  document.getElementById('chips').innerHTML=CHIPS.map(c=>
    `<button class="chip ${mode===c.id?'on':''}" data-m="${c.id}">${c.label}</button>`).join('');
  document.getElementById('sortbtn').textContent=sortLabel()+' ▾';

  // 巻数ストリップは常に棚の全体から組み立てる。
  // 絞り込みは「どの作品を出すか」だけに効かせる（さもないと最大巻数が縮んで穴が増える）
  const hit=b=>{
    // norm() を通して全角半角ゆれを吸収する（「Re:ゼロ」で「Ｒｅ：ゼロ」も当てる）
    if(filter && !norm(b.title+' '+b.author+' '+b.publisher+' '+(b.series||'')
      +' '+(b.place||'')+' '+(b.note||'')).toLowerCase().includes(filter)) return false;
    if(['paper','digital','none'].includes(mode)) return b.own===mode;
    if(mode==='read')  return b.status==='read';
    if(mode==='anime') return !!b.anime;
    return true;
  };
  const gs=build(books).filter(g=> mode==='buy'
    ? g.buy.length && (!filter || g.items.some(hit))
    : g.items.some(hit));

  const main=document.getElementById('main');
  if(!gs.length){
    main.innerHTML=books.length
      ? `<div class="empty"><strong>該当なし</strong>条件を変えてみてください。</div>`

  const series=applySort(gs.filter(g=>g.isSeries)), singles=applySort(gs.filter(g=>!g.isSeries));

    ? `<div class="offline">オフラインです。棚は見られますが、検索と新刊の確認はできません</div>` : '')
    + exportHint();

  if(series.length){
    html+=`<div class="h">シリーズ ${series.length}</div>`;
    series.forEach(g=>{
      const head=[...g.by.values()].pop()||g.items[0];

        const b=g.by.get(i);
        strip+=b?`<span class="v ${vcls(b)}">${i}</span>`:`<span class="v gap">${i}</span>`;
      }
      strip+=`<span class="v next">+</span>`;
      html+=`<button class="series ${g.buy.length?'buy':''}" data-g="${esc(g.key)}">

          <div class="ssub">${g.dup?esc(g.author.split(/[、,\/／]/)[0])+' · ':''}所持${g.have} / 最新${g.max}巻${

            g.buy.length?` · <span class="miss">未所持 ${g.buy.join('、')}</span>`:''}</div>

        </div></button>`;
    });

  if(singles.length){
    html+=`<div class="h">単巻 ${singles.reduce((n,g)=>n+g.items.length,0)}</div><div class="grid">`;

        <div class="jacket ${b.own==='none'?'ghost':''}">${jacketImg(b)}${pin(b)}</div>
        <div class="t">${esc(b.title)}</div>
        <div class="a">${esc(b.author)}</div></button>`;
    }));
    html+=`</div><div class="rail"></div>`;
  }

  html+=`<div class="legend">
    <span><i class="key" style="background:linear-gradient(180deg,#C9A34E,#8A7133)"></i>紙</span>
    <span><i class="key" style="border:1.5px solid #C9A34E"></i>電子</span>
    <span><i class="key" style="background:linear-gradient(180deg,#5E9E8C,#3F7466)"></i>読了</span>
    <span><i class="key" style="border:1px solid #9285C8"></i>アニメ</span>
    <span><i class="key" style="border:1px dashed #D2604A"></i>未登録</span></div>`;
  main.innerHTML=html;
}
const ymd=t=>{ const d=new Date(t);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; };
// "201511" → "2015年11月"。月が無ければ年だけ
const dateLabel=d=>d.slice(0,4)+'年'+(d.length>=6?(+d.slice(4,6))+'月':'');
/* 読了にした日を残す。読書ペースを振り返るための唯一の記録なので、
   読了を取り消したときだけ消す。既に読了の本を再保存しても日付は動かさない。 */
function setStatus(b,st){
  if(st==='read') b.readAt=b.readAt||Date.now();
  else b.readAt=0;
  b.status=st;
}
function vcls(b){
  return [b.own, b.status==='read'?'read':'', b.anime&&b.status!=='read'?'anime':'']
    .filter(Boolean).join(' ');
}
function pin(b){
  if(b.status==='read') return '<span class="pin read"></span>';
  if(b.status==='now')  return '<span class="pin now"></span>';
  if(b.anime)           return '<span class="pin anime"></span>';
  return '';
}
/* ══ 書影は3段構え ══
   Amazon（和書の網羅率が最も高く、353x500 と解像度も上）→ Google → 題名の文字。
   国会図書館の書影は Referer を自ドメインに限っていて他所からは403なので使えない。

   厄介なのは「表紙が無い」ときの返し方が業者ごとに違うこと。
   404 ではなく 200 で代替画像が返るため、寸法で見分ける必要がある。
     Amazon → 1x1 の透明画像
     Google → 128x170 の灰色画像                                    */
function isbn10from13(i13){
  if(!/^978\d{10}$/.test(i13||'')) return null;
  const c=i13.slice(3,12); let s=0;
  for(let i=0;i<9;i++) s+=(+c[i])*(10-i);
  const r=(11-s%11)%11;
  return c+(r===10?'X':r);
}
const aCover=isbn=>{ const t=isbn10from13(isbn);
  return t?`https://images-na.ssl-images-amazon.com/images/P/${t}.09.LZZZZZZZ.jpg`:''; };
const gCover=isbn=>/^\d{13}$/.test(isbn||'')
  ? `https://books.google.com/books/content?vid=ISBN${isbn}&printsec=frontcover&img=1&zoom=1` : '';
const coverSrcs=b=>[b.cover,aCover(b.isbn),gCover(b.isbn)].filter(Boolean);

function jacketImg(b){
  const s=coverSrcs(b);
  if(!s.length) return `<div class="fallback">${esc(b.title.slice(0,26))}</div>`;
  return `<img src="${esc(s[0])}" alt="" loading="lazy" data-t="${esc(b.title.slice(0,26))}"
    data-n="${esc(s.slice(1).map(encodeURIComponent).join(' '))}" onload="ckCover(this)" onerror="nextCover(this)">`;
}
// 次の候補へ送る。候補が尽きたら文字（検索結果では灰色の枠）に落とす
function nextCover(el){
  // 候補URLは encodeURIComponent 済み（利用者が入れたURLに空白があっても壊れない）
  const rest=(el.dataset.n||'').split(' ').filter(Boolean);
  if(rest.length){
    el.dataset.n=rest.slice(1).join(' ');
    try{ el.src=decodeURIComponent(rest[0]); }catch(e){ el.src=rest[0]; }
    return;
  }
  if(el.dataset.p){ const d=document.createElement('div'); d.className='ph'; el.replaceWith(d); return; }
  fbCover(el);
}
// 読み込めても中身が「表紙なし」画像のことがある
function ckCover(el){
  if(el.naturalWidth<=1||(el.naturalWidth===128&&el.naturalHeight===170)) nextCover(el);
}
function fbCover(el){
  const d=document.createElement('div');
  d.className='fallback';
  d.textContent=el.dataset.t||'';   // textContent なのでタイトルに何が来ても安全
  el.replaceWith(d);
}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Android の戻るキーでシートを閉じる。
   これが無いと、シートを開いた状態で戻ったときにアプリごと離脱してしまう。
   ホーム画面から起動していると、そのまま閉じたのと同じことになる。
   開くときに履歴を1つ積み、閉じるときに戻す。 */
let sheetOpen=false;
const openWith=h=>{
  card.innerHTML=h; card.scrollTop=0;
  if(sheetOpen) return;
  sheetOpen=true; sheet.classList.add('on');
  try{ history.pushState({sh:1},''); }catch(e){}
};
/* history.back() は非同期で、popstate は後から届く。
   閉じた直後に別のシートを開くと、その遅れて届いた popstate が
   開いたばかりのシートを閉じてしまう。自分で戻したぶんは1回読み飛ばす。 */
let ignorePop=0;
const closeSheet=fromPop=>{
  if(!sheetOpen) return;
  sheetOpen=false; hid.on=false; sheet.classList.remove('on');
  // 戻るキー由来のときは、履歴はもう戻っているので二重に戻さない
  if(!fromPop && history.state && history.state.sh){ ignorePop++; history.back(); }
};
window.addEventListener('popstate',()=>{
  if(ignorePop>0){ ignorePop--; return; }
  if(sheetOpen) return closeSheet(true);
  if(document.getElementById('scanner').classList.contains('on')) stopScan(true);
});
sheet.addEventListener('click',e=>{ if(e.target===sheet) closeSheet(); });

/* 19巻を1冊ずつ触るのは現実的でないので、範囲でまとめて変えられるようにする。
   棚に無い巻は飛ばす（未登録の巻を勝手に作らない） */
async function bulkApply(g,upto,fn,label){
  let n=0;
  for(let i=1;i<=upto;i++){ const b=g.by.get(i); if(b){ fn(b); n++; } }
  if(!n){ toast('その範囲に棚の本がありません',true); return; }
  await save(); render(); closeSheet();
  toast(`${label}変更しました（${n}冊）`);
}

async function hunt(g,wants){
  const box=document.getElementById('found');
  box.innerHTML='<p class="meta" style="padding:12px 0">探しています…</p>';
  let items=[];
  try{
    // cnt=500 で全巻を取り切り、棚と同じ著者の版に合わせる
    items=(await searchSeries(g.series,akey(g.author)))
      .filter(x=>wants.includes(x.vol)&&!books.some(b=>b.isbn===x.isbn));
  }catch(e){}
  if(!items.length){
    box.innerHTML = lastError
      ? noHits(g.series)
      : '<p class="meta" style="padding:12px 0">見つかりませんでした。刊行前か、タイトルの表記が違うかもしれません。</p>';
    wire(box,[],g.series);
    return;
  }
  box.innerHTML=`<div class="lab">見つかった巻</div>`+bulkBar(items)+results(items);
  wire(box,items);
}

     原題（OVERLORD 等）で当たったときは日本語名に橋渡しする。 */
  const fpre=document.getElementById('fpre');
  const chipsOf=list=>list.map(x=>
    `<button class="chip" data-q="${esc(x.q)}">${esc(x.label)}</button>`).join('');

      let items=sugCache.get(v);
      if(!items){
        try{ items=await ndlQuery({title:v,cnt:25}); }catch(e){ items=[]; }
        sugCache.set(v,items);
      }
      if(seq!==sugSeq) return;              // 打ち直しで古くなった応答は捨てる
      const seen=new Set(), out=[];
      rank(items,v).forEach(x=>{
        const nm=x.series||x.title, kk=skey(nm);
        if(seen.has(kk)||out.length>=6) return;
        seen.add(kk);
        const viaAlt=x.alt&&skey(x.alt).indexOf(skey(v))>=0&&skey(nm).indexOf(skey(v))<0;
        out.push({q:nm, label:viaAlt?nm+'（'+x.alt+'）':nm});
      });
      /* 原題で引くと外伝ばかり並ぶことがある（OVERLORD → 〈新〉世界編、不死者のOh!…）。
         候補の半数が同じ書き出しなら、その共通部分＝本体の作品名を先頭に足す */
      if(out.length>=3){
        const names=out.map(x=>x.q);
        let pre='';
        names.forEach(anchor=>{
          for(let L=anchor.length;L>pre.length;L--){
            const p=anchor.slice(0,L);
            if(p.length>=3&&names.filter(s=>s.startsWith(p)).length*2>=names.length){ pre=p; break; }
          }
        });
        pre=pre.trim();
        if(pre.length>=3&&/[^\x00-\x7F]/.test(pre)&&!seen.has(skey(pre)))
          out.unshift({q:pre,label:pre});
      }
      if(out.length) fpre.innerHTML=chipsOf(out.slice(0,7));
    },500);
  });
  const run=async()=>{
    const raw=document.getElementById('fq').value.trim();
    if(!raw) return;
    const box=document.getElementById('fres');
    const digits=raw.replace(/\D/g,'');
    if(digits.length===13){
      if(!isISBN13(digits)){ toast('13桁の ISBN として正しくありません',true); return; }
      if(books.some(b=>b.isbn===digits)){ toast('この本はもう棚にあります',true); return; }
      box.innerHTML='<p class="meta" style="padding:12px 0">調べています…</p>';
      const b=await add(digits,{own:addOwn,quiet:true});
      if(b){ closeSheet(); toast(`『${b.title.slice(0,16)}』を追加`); }
      else box.innerHTML='<p class="meta" style="padding:12px 0">追加できませんでした。</p>';
      return;
    }
    box.innerHTML='<p class="meta" style="padding:12px 0">探しています…</p>';
    let items=[];
    try{ items=(await searchBooks(raw)).filter(x=>!books.some(b=>b.isbn===x.isbn)); }catch(e){}
    items=sortByVolume(items);
    box.innerHTML=items.length
      ? `<div class="lab">検索結果</div>`+bulkBar(items)+results(items)
      : noHits(raw);
    wire(box,items,raw);
  };
  document.getElementById('fpre').onclick=e=>{
    const c=e.target.closest('[data-q]'); if(!c) return;
    document.getElementById('fq').value=c.dataset.q; run();
  };
  document.getElementById('fgo').onclick=run;
  document.getElementById('fq').addEventListener('keydown',e=>{ if(e.key==='Enter') run(); });
  if(q) run();
}

// 同じ作品は巻順にまとめる。作品どうしの並びは検索の並び（＝入力に近い順）を崩さない
function sortByVolume(items){
  const withS=items.map(x=>Object.assign({},x,seriesOf(x)));
  const order=new Map();
  withS.forEach(x=>{ const k=skey(x.series||x.title);
    if(!order.has(k)) order.set(k,order.size); });
  return withS.map((x,i)=>[order.get(skey(x.series||x.title)), x.vol||0, i, x])
    .sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]).map(z=>z[3]);
}
let bulkList=[];
function bulkBar(items){
  const m=new Map();
  items.forEach(x=>{ const p=seriesOf(x); if(!p.vol) return;
    const k=skey(p.series);
    if(!m.has(k)) m.set(k,new Map());
    if(!m.get(k).has(p.vol)) m.get(k).set(p.vol,x);   // 同じ巻の別版は数に入れない
  });
  const best=[...m.values()].sort((a,b)=>b.size-a.size)[0];
  bulkList = (best&&best.size>=2)
    ? [...best.values()].sort((a,b)=>seriesOf(a).vol-seriesOf(b).vol) : [];
  if(!bulkList.length) return '';
  /* 範囲は打たせずに選ばせる。「1-15」のような自由記述は読み違いのもと */
  const vols=bulkList.map(x=>seriesOf(x).vol);
  return `<div class="field" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 0">
      <select id="bfrom">${vols.map(v=>`<option value="${v}">${v}</option>`).join('')}</select>
      <span class="meta" style="white-space:nowrap">巻から</span>
      <select id="bto"><option value="all">最後まで（見つかった全巻）</option>${
        vols.slice().reverse().map(v=>`<option value="${v}">${v}巻</option>`).join('')}</select>
      <span class="meta" style="white-space:nowrap">を</span>
    </div>
    <button class="bulk" id="bulk">${esc(seriesOf(bulkList[0]).series)} をまとめて追加</button>`;
}

/* ══ 完結の印と設定（meta） ══
   openBD の ONIX には「完結フラグ」の枠があるが、実データでは
   よつばと!・オーバーロード・幼女戦記の70冊すべてで空だった。
   完結かどうかは当てにできる情報源が無いので、推測せず本人に宣言してもらう。
   印を付けた作品は「新刊を調べる」の対象から外し、札に「完結」と出す。

   完結・並び順・書き出しの記録は books と同じ保存先（store）にまとめる。
   以前は localStorage 直書きで、書き出しにも含まれず機種変更で消えていた。 */
const META='bookshelf:meta';
let meta={done:[],sort:'added',dir:1,exportAt:0,exportN:0};
let doneKeys=new Set();
async function loadMeta(){
  const m=await store.get(META);
  if(m&&typeof m==='object') Object.assign(meta,m);
  else{
    // 旧形式（localStorage 直書き）からの引き継ぎ
    try{ meta.done=JSON.parse(localStorage.getItem('bookshelf:done')||'[]'); }catch(e){}
    try{ const s=localStorage.getItem('bookshelf:sort'); if(s) meta.sort=s; }catch(e){}
    try{ const ex=JSON.parse(localStorage.getItem('bookshelf:lastExport')||'null');
         if(ex){ meta.exportAt=ex.at||0; meta.exportN=ex.n||0; } }catch(e){}
  }
  doneKeys=new Set(Array.isArray(meta.done)?meta.done:[]);
  if(SORTS.some(x=>x.id===meta.sort)) sortBy=meta.sort;
  sortDir=meta.dir===-1?-1:1;
}
function saveMeta(){
  meta.done=[...doneKeys]; meta.sort=sortBy; meta.dir=sortDir;
  return store.set(META,meta);
}
const gkey=g=>skey(g.series||'')+'|'+akey(g.author);
const isDone=g=>doneKeys.has(gkey(g));
function toggleDone(g){
  const k=gkey(g);
  doneKeys.has(k)?doneKeys.delete(k):doneKeys.add(k);
  saveMeta();
  return doneKeys.has(k);
}

/* 持っている巻が飛び飛びでも、国会図書館が知っている巻をまとめて埋める。
   「完結まで持っている」作品を1タップで揃えるための入口。 */
async function fillSeries(g,own){
  const box=document.getElementById('found');
  box.innerHTML='<p class="meta" style="padding:12px 0">全巻を調べています…</p>';
  let all=[];
  try{ all=await searchSeries(g.series,akey(g.author)); }catch(e){}
  if(!all.length){
    box.innerHTML=lastError
      ? `<p class="meta" style="padding:12px 0;color:var(--alert)">${esc(errText(lastError))}。</p>`
      : '<p class="meta" style="padding:12px 0">巻が見つかりませんでした。</p>';
    return;
  }
  // 手入力などで著者が空の束は、著者では絞れない（searchSeries が本編を選別済み）
  const ak=akey(g.author);
  const want=all.filter(x=>!books.some(b=>b.isbn===x.isbn)
    && (!ak || akey(x.author)===ak));
  if(!want.length){
    const owned=all.filter(x=>books.some(b=>b.isbn===x.isbn)).length;
    box.innerHTML=owned
      ? `<p class="meta" style="padding:12px 0">すでに${owned}巻すべて棚にあります。</p>`
      : `<p class="meta" style="padding:12px 0">追加できる巻が見つかりませんでした。</p>`;
    return;
  }
  let n=0;
  for(const x of want){
    if(await add(x.isbn,{own,quiet:true,rec:x,defer:true})) n++;
  }
  await save(); render();
  box.innerHTML=`<p class="meta" style="padding:12px 0;color:var(--jade)">`
    +`${n}冊を${ownLabel(own)}で追加しました（全${all.length}巻）。</p>`;
}

/* ══ まとめて入力 ══
   既に持っている巻が分かりきっているとき、長い題名を巻の数だけ打つのは苦行。
   1行に1作品、題名のあとに範囲を書けば、その巻だけを棚に入れる。
     オーバーロード 1-15
     よつばと! 16          ← 数字ひとつなら「その巻まで」
     幼女戦記 1-5,8,10-12
     ソードアート・オンライン  ← 範囲を書かなければ見つかった全巻 */
function parseRange(spec){
  // norm() が全角チルダ ～(U+FF5E) を半角 ~ に寄せるので、そちらも受ける
  const t=norm(spec||'').replace(/[〜～~–—ー]/g,'-').replace(/\s+/g,'');
  if(!t) return null;                                  // 範囲指定なし＝全部
  if(/^\d{1,3}$/.test(t)){ const n=+t; return n>=1?{from:1,to:n,list:null}:null; }
  const set=new Set();
  for(const part of t.split(/[,、]/)){
    let m=part.match(/^(\d{1,3})-(\d{1,3})$/);
    if(m){ const a=+m[1],b=+m[2]; for(let i=Math.min(a,b);i<=Math.max(a,b);i++) set.add(i); continue; }
    m=part.match(/^(\d{1,3})$/);
    if(m) set.add(+m[1]);
  }
  return set.size?{from:null,to:null,list:set}:null;
}
// 「作品名 1-15」を作品名と範囲に割る。題名に数字が入る作品があるので末尾からだけ切る
function parseLine(line){
  const t=norm(line||'').trim();
  if(!t) return null;
  const m=t.match(/^(.*?)[\s　]+([\d\-–—〜～~,、\s]+)$/);
  if(!m) return {name:t, range:null};
  const range=parseRange(m[2]);
  return range ? {name:m[1].trim(), range} : {name:t, range:null};
}
const inRange=(v,r)=>!r ? true : (r.list ? r.list.has(v) : (v>=r.from&&v<=r.to));

function openBulkInput(){
  openWith(`
    <h2>まとめて入力</h2>
    <p class="meta">1行に1作品。題名のあとに持っている巻を書いてください。
      題名を打つのは1回だけで済みます。</p>
    <div class="lab">書きかた</div>
    <div class="rows">
      <div class="r"><span>オーバーロード 1-15</span><span>1〜15巻</span></div>
      <div class="r"><span>よつばと! 16</span><span>1〜16巻</span></div>
      <div class="r"><span>幼女戦記 1-5,8</span><span>1〜5巻と8巻</span></div>
      <div class="r"><span>薬屋のひとりごと</span><span>見つかった全巻</span></div>
    </div>
    <div class="field" style="margin-top:12px">
      <textarea id="blines" rows="6" placeholder="オーバーロード 1-15&#10;よつばと! 16"></textarea></div>
    <div id="bprev"></div>
    <div class="lab">持ちかた</div>
    <div class="seg" id="bo">${OWNS.map(o=>
      `<button data-v="${o.id}" class="${addOwn===o.id?'on':''}">${o.label}</button>`).join('')}</div>
    <div id="bres"></div>
    <div class="acts"><button class="save" id="bgo">棚に入れる</button></div>`);
  document.getElementById('bo').onclick=e=>{
    const t=e.target.closest('[data-v]'); if(!t) return;
    addOwn=t.dataset.v;
    [...document.getElementById('bo').children].forEach(x=>x.classList.toggle('on',x===t));
  };
  /* どう読み取られたかを打ちながら見せる。
     「1-5,8」の書き損じに、入れてしまってから気づくのでは遅い */
  const blines=document.getElementById('blines'), bprev=document.getElementById('bprev');
  // 連続した巻は「1〜15」に圧縮して見せる
  const runs=vs=>{ const a=[...vs].sort((x,y)=>x-y), o=[];
    for(let i=0;i<a.length;){ let j=i;
      while(j+1<a.length&&a[j+1]===a[j]+1) j++;
      o.push(i===j?String(a[i]):a[i]+'〜'+a[j]); i=j+1; }
    return o.join('、'); };
  blines.addEventListener('input',()=>{
    const lines=blines.value.split(/\r?\n/).map(parseLine).filter(Boolean);
    bprev.innerHTML=!lines.length?'':
      `<div class="lab">読み取り</div><div class="rows">`+lines.map(l=>{
        const r=l.range;
        const t=!r?'見つかった全巻'
          : r.list?runs(r.list)+'巻'
          : `1〜${r.to}巻`;
        return `<div class="r"><span>${esc(l.name)}</span><span>${esc(t)}</span></div>`;
      }).join('')+`</div>`;
  });
  document.getElementById('bgo').onclick=runBulkInput;
}

async function runBulkInput(){
  const box=document.getElementById('bres');
  const go=document.getElementById('bgo');
  const lines=document.getElementById('blines').value.split(/\r?\n/)
    .map(parseLine).filter(Boolean);
  if(!lines.length){ toast('1行に1作品ずつ書いてください',true); return; }
  go.disabled=true;
  const rows=[]; let total=0;
  for(let i=0;i<lines.length;i++){
    const {name,range}=lines[i];
    box.innerHTML=`<p class="meta" style="padding:10px 0">${esc(name)} を調べています（${i+1}/${lines.length}）…</p>`;
    let found=[];
    try{ found=await searchSeries(name); }catch(e){}
    if(!found.length){
      rows.push([name, lastError?'通信が届きませんでした':'見つかりませんでした', false]);
    }else{
      const want=found.filter(x=>inRange(x.vol,range)&&!books.some(b=>b.isbn===x.isbn));
      let n=0;
      for(const x of want) if(await add(x.isbn,{own:addOwn,quiet:true,rec:x,defer:true})) n++;
      total+=n;
      const miss=range&&range.list
        ? [...range.list].filter(v=>!found.some(x=>x.vol===v))
        : (range?[]:[]);
      rows.push([found[0].series||name,
        `${n}冊追加`+(miss.length?`（${miss.join('、')}巻は無し）`:''), n>0]);
    }
    await sleep(250);                       // 国会図書館に連打しない
  }
  await save(); render();
  box.innerHTML=`<div class="lab">結果</div><div class="rows">`
    + rows.map(([a,b,ok])=>`<div class="r"><span>${esc(a)}</span>
        <span style="color:${ok?'var(--jade)':'var(--alert)'}">${esc(b)}</span></div>`).join('')
    + `</div>`;
  go.disabled=false;
  go.textContent=total?`${total}冊を${ownLabel(addOwn)}で追加しました`:'追加できませんでした';
  if(total) go.classList.add('done');
}

/* ══ 新刊を調べる ══
   これまでの「買うべき巻」は、所持している範囲の穴しか見ていなかった。
   19巻まで持っていて20巻が出ていても気づけない。
   棚のシリーズを国会図書館に問い合わせ、所持最大巻より先に実在する巻を出す。
   結果は保存しない。持ち越すと「最新巻」が古いまま固定されて、
   抜け巻検出そのものが嘘になるため、押すたびに引き直す。 */
async function checkNew(){
  const box=document.getElementById('card');
  const all=build(books).filter(g=>g.isSeries);
  const gs=all.filter(g=>!isDone(g));          // 完結にした作品は追いかけない
  const skipped=all.length-gs.length;
  if(!gs.length){
    box.innerHTML=`<p class="meta" style="padding:12px 0">`
      +(all.length?`調べる作品がありません（${skipped}作品は完結にしています）。`
                  :'シリーズがまだありません。')+'</p>';
    return;
  }
  const found=[]; let err=null;
  for(let i=0;i<gs.length;i++){
    const g=gs[i];
    box.innerHTML=`<div class="lab">新刊を調べています</div>
      <p class="meta" style="padding:10px 0">${esc(g.series)}（${i+1}/${gs.length}）</p>`;
    let all=[];
    try{ all=await searchSeries(g.series,akey(g.author)); }catch(e){ err=e; }
    if(lastError) err=lastError;
    all.filter(x=>x.vol>g.max&&!books.some(b=>b.isbn===x.isbn))
       .forEach(x=>found.push(Object.assign({},x,{_series:g.series,_from:g.max})));
    await sleep(250);                     // 国会図書館に連打しない
  }
  if(!found.length){
    box.innerHTML=`<div class="lab">新刊</div><p class="meta" style="padding:12px 0">`
      +(err?`調べきれませんでした。${errText(err)}。`
           :`${gs.length}作品を調べました。新しい巻は見つかりませんでした。`
            +(skipped?`（完結の${skipped}作品は除く）`:''))
      +`</p>`;
    return;
  }
  found.sort((a,b)=>a._series.localeCompare(b._series)||a.vol-b.vol);
  const names=[...new Set(found.map(x=>`${x._series}（${x._from}巻まで所持）`))];
  box.innerHTML=`<div class="lab">続きが出ています</div>`
    + names.map(n=>`<p class="meta" style="margin:0">${esc(n)}</p>`).join('')
    + results(found)
    + `<p class="meta" style="margin-top:10px">追加すると「未所持」で入ります。買ったら持ちかたを変えてください。</p>`;
  wire(box,found,'','none');       // 新刊はまだ持っていないので既定を「未所持」にする
}

// 0件だったのか、そもそも届かなかったのか。利用者にはこの区別が要る

// 各サービスに実際につないで、どこで止まっているか見せる
async function diagnose(box){
  box.innerHTML='<p class="meta" style="padding:10px 0">確かめています…</p>';
  const out=[];
  const probe=async(name,url)=>{
    const t0=Date.now();
    try{
      const r=await fetch(url);
      out.push([name, r.ok?`つながった（${Date.now()-t0}ms）`:`HTTP ${r.status}`, r.ok]);
    }catch(e){ out.push([name,'届かない',false]); }
  };
  await probe('国会図書館サーチ',NDL+'?mediatype=books&cnt=1&title='+encodeURIComponent('吾輩は猫である'));
  await probe('openBD','https://api.openbd.jp/v1/get?isbn=9784065123454');
  if(typeof Image!=='undefined'){
    const okimg=await new Promise(res=>{
      const i=new Image(); i.onload=()=>res(true); i.onerror=()=>res(false);
      i.src=gCover('9784101010014');
      setTimeout(()=>res(false),6000);
    });
    out.push(['書影（Google）', okimg?'つながった':'届かない', okimg]);
  }
  // 検索の土台は国会図書館サーチ。ここが赤なら他が緑でも本は探せない
  const ndlOK=(out[0]||[])[2], alive=out.some(x=>x[2]);
  const note = ndlOK
    ? '検索の土台はつながっています。題名の表記を変えて試してみてください。'
    : alive
      ? '国会図書館サーチにだけ届いていません。時間をおくと戻ることがあります。'
      : 'どれにも届いていません。'+(inPreview()
          ? 'プレビューの外——GitHub Pages などに置いて Chrome で開いてください。'
          : '端末のネットワークか、ページの置き場所の制限を確認してください。');
  box.innerHTML=`<div class="lab">通信の状態</div><div class="rows">`
    + out.map(([n,v,good])=>`<div class="r"><span>${esc(n)}</span>
        <span style="color:${good?'var(--jade)':'var(--alert)'}">${esc(v)}</span></div>`).join('')
    + `</div><p class="meta" style="margin-top:12px">${note}</p>`
    + `<button class="bulk" id="hand2">手で登録する</button>`;
}

// APIが使えなくても棚は作れるようにする
async function addManual(title,own){
  const t=String(title||'').trim(); if(!t) return null;
  const b=Object.assign({isbn:'M'+Date.now().toString(36),title:t,author:'',publisher:'',
    date:'',cover:'',src:'手入力'},parseSeries(t),
    {added:Date.now(),own:own||'paper',status:'stock',anime:false,rate:0,place:'',note:''});
  books.unshift(b); await save(); render();
  return b;
}

function results(items){
  // 同じ巻が複数版ある（通常版と特装版など）ときは、2件目以降にその旨を出す
  const seen=new Set();
  return items.map((x,i)=>{
    const s=coverSrcs(x), p=seriesOf(x);
    const k=p.vol?skey(p.series)+'#'+p.vol:null;
    const dup=k&&seen.has(k); if(k) seen.add(k);
    return `<div class="hit">
    ${s.length?`<img src="${esc(s[0])}" alt="" loading="lazy" data-p="1"
        data-n="${esc(s.slice(1).map(encodeURIComponent).join(' '))}" onload="ckCover(this)" onerror="nextCover(this)">`
       :`<div class="ph"></div>`}
    <div class="n">${esc(x.title)}${dup?'<em class="alt">別版</em>':''}<small>${esc(x.author)}${
      x.date?' / '+esc(x.date.slice(0,4)):''}</small></div>
    <button class="go" data-i="${i}">追加</button></div>`; }).join('');
}
function wire(box,items,q,own){
  const pick=()=>own||addOwn;                  // 呼び出し元が持ちかたを指定できる
  const diag=box.querySelector('#diag');
  if(diag) diag.onclick=()=>diagnose(box).then(()=>wire(box,[],q));
  ['#hand','#hand2'].forEach(sel=>{
    const h=box.querySelector(sel);
    if(h) h.onclick=async()=>{
      const name=(q||'').trim();
      const b=await addManual(name,pick());
      if(b){ closeSheet(); toast(`『${b.title.slice(0,16)}』を手で登録`); }
    };
  });
  const bulk=box.querySelector('#bulk');
  if(bulk) bulk.onclick=async()=>{
    const name=seriesOf(bulkList[0]).series;
    bulk.textContent='全巻を探しています…';
    let list=await searchSeries(name);
    if(list.length<bulkList.length) list=bulkList;          // 拾えなければ見えている分だけ
    // 範囲の指定（プルダウン）があればそれで絞る
    const from=+((box.querySelector('#bfrom')||{}).value||1);
    const toSel=(box.querySelector('#bto')||{}).value||'all';
    list=list.map(x=>Object.assign({},x,seriesOf(x)))
      .filter(x=>!books.some(b=>b.isbn===x.isbn))
      .filter(x=>!x.vol||(x.vol>=from&&(toSel==='all'||x.vol<=+toSel)));
    let n=0;
    for(const x of list){
      // 書誌は検索で取れている。ここで引き直さないので待ち時間も要らない
      if(await add(x.isbn,{own:pick(),quiet:true,rec:x,defer:true})) n++;
    }
    await save(); render();
    if(!n){ bulk.textContent='追加できる巻がありませんでした'; bulk.classList.add('done'); return;
    }
    bulk.textContent=`${n}冊を${ownLabel(pick())}で追加しました`;
    bulk.classList.add('done'); bulk.onclick=null;
  };
  box.querySelectorAll('.go').forEach(btn=>btn.onclick=async()=>{
    const x=items[+btn.dataset.i]; btn.textContent='…';
    const b=await add(x.isbn,{own:pick(),quiet:true,rec:x});
    if(b){ btn.textContent=ownLabel(pick())+'で追加'; btn.classList.add('done'); btn.onclick=null; }
    else btn.textContent='追加';
  });
}

/* ══ スキャン ══ */
let stream=null, loop=null, busy=false;
const isSecure=()=>location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ══ 連続スキャン（USBバーコードリーダー） ══
   USBのリーダーはほぼ全てHIDキーボードとして振る舞い、読んだ数字を高速に
   打ち込んで最後にEnterを送る。カメラも BarcodeDetector も要らないので、
   カメラが使えない端末はこちらに回す。
   人の打鍵と区別するため、キーの間隔が短い数字の並びだけを拾う。 */
const HID_GAP=120;                       // これより間が空いたら人の入力とみなして捨てる
let hid={buf:'',t:0,on:false,n:0};
document.addEventListener('keydown',e=>{
  if(!hid.on) return;
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA') return;      // 手入力の邪魔をしない
  const now=Date.now();
  if(now-hid.t>HID_GAP) hid.buf='';
  hid.t=now;
  if(/^[0-9]$/.test(e.key)){ hid.buf+=e.key; return; }
  if(e.key!=='Enter') return;
  const code=hid.buf; hid.buf='';
  if(code) hidAdd(code);
});

async function hidAdd(code){
  const log=document.getElementById('ulog'); if(!log) return;
  const row=(text,color)=>{
    if(log.querySelector('.meta')) log.innerHTML='<div class="rows"></div>';
    const box=log.querySelector('.rows')||log;
    const d=document.createElement('div'); d.className='r';
    const a=document.createElement('span'); a.textContent=text;   // textContent なので何が来ても安全
    const b=document.createElement('span'); b.textContent=color==='ok'?'追加':'—';
    b.style.color=color==='ok'?'var(--jade)':'var(--alert)';
    d.append(a,b); box.prepend(d);
    document.getElementById('ucount').textContent=hid.n+'冊';
  };
  if(!isISBN13(code)){ row(`ISBN として正しくありません（${code}）`,'ng'); return; }
  if(books.some(b=>b.isbn===code)){ row('もう棚にあります','ng'); return; }
  const b=await add(code,{own:addOwn,quiet:true});
  if(b){ hid.n++; row(b.title,'ok'); } else row(`見つかりませんでした（${code}）`,'ng');
}

function openScanUSB(){
  hid={buf:'',t:0,on:true,n:0};
  openWith(`
    <h2>連続スキャン</h2>
    <p class="meta">USBバーコードリーダーで、裏表紙の <b>978</b> で始まる方を続けて読ませてください。
      画面はこのままで大丈夫です。入力欄を選ぶ必要はありません。</p>
    ${'BarcodeDetector' in window?'':`<p class="meta">この端末はカメラでの読み取りに対応していません
      （iPhone / iPad など）。リーダーが無ければ「探す」からタイトルや ISBN で登録できます。</p>`}
    <div class="lab">追加するときの持ちかた</div>
    <div class="seg" id="uo">${OWNS.map(o=>
      `<button data-v="${o.id}" class="${addOwn===o.id?'on':''}">${o.label}</button>`).join('')}</div>
    <div class="lab">読み取り<span style="float:right" id="ucount">0冊</span></div>
    <div id="ulog"><p class="meta" style="padding:10px 0">待っています…</p></div>`);
  document.getElementById('uo').onclick=e=>{
    const t=e.target.closest('[data-v]'); if(!t) return;
    addOwn=t.dataset.v;
    [...document.getElementById('uo').children].forEach(x=>x.classList.toggle('on',x===t));
  };
}

document.getElementById('scan').onclick=async()=>{
  // カメラが使えない端末（Windows の Chrome など）はUSBリーダー用の画面へ回す
  if(!('BarcodeDetector' in window)){ openScanUSB(); return; }
  if(!isSecure()){ toast('カメラは https か localhost でのみ使えます',true); return; }
  const video=document.getElementById('video');
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
  }catch(e){ toast('カメラを使う許可が必要です',true); return; }
  video.srcObject=stream; await video.play();
  document.getElementById('scanner').classList.add('on');
  document.getElementById('log').innerHTML='';
  try{ history.pushState({sc:1},''); }catch(e){}   // 戻るキーで閉じられるようにする

  const det=new BarcodeDetector({formats:['ean_13']});
  loop=setInterval(async()=>{
    if(busy) return; busy=true;
    try{
      const [code]=await det.detect(video);
      if(code){
        const v=code.rawValue.replace(/\D/g,'');
        if(isISBN13(v)){
          if(navigator.vibrate) navigator.vibrate(35);
          const f=document.getElementById('flash');
          f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
          if(books.some(x=>x.isbn===v)){
            pushLog('すでに棚にあります');
          }else{
            const b=await add(v,{own:'paper',quiet:true});
            if(b) pushLog(b.series?`${b.series} ${b.vol}`:b.title);
            else  pushLog('情報が見つかりません（'+v+'）');
          }
          await sleep(1000);
        }else if(v.startsWith('192')){
          document.getElementById('hint').textContent='それは下段です。上段（978…）を読ませてください';
        }
      }
    }catch(e){}
    busy=false;
  },260);
};
function pushLog(t){
  const box=document.getElementById('log');
  const d=document.createElement('div'); d.textContent=t; box.appendChild(d);
  while(box.children.length>3) box.removeChild(box.firstChild);
}
// カメラは必ず止める。止め忘れるとレンズが光ったままになり、電池も食う
function stopScan(fromPop){
  clearInterval(loop); loop=null;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  document.getElementById('scanner').classList.remove('on');
  document.getElementById('hint').innerHTML='裏表紙の<b>上段</b>（978…）を枠に合わせてください';
  if(!fromPop && history.state && history.state.sc){ ignorePop++; history.back(); }
}
document.getElementById('stop').onclick=()=>stopScan();

/* ══ メニュー ══ */
document.getElementById('more').onclick=()=>{
  const gs=build(books), authors={};
  books.forEach(b=>(b.author||'').split(/[、,\/／]/).forEach(a=>{
    a=a.trim().replace(/\s*[／\/]?\s*著$/,''); if(a) authors[a]=(authors[a]||0)+1;
  }));
  const top=Object.entries(authors).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const n=f=>books.filter(f).length;
  openWith(`
    <h2>この棚のこと</h2>
    <div class="rows">
      <div class="r"><span>紙で所持</span><span>${n(b=>b.own==='paper')}</span></div>
      <div class="r"><span>電子で所持</span><span>${n(b=>b.own==='digital')}</span></div>
      <div class="r"><span>未所持の登録</span><span>${n(b=>b.own==='none')}</span></div>
      <div class="r"><span>シリーズ</span><span>${gs.filter(g=>g.isSeries).length}</span></div>
      <div class="r"><span>買うべき巻</span><span>${gs.reduce((s,g)=>s+g.buy.length,0)}</span></div>
      <div class="r"><span>積読（所持・未読）</span><span>${n(b=>b.own!=='none'&&(b.status||'stock')==='stock')}</span></div>
      <div class="r"><span>読了</span><span>${n(b=>b.status==='read')}</span></div>
      <div class="r"><span>今年の読了</span><span>${n(b=>b.readAt&&new Date(b.readAt).getFullYear()===new Date().getFullYear())}</span></div>
      <div class="r"><span>アニメで見た</span><span>${n(b=>b.anime)}</span></div>
      ${top.map(([a,c])=>`<div class="r"><span>${esc(a)}</span><span>${c}冊</span></div>`).join('')}
    </div>
    <div class="menu" style="margin-top:16px">
      <button id="binput">まとめて入力（題名と巻数で）</button>
      <button id="new">新刊を調べる</button>
      <button id="usb">連続スキャン（USBリーダー）</button>
      <button id="ejson">JSON で書き出す</button>
      <button id="ecsv">CSV で書き出す</button>
      <button id="imp">JSON を読み込む</button>
      <button id="net">通信を確かめる</button>
    </div>`);
  document.getElementById('binput').onclick=()=>openBulkInput();
  document.getElementById('usb').onclick=()=>openScanUSB();
  document.getElementById('new').onclick=()=>checkNew();
  document.getElementById('net').onclick=()=>{
    const box=document.getElementById('card');
    diagnose(box).then(()=>wire(box,[],''));
  };
  document.getElementById('ejson').onclick=()=>exportJSON();
  document.getElementById('ecsv').onclick=()=>{
    const cols=['isbn','title','author','publisher','date','series','vol','own','status','anime','rate','place','note'];
    const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
    dl('\uFEFF'+[cols.join(',')].concat(books.map(b=>cols.map(c=>q(b[c])).join(','))).join('\r\n'),'csv','text/csv');
  };
  document.getElementById('imp').onclick=()=>{
    const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
    inp.onchange=async()=>{
      try{
        const data=JSON.parse(await inp.files[0].text());
        // 旧形式（配列そのまま）と新形式（{books,done,sort}）の両方を受ける
        const list=Array.isArray(data)?data:(data&&Array.isArray(data.books)?data.books:null);
        if(!list) throw 0;
        if(!Array.isArray(data)){
          (Array.isArray(data.done)?data.done:[]).forEach(k=>doneKeys.add(k));
          if(data.sort&&SORTS.some(x=>x.id===data.sort)) sortBy=data.sort;
        }
        const seen=new Set(books.map(b=>b.isbn));
        list.forEach(b=>{ if(b&&b.isbn&&!seen.has(b.isbn)){ books.push(normalize(b)); seen.add(b.isbn); } });
        books=books.filter(b=>b.title);            // 題名まで無いものは棚に置けない
        books.sort((x,y)=>(y.added||0)-(x.added||0));
        await save(); await saveMeta(); render(); closeSheet(); toast('読み込みました');
      }catch(e){ toast('このファイルは読み込めません',true); }
    };
    inp.click();
  };
};
function dl(text,ext,mime){
  const url=URL.createObjectURL(new Blob([text],{type:mime}));
  const a=document.createElement('a');
  a.href=url; a.download=`bookshelf-${new Date().toISOString().slice(0,10)}.${ext}`;
  a.click();
  // すぐ revoke すると保存が始まる前にURLが消えることがある（特にスマホ）
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  meta.exportAt=Date.now(); meta.exportN=books.length; saveMeta();
  render();
}
/* 棚だけでなく、完結の印と並び順も一緒に書き出す。
   books だけ戻すと完結の印が消えていた */
const exportJSON=()=>dl(JSON.stringify({app:'bookshelf',version:3,
  books,done:[...doneKeys],sort:sortBy},null,2),'json','application/json');
/* ══ 書き出しの催促 ══
   棚は端末の中にしか無い。ブラウザのデータを消せば全部消える。
   書き出し機能があっても、きっかけが無いと押さないので、
   前回から離れたときだけ静かに促す。データを自動送信することはしない。 */
function exportHint(){
  if(!books.length) return '';
  const at=meta.exportAt;
  const days=at?Math.floor((Date.now()-at)/86400000):0;
  const grew=at?books.length-meta.exportN:books.length;
  if(at&&days<30&&grew<20) return '';
  const why=!at ? 'まだ一度も控えを取っていません'
    : grew>=20 ? `前回の控えから${grew}冊増えました`
    : `前回の控えから${days}日たちました`;
  return `<button class="hint" id="exphint">${esc(why)}。書き出しておきませんか</button>`;
}

/* ══ 起動（v1 / v2 のデータも引き継ぐ） ══ */
function normalize(b){
  // 題名の無いレコードが混ざると、表紙や一覧の描画がそこで落ちる。
  // 読み込んだファイルが手で編集されていることもあるので、ここで最低限を保証する
  b.title=String(b.title==null?'':b.title);
  b.author=String(b.author==null?'':b.author);
  b.publisher=String(b.publisher==null?'':b.publisher);
  b.date=String(b.date==null?'':b.date);
  { const d=ym(b.date); if(d) b.date=d; }   // 供給元ごとに形が違った刊行日を YYYYMM に揃える
  Object.keys(b).forEach(k=>{ if(k[0]==='_') delete b[k]; });  // 過去に紛れ込んだ作業フィールドを掃除
  if(!b.series&&!b.vol) Object.assign(b,parseSeries(b.title));
  if(!b.status) b.status=b.read?'read':'stock';
  delete b.read;
  if(!b.own) b.own='paper';            // 以前のデータは「紙で所持」とみなす
  b.anime=!!b.anime; b.rate=b.rate||0; b.readAt=b.readAt||0;
  b.place=b.place||''; b.note=b.note||''; b.cover=b.cover||'';
  return b;
}
document.getElementById('q').addEventListener('input',e=>{
  filter=norm(e.target.value).trim().toLowerCase(); render();
});
let tt;
function toast(msg,warn,action){
  const el=document.getElementById('toast');
  el.textContent=msg;
  if(action){
    const b=document.createElement('button');
    b.textContent=action.label;
    b.onclick=()=>{ el.classList.remove('on'); action.fn(); };
    el.appendChild(b);
  }
  el.classList.toggle('warn',!!warn);
  el.classList.toggle('act',!!action);
  el.classList.add('on');
  // 押せるボタンがあるときは、読む→迷う→押す の時間ぶん長く残す
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),action?6000:2200);
}
(async()=>{
  books=(await store.get(KEY))||[];
  if(!books.length){
    for(const k of PREV){
      const old=await store.get(k);
      if(Array.isArray(old)&&old.length){ books=old; break; }
    }
  }
  books=books.map(normalize).filter(b=>b.title);
  await loadMeta();
  /* 読み込みに失敗したときは保存しない。空の棚で上書きすると、
     壊れていた（＝直せたかもしれない）データまで消えてしまう */
  if(store.bad) toast('保存データを読み込めませんでした。元のデータは退避してあります',true);
  else await save();
  render();
})();
