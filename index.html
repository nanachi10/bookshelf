/* ══ 外伝・スピンオフの一覧 ══
   本編を棚に入れた人が次に探すのはたいてい外伝。
   選べば、その作品の巻ピッカーがそのまま開く。 */
async function spinoffs(g){
  const job=viewJob('series'), box=document.getElementById('found');
  box.innerHTML='<p class="meta" style="padding:12px 0">関連する作品を探しています…</p>';
  let rel=[];
  try{ rel=await searchRelated(g.series,g.author,job.signal); }catch(e){}
  if(!job.current()) return;
  if(!rel.length){
    box.innerHTML=lastError
      ? `<p class="meta" style="padding:12px 0;color:var(--alert)">${esc(errText(lastError))}。</p>`
      : '<p class="meta" style="padding:12px 0">関連する作品は見つかりませんでした。</p>';
    return;
  }
  const owned=t=>books.some(b=>mkey(b.series||b.title)===skey(t));
  const row=r=>`<button class="hit" data-rel="${esc(r.title)}">
    <div class="n">${esc(r.title)}${r.shared?'':'<em class="alt">別作者</em>'}
      <small>${esc(r.author.split(/[、,\/／]/).slice(0,2).join('、'))}${
        r.count>1?` / ${r.count}巻`:''}</small></div>
    <span class="go ${owned(r.title)?'done':''}">${owned(r.title)?'棚にある':'見る'}</span></button>`;
  const near=rel.filter(r=>r.shared), far=rel.filter(r=>!r.shared);
  box.innerHTML=`<div class="lab">関連する作品</div>`+near.map(row).join('')
    +(far.length?`<div class="lab">同じ名前の別作品</div>`+far.slice(0,6).map(row).join(''):'');
  box.querySelectorAll('[data-rel]').forEach(el=>el.onclick=()=>{
    const r=rel.find(x=>x.title===el.dataset.rel); if(!r) return;
    // 棚にあるならその束を開き、無ければ「入れる前の束」に見せかけて巻を選ばせる
    const g2=build(books).find(x=>x.series&&mkey(x.series)===skey(r.title));
    if(g2) return openSeries(g2.key);
    openWith(`<h2>${esc(r.title)}</h2>
      <p class="meta">${esc(r.author)}</p><div id="found"></div>`);
    volPicker({series:r.title, author:r.author, edition:'',
               by:new Map(), gaps:[], max:0, key:null});
  });
}

/* ══ 巻ピッカー ══
   3巻しか持っていない状態で1・2巻を足す、が最短でできる入口。
   全巻を調べて出し、足りない巻をタップで選ばせる。
   小説と漫画が同居する題名は、版（著者）を選んでから。 */
async function volPicker(g,pre){
  const job=viewJob('series'), box=document.getElementById('found');
  box.innerHTML='<p class="meta" style="padding:12px 0">全巻を調べています…</p>';
  const tq0=performance.now();
  let eds=[], issue=null;
  try{ const found=await searchSeriesAll(g.series,false,job.signal); issue=found.error; eds=found.filter(e=>e.count>=1||(e.unplaced||[]).length); }catch(e){ issue=e; }
  if(!job.current()) return;
  logAct('巻ピッカー',g.series,performance.now()-tq0);
  if(!eds.length){
    box.innerHTML=lastError
      ? `<p class="meta" style="padding:12px 0;color:var(--alert)">${esc(errText(lastError))}。</p>`
      : '<p class="meta" style="padding:12px 0">巻が見つかりませんでした。</p>';
    return;
  }
  /* 棚のこの束と同じ版を既定にする。著者だけでなく版元も見る
     （同じ著者名で小説版と漫画版が分かれることがある） */
  const mineKey=akey(g.author)+'|'+pkey(g.edition||'');
  let cur=eds.find(e=>e.ak+'|'+e.pk===mineKey)
          ||eds.find(e=>e.ak===akey(g.author))||eds[0];
  const ekey=e=>e.ak+'|'+e.pk;
  const sel=new Set(pre?[pre]:g.gaps);
  const draw=()=>{
    const ed=cur;
    const unplaced=(ed.unplaced||[]).filter(x=>!books.some(b=>b.isbn===x.isbn));
    /* 「持っている」の判定は版ごとに。小説1〜4巻を持っていても、
       漫画版の1〜4巻はまだ持っていない（両方集める人がいる）。
       版元まで分かれている束では、版元も一致していなければ別の版として扱う。 */
    const ownEd=g.edition?ekey(ed)===mineKey:ed.ak===akey(g.author);
    const has=x=>books.some(b=>b.isbn===x.isbn)||(ownEd&&g.by.has(x.vol));
    const avail=ed.items.filter(x=>!has(x));
    const availSet=new Set(avail.map(x=>x.vol));
    [...sel].forEach(v=>{ if(!availSet.has(v)) sel.delete(v); });
    // 版が2つ以上あるときだけ、どれを入れるか選ばせる
    const multi=eds.filter(e=>e.count>=1);
    const edChips=multi.length>1
      ? `<div class="chips" style="margin:6px 0 2px">`+multi.map(e=>
          `<button class="chip ${ekey(e)===ekey(ed)?'on':''}" data-ed="${esc(ekey(e))}">${
            esc(e.label)}（${e.count}巻）</button>`).join('')+`</div>`
      : '';
    let chips='';
    ed.items.forEach(x=>{
      if(has(x)){
        const mineB=ownEd?g.by.get(x.vol):null;
        chips+=`<span class="v ${mineB?vcls(mineB):'paper'}">${x.vol}</span>`; return;
      }
      chips+=`<button class="v ${sel.has(x.vol)?'pick':'can'}" data-vol="${x.vol}">${x.vol}</button>`;
    });
    /* 棚では抜けているのに、この版の記録に無い巻がある。
       他の版なら見つかることがあるので、黙って隠さず伝える。 */
    const edVols=new Set(ed.items.map(x=>x.vol));
    const nowhere=g.gaps.filter(v=>!edVols.has(v));
    const elsewhere=nowhere.filter(v=>eds.some(e2=>e2!==ed&&e2.items.some(x=>x.vol===v)));
    box.innerHTML=(issue?`<p class="meta" style="color:var(--alert)">${esc(errText(issue))}</p>`:'')
      +`<div class="lab">巻を選ぶ（見つかった${ed.count}巻・持っている巻は金）</div>`
      +edChips
      +(unplaced.length?`<div class="lab">巻番号を確認できない記録</div><p class="meta">自動的に1巻にしません。書名・ISBNを確認して1冊ずつ登録できます。</p><div id="unplaced">${results(unplaced)}</div>`:'')
      +`<div class="strip pickgrid" style="margin-top:6px">${chips}</div>`
      +(nowhere.length?`<p class="meta" style="margin-top:8px">${
        esc(nowhere.join('、'))}巻はこの版に見あたりません。${
        elsewhere.length?`別の版（上のボタン）にあります。`
          :'国会図書館にまだ記録が無いか、別の題名で入っているかもしれません。'}</p>`:'')
      +(avail.length?`<div class="chips" style="margin-top:8px">
          <button class="chip" id="selgap">抜けている巻だけ</button>
          <button class="chip" id="selall">全部</button>
          <button class="chip" id="selnone">選び直す</button></div>
        <div class="lab">持ちかた</div>
        <div class="seg" id="vpo">${OWNS.map(o=>
          `<button data-v="${o.id}" class="${addOwn===o.id?'on':''}">${o.label}</button>`).join('')}</div>
        <button class="bulk" id="vgo">選んだ${sel.size}冊を入れる</button>`
       :`<p class="meta" style="padding:10px 0">今回取得できた、この版の巻は棚にあります。</p>`);
    box.onclick=async e=>{
      if(e.target.closest('#unplaced')) return;
      const vb=e.target.closest('[data-vol]');
      if(vb){ const v=+vb.dataset.vol; sel.has(v)?sel.delete(v):sel.add(v); draw(); return; }
      const ec=e.target.closest('[data-ed]');
      if(ec){ cur=eds.find(x=>ekey(x)===ec.dataset.ed)||cur; draw(); return; }
      const ob=e.target.closest('#vpo [data-v]');
      if(ob){ addOwn=ob.dataset.v; draw(); return; }
      if(e.target.closest('#selgap')){ sel.clear(); g.gaps.forEach(v=>{ if(availSet.has(v)) sel.add(v); }); draw(); return; }
      if(e.target.closest('#selall')){ sel.clear(); avail.forEach(x=>sel.add(x.vol)); draw(); return; }
      if(e.target.closest('#selnone')){ sel.clear(); draw(); return; }
      if(e.target.closest('#vgo')){
        if(!sel.size){ toast('巻をタップして選んでください',true); return; }
        const want=avail.filter(x=>sel.has(x.vol));
        const got=await addMany(want,addOwn); if(!got) return;
        const n=got.length;
        fillCoversFor(got);      // 表紙はあとから届けばよい。待たせない
        logAct('巻を追加',`${g.series}｜${n}冊｜${ownLabel(addOwn)}`);
        toast(`${n}冊を${ownLabel(addOwn)}で入れました`);
        // 所持数とストリップを引き直す。外伝から入れたときは新しく出来た束を開く
        const g2=g.key?build(books).find(x=>x.key===g.key)
                     :build(books).find(x=>x.series&&mkey(x.series)===mkey(g.series));
        if(g2) openSeries(g2.key); else closeSheet();
      }
    };
    const unplacedBox=document.getElementById('unplaced');if(unplacedBox) wire(unplacedBox,unplaced,'',addOwn);
  };
  draw();
}
/* ══ まとめて棚から出す ══
   間違って入れた版を丸ごと、あるいは要らない巻だけを消したい。
   1冊ずつシートを開いて消すのは現実的でないので、まとめて外す。
   消すのは取り返しがつかないので、必ず戻せるようにしておく。 */
async function removeMany(list,label){
  if(!list.length){ toast('選んでください',true); return 0; }
  // どこに入っていたかを覚えておき、戻すときは元の位置に差し直す
  let backup=[];
  const kill=new Set(list.map(b=>b.isbn));
  if(!await changeBooks(current=>{
    backup=current.map((b,i)=>({b,i})).filter(x=>kill.has(x.b.isbn));
    return backup.length?current.filter(x=>!kill.has(x.isbn)):null;
  })) return 0;
  render();
  logAct('まとめて削除',`${label}｜${backup.length}冊`);
  toast(`${backup.length}冊を棚から出しました`,false,{label:'元に戻す',fn:async()=>{
    if(!await changeBooks(current=>{
      const next=current.slice(), seen=new Set(next.map(b=>b.isbn));
      backup.forEach(({b,i})=>{ if(!seen.has(b.isbn)){ next.splice(Math.min(Math.max(i,0),next.length),0,b); seen.add(b.isbn); } });
      return next;
    })) return;
    render();
    logAct('削除取消',`${label}｜${backup.length}冊`);
    toast(`${backup.length}冊を戻しました`);
  }});
  return backup.length;
}

/* 巻ピッカーの裏返し。持っている巻をタップで選んで外す。
   「小説版と漫画版が混ざってしまった」ような取り違えを畳んで直せる。 */
function volRemover(g){
  const box=document.getElementById('found');
  const sel=new Set();
  const draw=()=>{
    const rows=g.items.filter(b=>b.vol).sort((a,b)=>a.vol-b.vol);
    const dups=g.extra.length;
    let chips='';
    rows.forEach(b=>{
      chips+=`<button class="v ${sel.has(b.isbn)?'kill':vcls(b)}" data-rm="${esc(b.isbn)}">${b.vol}</button>`;
    });
    const novol=g.items.filter(b=>!b.vol);
    novol.forEach(b=>{
      chips+=`<button class="v ${sel.has(b.isbn)?'kill':vcls(b)}" data-rm="${esc(b.isbn)}">?</button>`;
    });
    box.innerHTML=`<div class="lab">出す巻を選ぶ（${rows.length+novol.length}冊）</div>`
      +`<p class="meta">タップで選びます。${dups?'同じ巻が重なっているぶんも並んでいます。':''}</p>`
      +`<div class="strip pickgrid" style="margin-top:6px">${chips}</div>`
      +`<div class="chips" style="margin-top:8px">
          <button class="chip" id="rmall">全部</button>
          <button class="chip" id="rmnone">選び直す</button></div>`
      +`<button class="bulk ${sel.size?'':'done'}" id="rmgo">選んだ${sel.size}冊を棚から出す</button>`;
    box.onclick=async e=>{
      const t=e.target.closest('[data-rm]');
      if(t){ const k=t.dataset.rm; sel.has(k)?sel.delete(k):sel.add(k); draw(); return; }
      if(e.target.closest('#rmall')){ g.items.forEach(b=>sel.add(b.isbn)); draw(); return; }
      if(e.target.closest('#rmnone')){ sel.clear(); draw(); return; }
      if(e.target.closest('#rmgo')){
        const list=g.items.filter(b=>sel.has(b.isbn));
        if(!(await removeMany(list,g.series))) return;
        // 束ごと消えたときはシートを閉じる。残っていれば引き直す
        const g2=build(books).find(x=>x.key===g.key)
              ||build(books).find(x=>x.series&&mkey(x.series)===mkey(g.series)
                   &&akey(x.author)===akey(g.author));
        if(g2) openSeries(g2.key); else closeSheet();
      }
    };
  };
  draw();
}

/* 19巻を1冊ずつ触るのは現実的でないので、範囲でまとめて変えられるようにする。
   棚に無い巻は飛ばす（未登録の巻を勝手に作らない） */
async function bulkApply(g,upto,fn,label){
  let n=0;
  const selected=new Set([...g.by.entries()].filter(([v])=>v>=1&&v<=upto).map(([,b])=>b.isbn));
  if(!selected.size){ toast('その範囲に棚の本がありません',true); return; }
  if(!await changeBooks(current=>current.map(b=>{
    if(!selected.has(b.isbn)) return b;
    const edited=Object.assign({},b); fn(edited); n++; return edited;
  }))) return;
  render(); closeSheet();
  toast(`${label}変更しました（${n}冊）`);
}

/* ══ 探す（タイトル / 著者 / ISBN のどれでも） ══ */
document.getElementById('find').onclick=()=>openFind();
function openFind(q){
  openWith(`
    <h2>探して棚に入れる</h2>
    <p class="meta">タイトル・著者名でも、13桁のISBNでも。持っていない本もそのまま登録できます。
      打っている途中で下に候補が出ます。英語の原題（OVERLORD など）からも候補で日本語名に移れます。</p>
    <div class="field"><input id="fq" value="${esc(q||'')}" placeholder="例）薬屋のひとりごと ／ 9784041...">
    </div>
    <div class="chips" id="fpre">${presets().map(x=>
      `<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>
    <div class="lab">追加するときの持ちかた</div>
    <div class="seg" id="fo">${OWNS.map(o=>
      `<button data-v="${o.id}" class="${addOwn===o.id?'on':''}">${o.label}</button>`).join('')}</div>
    <div id="fres"></div>
    <div class="acts"><button class="ghost2" id="fbulk">まとめて入力</button>
      <button class="save" id="fgo">検索</button></div>`);
  document.getElementById('fbulk').onclick=()=>openBulkInput();
  document.getElementById('fo').onclick=e=>{
    const t=e.target.closest('[data-v]'); if(!t) return;
    addOwn=t.dataset.v;
    [...document.getElementById('fo').children].forEach(x=>x.classList.toggle('on',x===t));
  };
  /* 打っている途中で作品名の候補を出す。
     手が止まって500ms待ってから1回だけ引く（連打すると国会図書館に断られる）。
     原題（OVERLORD 等）で当たったときは日本語名に橋渡しする。 */
  const fpre=document.getElementById('fpre');
  const chipsOf=list=>list.map(x=>
    `<button class="chip" data-q="${esc(x.q)}">${esc(x.label)}</button>`).join('');
  const preset0=presets().map(x=>({q:x,label:x}));
  let sugT=0, sugSeq=0, findSeq=0;
  const sugCache=new Map();
  document.getElementById('fq').addEventListener('input',()=>{
    clearTimeout(sugT); sugSeq++; findSeq++;
    const job=viewJob('suggest'); viewJob('find');
    const v=norm(document.getElementById('fq').value).trim();
    fpre.innerHTML=chipsOf(preset0);
    if(v.length<2||/^[\d\s\-]+$/.test(v)) return;
    sugT=setTimeout(async()=>{
      const seq=sugSeq; if(!job.current()) return;
      let items=sugCache.get(v);
      if(!items){
        try{ items=await ndlQuery({title:v,cnt:25,signal:job.signal});
          if(job.current()&&items.length) sugCache.set(v,items);
        }catch(e){ items=[]; }
      }
      if(seq!==sugSeq||!job.current()) return;
      const seen=new Set(), out=[];
      rank(items,v).forEach(x=>{
        const nm=x.series||x.title, kk=skey(nm);
        if(seen.has(kk)||out.length>=6) return;
        seen.add(kk);
        const viaAlt=x.alt&&skey(x.alt).indexOf(skey(v))>=0&&skey(nm).indexOf(skey(v))<0;
        out.push({q:nm, label:viaAlt?nm+'（'+x.alt+'）':nm});
      });
      /* 原題で引くと外伝ばかり並ぶことがある（OVERLORD → 〈新〉世界編、不死者のOh!…）。
         候補の半数が同じ書き出しなら、その共通部分＝本体の作品名を先頭に足す */
      if(out.length>=3){
        const names=out.map(x=>x.q);
        let pre='';
        names.forEach(anchor=>{
          for(let L=anchor.length;L>pre.length;L--){
            const p=anchor.slice(0,L);
            if(p.length>=3&&names.filter(s=>s.startsWith(p)).length*2>=names.length){ pre=p; break; }
          }
        });
        pre=pre.trim();
        if(pre.length>=3&&/[^\x00-\x7F]/.test(pre)&&!seen.has(skey(pre)))
          out.unshift({q:pre,label:pre});
      }
      if(out.length) fpre.innerHTML=chipsOf(out.slice(0,7));
    },500);
  });
  const run=async()=>{
    const raw=document.getElementById('fq').value.trim();
    if(!raw) return;
    clearTimeout(sugT); sugSeq++; viewJob('suggest');
    const job=viewJob('find'), seq=++findSeq;
    const box=document.getElementById('fres');
    const digits=raw.replace(/\D/g,'');
    if(digits.length===13){
      if(!isISBN13(digits)){ toast('13桁の ISBN として正しくありません',true); return; }
      if(books.some(b=>b.isbn===digits)){ toast('この本はもう棚にあります',true); return; }
      box.innerHTML='<p class="meta" style="padding:12px 0">調べています…</p>';
      let b=null;
      try{ b=await add(digits,{own:addOwn,quiet:true,signal:job.signal}); }catch(e){}
      if(seq!==findSeq||!job.current()) return;
      if(b){ closeSheet(); toast(`『${b.title.slice(0,16)}』を追加`); }
      else box.innerHTML=noHits(raw);
      return;
    }
    box.innerHTML='<p class="meta" style="padding:12px 0">探しています…</p>';
    const t0=performance.now();
    let items=[];
    try{ items=(await searchBooks(raw,job.signal)).filter(x=>!books.some(b=>b.isbn===x.isbn)); }catch(e){}
    if(seq!==findSeq||!job.current()) return;
    logAct('検索',raw,performance.now()-t0);
    items=sortByVolume(items);
    box.innerHTML=items.length
      ? (lastError?`<p class="meta" style="color:var(--alert)">${esc(errText(lastError))}</p>`:'')+bulkBar(items,raw)+results(items,true,raw)
      : noHits(raw);
    wire(box,items,raw);
  };
  document.getElementById('fpre').onclick=e=>{
    const c=e.target.closest('[data-q]'); if(!c) return;
    document.getElementById('fq').value=c.dataset.q; run();
  };
  document.getElementById('fgo').onclick=run;
  document.getElementById('fq').addEventListener('keydown',e=>{ if(e.key==='Enter') run(); });
  if(q) run();
}

// 同じ作品は巻順にまとめる。作品どうしの並びは検索の並び（＝入力に近い順）を崩さない
function sortByVolume(items){
  const withS=items.map(x=>Object.assign({},x,seriesOf(x)));
  const order=new Map();
  withS.forEach(x=>{ const k=mkey(x.series||x.title);
    if(!order.has(k)) order.set(k,order.size); });
  return withS.map((x,i)=>[order.get(mkey(x.series||x.title)), x.vol||0, i, x])
    .sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]).map(z=>z[3]);
}
let bulkList=[], bulkEds=[];   // bulkEds＝検索結果から組んだ全版。追加時に引き直さないための控え
function bulkBar(items,q){
  /* 作品（主題名）ごとにまとめ、その中を版（著者＋必要なら版元）で割る。
     題名だけで束ねると小説と漫画が混ざる */
  const byT=new Map();
  items.forEach(x=>{ const p=seriesOf(x); if(!p.vol) return;
    const t=mkey(p.series);
    if(!byT.has(t)) byT.set(t,[]);
    byT.get(t).push(Object.assign({},x,p));
  });
  /* まとめて入れるのは、探した題名そのものだけにする。
     国会図書館は著者の別作品まで返してくるので（「幼女戦記」で
     同じ作者の「売国機関」が来る）、巻数の多さだけで選ぶと
     頼んでいない作品を丸ごと棚に入れてしまう。 */
  const qk=q?mkey(q):'';
  let best=null, sibs=[];
  byT.forEach((list,t)=>{
    if(!qk||t!==qk) return;
    const eds=splitEditions(list).map(e=>{
      const vols=new Map();
      e.items.forEach(x=>{ if(!vols.has(x.vol)) vols.set(x.vol,x); });
      return Object.assign({},e,{vols,count:vols.size});
    }).sort((a,b)=>b.count-a.count);
    if(!best||eds[0].count>best.count){ best=eds[0]; sibs=eds; }
  });
  bulkList=(best&&best.count>=2)
    ? [...best.vols.values()].sort((a,b)=>a.vol-b.vol) : [];
  bulkEds=bulkList.length?sibs:[];
  if(!bulkList.length) return '';
  // 同じ題名に版が2つ以上あるときは、どれを入れるか選ばせる
  const multi=sibs.filter(e=>e.ak&&e.count>=2);
  const edSel=multi.length>1
    ? `<div class="field" style="margin:8px 0 0"><select id="bed">${multi.map(e=>
        `<option value="${esc(e.ak+'|'+e.pk)}"${e===best?' selected':''}>${
          esc(edLabel(e))}（${e.count}巻）</option>`).join('')}
        <option value="both">全部いれる</option></select></div>`
    : '';
  /* 範囲は打たせずに選ばせる。「1-15」のような自由記述は読み違いのもと */
  const vols=[...new Set(bulkList.map(x=>x.vol))].sort((a,b)=>a-b);
  return edSel
    +`<div class="field" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 0">
      <select id="bfrom">${vols.map(v=>`<option value="${v}">${v}</option>`).join('')}</select>
      <span class="meta" style="white-space:nowrap">巻から</span>
      <select id="bto"><option value="all">取得できた最後の巻まで</option>${
        vols.slice().reverse().map(v=>`<option value="${v}">${v}巻</option>`).join('')}</select>
      <span class="meta" style="white-space:nowrap">を</span>
    </div>
    <button class="bulk" id="bulk">${esc(seriesOf(bulkList[0]).series)} をまとめて追加</button>`;
}

/* ══ 完結の印と設定（meta） ══
   openBD の ONIX には「完結フラグ」の枠があるが、実データでは
   よつばと!・オーバーロード・幼女戦記の70冊すべてで空だった。
   完結かどうかは当てにできる情報源が無いので、推測せず本人に宣言してもらう。
   印を付けた作品は「新刊を調べる」の対象から外し、札に「完結」と出す。

   完結・並び順・書き出しの記録は books と同じ保存先（store）にまとめる。
   以前は localStorage 直書きで、書き出しにも含まれず機種変更で消えていた。 */
const META='bookshelf:meta';
/* series: 作品ごとの新刊確認の記録 {gkey:{checkedAt, newVols:[]}}。
   以前は全体で1つの newVols/newAt しか持たず、途中で429に当たると
   それまでの成果が丸ごと捨てられ、次も最初から全作品を調べ直していた。 */
let meta={done:[],sort:'added',dir:1,exportAt:0,exportN:0,newAt:0,newVols:{},series:{}};
let doneKeys=new Set();
// 読み込み済みの値を受け取る形にして、起動時に books と並列で読めるようにする
function validateMeta(m){
  // JSONとして読めても、設定の形が壊れていると newOf() などで描画が止まる。
  // 元データは起動側で保護し、設定だけを一時的な既定値で表示する。
  if(m!=null){
    if(typeof m!=='object'||Array.isArray(m)) throw new Error('設定の形式が不正です');
    if(m.done!=null&&(!Array.isArray(m.done)||m.done.some(k=>typeof k!=='string')))
      throw new Error('完結の印が不正です');
    const validVols=vs=>Array.isArray(vs)&&vs.every(v=>Number.isInteger(v)&&v>=1&&v<=200);
    if(m.series!=null){
      if(typeof m.series!=='object'||Array.isArray(m.series)) throw new Error('新刊記録が不正です');
      Object.values(m.series).forEach(v=>{
        if(!v||typeof v!=='object'||Array.isArray(v)||(v.newVols!=null&&!validVols(v.newVols)))
          throw new Error('新刊記録が不正です');
      });
    }
    if(m.newVols!=null){
      if(typeof m.newVols!=='object'||Array.isArray(m.newVols)||Object.values(m.newVols).some(v=>!validVols(v)))
        throw new Error('旧新刊記録が不正です');
    }
  }
}
function loadMeta(m){
  validateMeta(m);
  if(m&&typeof m==='object') Object.assign(meta,m);
  else{
    // 旧形式（localStorage 直書き）からの引き継ぎ
    try{ meta.done=JSON.parse(localStorage.getItem('bookshelf:done')||'[]'); }catch(e){}
    try{ const s=localStorage.getItem('bookshelf:sort'); if(s) meta.sort=s; }catch(e){}
    try{ const ex=JSON.parse(localStorage.getItem('bookshelf:lastExport')||'null');
         if(ex){ meta.exportAt=ex.at||0; meta.exportN=ex.n||0; } }catch(e){}
  }
  doneKeys=new Set(Array.isArray(meta.done)?meta.done:[]);
  if(SORTS.some(x=>x.id===meta.sort)) sortBy=meta.sort;
  sortDir=meta.dir===-1?-1:1;
  if(!meta.series||typeof meta.series!=='object'||Array.isArray(meta.series)) meta.series={};
  // 旧形式（全体で1つの newVols）からの引き継ぎ。調べた時刻は全体の newAt を充てる
  if(!Object.keys(meta.series).length&&meta.newVols&&typeof meta.newVols==='object'){
    Object.keys(meta.newVols).forEach(k=>{
      meta.series[k]={checkedAt:meta.newAt||0, newVols:meta.newVols[k]||[]}; });
  }
}
function saveMeta(){
  meta.done=[...doneKeys]; meta.sort=sortBy; meta.dir=sortDir;
  if(!meta.series||typeof meta.series!=='object') meta.series={};
  return store.set(META,meta);
}
const seriesMeta=g=>{ const m=meta.series[gkey(g)]; return (m&&typeof m==='object')?m:null; };
// 前回調べたときに見つかっていた新刊。棚に入れたぶんは落とす
const newOf=g=>((seriesMeta(g)||{}).newVols||[]).filter(v=>!g.by.has(v));
/* ══ 操作の記録 ══
   何をいつ追加・削除・検索したかを端末の中だけに残す。
   不具合の再現手順を思い出せるように、また「よく使う流れ」を
   次の機能を考える材料にするため。外に送ることはない。 */
const LOG='bookshelf:log';
let oplog=[], logT=0;
/* ms は所要時間（あれば）。実機の遅さは開発機では再現できないので、
   利用者の「操作の記録」がそのまま性能の実測値になるようにしておく */
function logAct(type,detail,ms){
  const e={t:Date.now(), type, d:String(detail==null?'':detail).slice(0,120)};
  if(ms!=null) e.ms=Math.round(ms);
  oplog.push(e);
  if(oplog.length>600) oplog=oplog.slice(-500);
  clearTimeout(logT);
  logT=setTimeout(()=>store.set(LOG,oplog),800);   // 連続操作は800msまとめて書く
}

/* 完結の印は版ごとに持つ。小説が完結していても漫画は続いていることがあり、
   共有すると片方が新刊の確認から外れてしまう。
   版が分かれていない束の鍵は従来のままなので、既に付けた印は保たれる。 */
const gkey=g=>skey(g.series||'')+'|'+akey(g.author)+(g.edition?'|'+pkey(g.edition):'');
const isDone=g=>doneKeys.has(gkey(g));
async function toggleDone(g){
  const k=gkey(g);
  if(!await changeMeta(m=>{ const keys=new Set(m.done); keys.has(k)?keys.delete(k):keys.add(k); m.done=[...keys]; return m; })) return null;
  logAct(doneKeys.has(k)?'完結にした':'完結を外した',g.series||'');
  return doneKeys.has(k);
}

/* ══ まとめて入力 ══
   既に持っている巻が分かりきっているとき、長い題名を巻の数だけ打つのは苦行。
   1行に1作品、題名のあとに範囲を書けば、その巻だけを棚に入れる。
     オーバーロード 1-15
     よつばと! 16          ← 数字ひとつなら「その巻まで」
     幼女戦記 1-5,8,10-12
     ソードアート・オンライン  ← 範囲を書かなければ見つかった全巻 */
function parseRange(spec){
  // norm() が全角チルダ ～(U+FF5E) を半角 ~ に寄せるので、そちらも受ける
  const t=norm(spec||'').replace(/[〜～~–—ー]/g,'-').replace(/\s+/g,'');
  if(!t) return null;                                  // 範囲指定なし＝全部
  if(/^\d{1,3}$/.test(t)){ const n=+t; return n>=1?{from:1,to:n,list:null}:null; }
  const set=new Set();
  for(const part of t.split(/[,、]/)){
    let m=part.match(/^(\d{1,3})-(\d{1,3})$/);
    if(m){ const a=+m[1],b=+m[2]; for(let i=Math.min(a,b);i<=Math.max(a,b);i++) set.add(i); continue; }
    m=part.match(/^(\d{1,3})$/);
    if(m) set.add(+m[1]);
  }
  return set.size?{from:null,to:null,list:set}:null;
}
// 「作品名 1-15」を作品名と範囲に割る。題名に数字が入る作品があるので末尾からだけ切る
function parseLine(line){
  const t=norm(line||'').trim();
  if(!t) return null;
  const m=t.match(/^(.*?)[\s　]+([\d\-–—〜～~,、\s]+)$/);
  if(!m) return {name:t, range:null};
  const range=parseRange(m[2]);
  return range ? {name:m[1].trim(), range} : {name:t, range:null};
}
const inRange=(v,r)=>!r ? true : (r.list ? r.list.has(v) : (v>=r.from&&v<=r.to));
// 範囲を巻の一覧に開く（「1〜15」→ 1,2,…,15）
const rangeVols=r=>r.list?[...r.list].sort((a,b)=>a-b)
  :Array.from({length:Math.max(0,r.to-r.from+1)},(_,i)=>r.from+i);
// 連続した巻は「1〜15」に圧縮して見せる
const runs=vs=>{ const a=[...vs].sort((x,y)=>x-y), o=[];
  for(let i=0;i<a.length;){ let j=i;
    while(j+1<a.length&&a[j+1]===a[j]+1) j++;
    o.push(i===j?String(a[i]):a[i]+'〜'+a[j]); i=j+1; }
  return o.join('、'); };

function openBulkInput(){
  openWith(`
    <h2>まとめて入力</h2>
    <p class="meta">1行に1作品、題名だけでかまいません。調べたあとに、
      見つかった巻の範囲をプルダウンで選んでから棚に入れます。
      題名のあとに巻を書いておくと、それが選択の初期値になります（例：よつばと! 16）。</p>
    <div class="field" style="margin-top:12px">
      <textarea id="blines" rows="6" placeholder="オーバーロード 1-15&#10;よつばと! 16"></textarea></div>
    <div id="bprev"></div>
    <div class="lab">持ちかた</div>
    <div class="seg" id="bo">${OWNS.map(o=>
      `<button data-v="${o.id}" class="${addOwn===o.id?'on':''}">${o.label}</button>`).join('')}</div>
    <div id="bres"></div><button class="ghost2" id="bcancel" hidden>調査を中止</button>
    <div class="acts"><button class="save" id="bgo">調べて巻を選ぶ</button></div>`);
  document.getElementById('bo').onclick=e=>{
    const t=e.target.closest('[data-v]'); if(!t) return;
    addOwn=t.dataset.v;
    [...document.getElementById('bo').children].forEach(x=>x.classList.toggle('on',x===t));
  };
  /* どう読み取られたかを打ちながら見せる。
     「1-5,8」の書き損じに、入れてしまってから気づくのでは遅い */
  const blines=document.getElementById('blines'), bprev=document.getElementById('bprev');
  blines.addEventListener('input',()=>{
    const lines=blines.value.split(/\r?\n/).map(parseLine).filter(Boolean);
    bprev.innerHTML=!lines.length?'':
      `<div class="lab">読み取り</div><div class="rows">`+lines.map(l=>{
        const r=l.range;
        const t=!r?'見つかった全巻'
          : r.list?runs(r.list)+'巻'
          : `1〜${r.to}巻`;
        return `<div class="r"><span>${esc(l.name)}</span><span>${esc(t)}</span></div>`;
      }).join('')+`</div>`;
  });
  document.getElementById('bgo').onclick=runBulkInput;
}

/* 2段階にする。まず全作品を調べて「見つかった巻」を出し、
   範囲はプルダウンで選んでから棚に入れる。自由記述の読み違いで
   入れてしまう事故を、選ばせることで潰す。 */
let bulkFound=[], bulkSeq=0;
async function runBulkInput(){
  const job=viewJob('bulk'), seq=++bulkSeq;
  const box=document.getElementById('bres');
  const go=document.getElementById('bgo');
  const lines=document.getElementById('blines').value.split(/\r?\n/)
    .map(parseLine).filter(Boolean);
  if(!lines.length){ toast('1行に1作品ずつ書いてください',true); return; }
  go.disabled=true;
  const cancel=document.getElementById('bcancel'); cancel.hidden=false;
  cancel.onclick=()=>{
    bulkSeq++; job.cancel(); go.disabled=false; cancel.hidden=true;
    const btn=document.getElementById('bcommit');
    if(btn){ btn.disabled=true; btn.textContent='調査を中止しました。入力を残したまま調べ直せます'; }
  };
  bulkFound=[];
  // 選んでいる版（著者）の巻。「両方」は小説と漫画の同じ巻を両方数える
  const itemsOf=r=>{
    if(r.edSel==='both'){
      const m=new Map();
      r.eds.forEach(e=>e.items.forEach(x=>{
        const kk=e.ak+'|'+e.pk+'#'+x.vol; if(!m.has(kk)) m.set(kk,x); }));
      return [...m.values()].sort((a,b)=>a.vol-b.vol);
    }
    const e=r.eds.find(e2=>e2.ak+'|'+e2.pk===r.edSel)||r.eds[0];
    return e?e.items:[];
  };
  const edOf=r=>r.edSel==='both'?null:(r.eds.find(e2=>e2.ak+'|'+e2.pk===r.edSel)||r.eds[0]);
  const rowHTML=r=>{
    if(!r.eds.length) return `<div class="rows"><div class="r"><span>${esc(r.name)}</span>
      <span style="color:var(--alert)">${r.err?'通信が届きませんでした':'見つかりませんでした'}</span></div></div>`;
    // 小説と漫画が同居する題名は、どの版を入れるか選ばせる
    const multi=r.eds.filter(e=>e.ak&&e.count>=2);
    const edSel=multi.length>1
      ? `<div class="field" style="margin:2px 0 4px"><select data-be="${r.i}">${multi.map(e=>
          `<option value="${esc(e.ak+'|'+e.pk)}"${r.edSel===e.ak+'|'+e.pk?' selected':''}>${
            esc(e.label)}（${e.count}巻）</option>`).join('')}
          <option value="both"${r.edSel==='both'?' selected':''}>全部いれる</option></select></div>`
      : '';
    const items=itemsOf(r);
    if(!items.length) return `<div class="lab">${esc(r.name)}</div>`+edSel
      +`<p class="meta" style="color:var(--alert)">${esc(r.eds.error?errText(r.eds.error):'巻番号を確定できる候補がありません')}。「探す」で書名・ISBNを確認してください。</p>`;
    const vols=[...new Set(items.map(x=>x.vol))].sort((a,b)=>a-b);
    // 題名に書いた範囲は初期値として反映する
    const from=r.range?(r.range.list?Math.min(...r.range.list):r.range.from):vols[0];
    const to  =r.range?(r.range.list?Math.max(...r.range.list):r.range.to):null;
    /* 書いた巻がこの版に無く、別の版にあることがある。
       「よつばと!」は版元が移ってアスキー・メディアワークス版とKADOKAWA版に分かれ、
       13巻以降は後者にしか無い。黙って「追加できる巻なし」で終わらせず、
       どちらを選べばよいか伝える。 */
    let note='';
    const cur=edOf(r);
    if(r.range&&cur&&r.eds.length>1){
      const here=new Set(vols);
      const miss=rangeVols(r.range).filter(v=>!here.has(v));
      if(miss.length){
        const alt=r.eds.filter(e=>e!==cur)
          .map(e=>({e, n:miss.filter(v=>e.items.some(x=>x.vol===v)).length}))
          .sort((a,b)=>b.n-a.n)[0];
        if(alt&&alt.n) note=`<p class="meta" style="margin:0 0 4px">${
          esc(runs(miss))}巻はこの版にありません。<b>${esc(alt.e.label)}</b>にあります（上で選べます）。</p>`;
      }
    }
    return `<div class="lab">${esc(items[0]&&items[0].series||r.name)}
        <span style="float:right" id="bn${r.i}"></span></div>`
      +(r.err?`<p class="meta" style="color:var(--alert)">${esc(errText(r.eds.error))}</p>`:'')+edSel+note
      +`<div class="field" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select data-bf="${r.i}">${vols.map(v=>
          `<option value="${v}"${v===from?' selected':''}>${v}</option>`).join('')}</select>
        <span class="meta" style="white-space:nowrap">巻から</span>
        <select data-bt="${r.i}"><option value="all">取得できた最後（${vols[vols.length-1]}巻）</option>${
          vols.slice().reverse().map(v=>
          `<option value="${v}"${to===v?' selected':''}>${v}巻</option>`).join('')}</select>
        <span class="meta" style="white-space:nowrap">まで</span>
      </div>`;
  };
  /* 全作品を調べ終わるまで待たせない。行の枠を先に出し、終わった作品から
     順に埋める。利用者は待っている間に、済んだ行の範囲や版を選び始められる */
  box.innerHTML=`<div class="lab">見つかった作品</div>`
    +lines.map((l,i)=>`<div id="brow${i}"><div class="rows"><div class="r">
        <span>${esc(l.name)}</span><span style="color:var(--dim)">調べています…</span></div></div></div>`).join('')
    +`<button class="bulk done" id="bcommit" disabled>調べています…（0/${lines.length}）</button>`;
  // いま選んでいる範囲で実際に入る巻（棚にある巻・書いた範囲の外は数えない）
  const pickOf=r=>{
    const f=+((box.querySelector(`[data-bf="${r.i}"]`)||{}).value||1);
    const t=((box.querySelector(`[data-bt="${r.i}"]`)||{}).value)||'all';
    return itemsOf(r).filter(x=>x.vol>=f&&(t==='all'||x.vol<=+t)
      &&((r.dirty||!r.range)?true:inRange(x.vol,r.range))   // 触ったらプルダウン優先
      &&!books.some(b=>b.isbn===x.isbn));
  };
  const counts=()=>bulkFound.forEach(r=>{
    const el=document.getElementById('bn'+r.i);
    if(el) el.textContent=pickOf(r).length+'冊';
  });
  counts();
  box.onchange=e=>{
    const be=e.target.dataset.be;
    if(be!=null){                            // 版を替えたら、その行を引き直す
      const r=bulkFound[+be];
      r.edSel=e.target.value; r.dirty=true;
      document.getElementById('brow'+r.i).innerHTML=rowHTML(r);
      counts(); return;
    }
    const i=e.target.dataset.bf!=null?e.target.dataset.bf:e.target.dataset.bt;
    if(i==null) return;
    bulkFound[+i].dirty=true;
    counts();
  };
  document.getElementById('bcommit').onclick=async()=>{
    const btn=document.getElementById('bcommit');
    btn.disabled=true; btn.textContent='入れています…';
    const selected=bulkFound.map(r=>({r,want:pickOf(r)}));
    const got=await addMany(selected.flatMap(x=>x.want),addOwn);
    if(!got){ btn.disabled=false; btn.textContent='もう一度、選んだ巻を棚に入れる'; return; }
    const ids=new Set(got.map(b=>b.isbn)), counted=new Set(), total=got.length;
    const done=selected.map(({r,want})=>{
      const n=want.filter(x=>ids.has(x.isbn)&&!counted.has(x.isbn)&&(counted.add(x.isbn),true)).length;
      return [(itemsOf(r)[0]||{}).series||r.name,r.eds.length?(n?`${n}冊追加`:'追加できる巻なし'):'見つかりませんでした',n>0];
    });
    fillCoversFor(got);          // 表紙はあとから届けばよい。待たせない
    logAct('まとめて入力',`${bulkFound.length}作品｜${total}冊`);
    box.innerHTML=`<div class="lab">結果</div><div class="rows">`
      + done.map(([a,b,ok])=>`<div class="r"><span>${esc(a)}</span>
          <span style="color:${ok?'var(--jade)':'var(--alert)'}">${esc(b)}</span></div>`).join('')
      + `</div>`;
    toast(total?`${total}冊を${ownLabel(addOwn)}で追加しました`:'追加できませんでした',!total);
  };

  // 最大2作品だけ並行に調べる。行順を保ち、次の開始を250ms空ける。
  const t0=performance.now(); let nextLine=0, completed=0;
  bulkFound=lines.map(({name,range},i)=>({i,name,range,eds:[],edSel:null,err:false,dirty:false}));
  const worker=async()=>{
    while(nextLine<lines.length){
      const i=nextLine++;
      if(i>0){ try{ await waitRequest(250,job.signal); }catch(e){ return; } }
      if(seq!==bulkSeq||!job.current()) return;
      const {name,range}=lines[i]; let eds=[];
      try{ eds=await searchSeriesAll(name,false,job.signal); }catch(e){}
      if(seq!==bulkSeq||!job.current()) return;
      const r={i,name,range,eds,edSel:eds[0]?eds[0].ak+'|'+eds[0].pk:null,err:!!eds.error,dirty:false};
      bulkFound[i]=r; completed++;
      const row=document.getElementById('brow'+i); if(row) row.innerHTML=rowHTML(r);
      counts();
      const btn=document.getElementById('bcommit'); if(btn) btn.textContent=`調べています…（${completed}/${lines.length}）`;
    }
  };
  await Promise.all([worker(),worker()]);
  if(seq!==bulkSeq||!job.current()) return;
  cancel.hidden=true;
  logAct('まとめて調査',`${lines.length}作品`,performance.now()-t0);
  go.disabled=false;
  const btn=document.getElementById('bcommit');
  if(btn){ btn.disabled=false; btn.classList.remove('done'); btn.textContent='選んだ巻を棚に入れる'; }
}

/* ══ 新刊を調べる ══
   これまでの「買うべき巻」は、所持している範囲の穴しか見ていなかった。
   19巻まで持っていて20巻が出ていても気づけない。
   棚のシリーズを国会図書館に問い合わせ、所持最大巻より先に実在する巻を出す。
   結果は保存しない。持ち越すと「最新巻」が古いまま固定されて、
   抜け巻検出そのものが嘘になるため、押すたびに引き直す。 */
let checkSeq=0;
async function checkNew(force){
  const job=viewJob('new'), seq=++checkSeq;
  const box=document.getElementById('card');
  const all=build(books).filter(g=>g.isSeries);
  const active=all.filter(g=>!isDone(g));      // 完結にした作品は追いかけない
  const skipped=all.length-active.length;
  if(!active.length){
    box.innerHTML=`<p class="meta" style="padding:12px 0">`
      +(all.length?`調べる作品がありません（${skipped}作品は完結にしています）。`
                  :'シリーズがまだありません。')+'</p>';
    return;
  }
  /* 24時間以内に調べた作品は飛ばす。これで、429で中断しても次は残りから続けられる。
     「それでも全部」も選べるようにしておく（納得がいかないときの逃げ道） */
  const recent=g=>{ const m=seriesMeta(g); return !!m&&m.parserVersion===QVER&&Date.now()-(m.checkedAt||0)<86400000; };
  /* その題名では国会図書館に1冊も無い（手で入れた本や、正式と違う題名）。
     何度聞いても空振りなので、しばらく飛ばす */
  const dead=g=>{ const m=seriesMeta(g); return !!m&&m.parserVersion===QVER&&m.miss&&Date.now()-(m.checkedAt||0)<30*86400000; };
  const gs=force?active.slice():active.filter(g=>!recent(g)&&!dead(g));
  const nRecent=active.filter(g=>recent(g)).length;
  const nDead=active.filter(g=>!recent(g)&&dead(g)).length;
  if(!gs.length){
    box.innerHTML=`<div class="lab">新刊</div>
      <p class="meta" style="padding:12px 0">${
        nDead?`${nRecent}作品は24時間以内に調べたばかりで、${nDead}作品は国会図書館に記録がありません。`
             :`${active.length}作品とも、24時間以内に調べたばかりです。`}</p>
      <button class="bulk" id="cnall">それでも全部調べ直す</button>`;
    document.getElementById('cnall').onclick=()=>checkNew(true);
    return;
  }
  // 続きが出ていそうな作品（最近の刊行）から調べる。早い段階で結果が出る。
  // 刊行日を持たない本（手入力）は0になり、自然と後回しになる
  const lastDate=g=>Math.max(0,...g.items.map(b=>+((b.date||'')+'00').slice(0,6)||0));
  gs.sort((a,b)=>lastDate(b)-lastDate(a));

  box.innerHTML=`<div class="lab">新刊を調べています</div>
    <p class="meta" id="cnprog" style="padding:10px 0">${esc(gs[0].series)}（1/${gs.length}）…</p>
    <button class="ghost2" id="cncancel">調査を中止</button>
    <div id="cnfound"></div><div id="cneditions"></div>`;
  const found=[], alternatives=new Map(), seriesLists=new Map(); let err=null, ng=0, stopped=false, succeeded=0, failed=0;
  const t0=performance.now();
  /* 見つかるたびに出す。総時間は変わらないが、待っている間に結果が見え、
     その場で追加もできる。追加した巻は次の描き直しで一覧から消える */
  const paint=()=>{
    const live=found.filter(x=>!books.some(b=>b.isbn===x.isbn));
    const fbox=document.getElementById('cnfound');
    if(!fbox) return;
    fbox.innerHTML=live.length?`<div class="lab">続きが出ています</div>`+results(live):'';
    wire(fbox,live,'','none');                 // 新刊はまだ持っていないので既定を「未所持」に
    const edbox=document.getElementById('cneditions');
    if(edbox){
      edbox.innerHTML=[...alternatives.values()].map(g=>`<button class="ghost2" data-alt="${esc(g.key)}">${esc(g.series)}：別の版・出版社の巻を確認</button>`).join('');
      edbox.querySelectorAll('[data-alt]').forEach(btn=>btn.onclick=()=>{
        const g=build(books).find(x=>x.key===btn.dataset.alt); if(!g) return;
        openSeries(g.key); volPicker(g);
      });
    }
  };
  const cancel=document.getElementById('cncancel');
  cancel.onclick=()=>{
    checkSeq++; job.cancel(); cancel.hidden=true;
    document.getElementById('cnprog').textContent='調査を中止しました。ここまで保存できた結果は残っています。';
    render(); paint();
  };
  for(let i=0;i<gs.length;i++){
    if(seq!==checkSeq) return;                 // 別の画面へ移った。静かに降りる
    const g=gs[i];
    const prog=document.getElementById('cnprog');
    if(prog) prog.textContent=`${g.series}（${i+1}/${gs.length}）…`;
    let list=[], e0=null;
    // fresh: 新刊の有無だけはキャッシュを信じず、必ず引き直す
    try{ list=await searchSeries(g.series,akey(g.author)+'|'+pkey(g.edition||''),true,job.signal,seriesLists); }catch(e){ e0=e; }
    if(seq!==checkSeq) return;
    if(list.editions&&list.editions.length||e0&&e0.editions) alternatives.set(g.key,g);
    if(e0&&e0.name==='EditionAmbiguousError'){ err=e0; failed++; paint(); continue; }
    if(e0){
      /* 断られたら間を空けて次へ。3作品続けて失敗したら、そこで切り上げる。
         叩き続けても通らないうえ、迷惑をかける */
      err=e0; ng++; failed++;
      if(ng>=3){ stopped=true; break; }
      try{ await waitRequest(ng*5000,job.signal); }catch(e){return;}
      continue;
    }
    ng=0;
    succeeded++;
    const mine=list.filter(x=>x.vol>g.max&&!books.some(b=>b.isbn===x.isbn));
    /* 1作品ごとに記録する。ここで残すから、途中で切れても成果が消えない。
       書誌そのものは持ち越さない（固定化すると最新巻が古いまま嘘になる）。 */
    const saved=await changeMeta(m=>{
      if(!job.current()) return null;
      m.series[gkey(g)]={parserVersion:QVER,checkedAt:Date.now(),newVols:[...new Set(mine.map(x=>x.vol))].sort((a,b)=>a-b),miss:!list.length};
      m.newAt=Date.now(); return m;
    });
    if(seq!==checkSeq) return;
    if(!saved){ succeeded--; failed++; err=new Error('確認結果を保存できませんでした'); stopped=true; break; }
    if(mine.length){
      mine.forEach(x=>found.push(Object.assign({},x,{_series:g.series,_from:g.max})));
      found.sort((a,b)=>a._series.localeCompare(b._series)||a.vol-b.vol);
      paint();
    }
    if(i<gs.length-1){ try{ await waitRequest(250,job.signal); }catch(e){return;} }        // 国会図書館に連打しない
  }
  if(seq!==checkSeq) return;
  cancel.hidden=true;
  render();
  logAct('新刊確認',`${gs.length}作品｜新刊${found.length}件`+(stopped?'｜中断':''),performance.now()-t0);
  const head=document.querySelector('#card .lab');
  if(head) head.textContent='新刊';
  const prog=document.getElementById('cnprog');
  if(prog) prog.innerHTML=stopped
    ? `<span style="color:var(--alert)">${esc(errText(err))}。</span>
       ここまでの結果は残しました。時間をおいてもう一度押すと、調べていない作品から続けます。`
    : failed
      ? `${succeeded}作品の確認が完了し、${failed}作品は確認できませんでした（${esc(errText(err))}）。`
        +`確認できた新刊は${found.length}件です。失敗した作品はもう一度調べられます。`
    : found.length
      ? `${gs.length}作品を調べました。追加すると「未所持」で入ります。買ったら持ちかたを変えてください。`
      : `${gs.length}作品を調べました。新しい巻は見つかりませんでした。`
        +(skipped?`（完結の${skipped}作品は除く）`:'')
        +(!force&&nRecent?`（24時間以内に調べた${nRecent}作品は除く）`:'')
        +(!force&&nDead?`（国会図書館に記録が無い${nDead}作品は除く）`:'');
  paint();
}

function results(items,grouped,q){
  // 同じ巻が複数版ある（通常版と特装版など）ときは、2件目以降にその旨を出す
  const seen=new Set();
  const one=(x,i)=>{
    const s=coverSrcs(x), p=seriesOf(x);
    const k=p.vol?mkey(p.series)+'#'+p.vol:null;
    const dup=k&&seen.has(k); if(k) seen.add(k);
    return `<div class="hit">
    ${s.length?`<img src="${esc(s[0])}" alt="" loading="lazy" data-p="1"
        data-n="${esc(s.slice(1).map(encodeURIComponent).join(' '))}" onload="ckCover(this)" onerror="nextCover(this)">`
       :`<div class="ph"></div>`}
    <div class="n">${esc(x.title)}${dup?'<em class="alt">別版</em>':''}<small>${esc(x.author)}${
      x.date?' / '+esc(x.date.slice(0,4)):''}</small></div>
    <button class="go" data-i="${i}">追加</button></div>`;
  };
  if(!grouped) return items.map(one).join('');
  /* 作品ごとに見出しでまとめる。まとめないと外伝やスピンオフが
     本編の巻の海に埋もれて、あることに気づけない。 */
  const byT=new Map();
  items.forEach((x,i)=>{
    const p=seriesOf(x), nm=mainTitle(p.series||x.title||''), t=mkey(nm);
    if(!byT.has(t)) byT.set(t,{name:nm||x.title, rows:[]});
    byT.get(t).rows.push([x,i]);
  });
  /* 探した題名そのもの → その名前で始まる作品（外伝） → それ以外。
     国会図書館は主題も見るので、「オーバーロード」で
     「過重負担化するカリキュラム」まで返ってくる。同じ並びに混ぜない。 */
  const qk=q?skey(mainTitle(q)):'';
  const score=t=>!qk?1:(t===qk?0:t.indexOf(qk)===0?1:2);
  const arr=[...byT.entries()].map(([t,g],i)=>({t,g,i}))
    .sort((a,b)=>score(a.t)-score(b.t)||a.i-b.i);
  let last=-1;
  return arr.map(({t,g})=>{
    const s=score(t);
    const head=(qk&&s!==last)
      ? (s===1?`<div class="h">この作品の外伝・関連</div>`
        :s===2?`<div class="h">名前が似ているだけの本</div>`:'')
      : '';
    last=s;
    return head+`<div class="lab">${esc(g.name)}${g.rows.length>1?`（${g.rows.length}冊）`:''}</div>`
      + g.rows.map(([x,i])=>one(x,i)).join('');
  }).join('');
}
function wire(box,items,q,own){
  const pick=()=>own||addOwn;                  // 呼び出し元が持ちかたを指定できる
  const diag=box.querySelector('#diag');
  if(diag) diag.onclick=()=>diagnose(box).then(ok=>{if(ok) wire(box,[],q);});
  ['#hand','#hand2'].forEach(sel=>{
    const h=box.querySelector(sel);
    if(h) h.onclick=async()=>{
      const name=(q||'').trim();
      const b=await addManual(name,pick());
      if(b){ closeSheet(); toast(`『${b.title.slice(0,16)}』を手で登録`); }
    };
  });
  const bulk=box.querySelector('#bulk');
  if(bulk) bulk.onclick=async()=>{
    const sel=((box.querySelector('#bed')||{}).value)||null;   // 版の選択（あれば）
    /* 入れる巻は検索時の控え（bulkEds）から組む。以前はここで searchSeriesAll を
       引き直していて2〜6秒待たせていたが、範囲プルダウンの選択肢も bulkEds から
       作っており、画面に見えている巻と実際に入る巻はこのデータで一致する */
    let list=[];
    if(sel==='both'){
      const m=new Map();
      bulkEds.forEach(e=>e.vols.forEach(x=>{
        const kk=e.ak+'|'+e.pk+'#'+x.vol; if(!m.has(kk)) m.set(kk,x); }));
      list=[...m.values()].sort((a,b)=>a.vol-b.vol);
    }else if(sel){
      const e=bulkEds.find(x=>x.ak+'|'+x.pk===sel);
      list=e?[...e.vols.values()].sort((a,b)=>a.vol-b.vol):[];
    }else{
      // 版の選択が無いときは従来どおり：主版＋足りない巻を他の版から補う
      const vols=new Map();
      bulkEds.forEach(e=>e.vols.forEach(x=>{ if(!vols.has(x.vol)) vols.set(x.vol,x); }));
      list=[...vols.values()].sort((a,b)=>a.vol-b.vol);
    }
    if(!list.length) list=bulkList;                         // 念のための逃げ道
    // 範囲の指定（プルダウン）があればそれで絞る
    const from=+((box.querySelector('#bfrom')||{}).value||1);
    const toSel=(box.querySelector('#bto')||{}).value||'all';
    list=list.filter(x=>!books.some(b=>b.isbn===x.isbn))
      .filter(x=>!x.vol||(x.vol>=from&&(toSel==='all'||x.vol<=+toSel)));
    const got=await addMany(list,pick()); if(!got) return;
    const n=got.length;
    fillCoversFor(got);          // 表紙はあとから届けばよい。待たせない
    if(!n){ bulk.textContent='追加できる巻がありませんでした'; bulk.classList.add('done'); return;
    }
    bulk.textContent=`${n}冊を${ownLabel(pick())}で追加しました`;
    bulk.classList.add('done'); bulk.onclick=null;
  };
  box.querySelectorAll('.go').forEach(btn=>btn.onclick=async()=>{
    const x=items[+btn.dataset.i]; btn.textContent='…';
    const b=await add(x.isbn,{own:pick(),quiet:true,rec:x});
    if(b){ btn.textContent=ownLabel(pick())+'で追加'; btn.classList.add('done'); btn.onclick=null; }
    else btn.textContent='追加';
  });
}

/* ══ スキャン ══ */
let stream=null, loop=null, busy=false, camGot=[], scanStarting=false, scanSeq=0, scanRequest=null;
const isSecure=()=>location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ══ 連続スキャン（USBバーコードリーダー） ══
   USBのリーダーはほぼ全てHIDキーボードとして振る舞い、読んだ数字を高速に
   打ち込んで最後にEnterを送る。カメラも BarcodeDetector も要らないので、
   カメラが使えない端末はこちらに回す。
   人の打鍵と区別するため、キーの間隔が短い数字の並びだけを拾う。 */
const HID_GAP=120;                       // これより間が空いたら人の入力とみなして捨てる
let hid={buf:'',t:0,on:false,n:0,got:[]};
/* 読んだ本の表紙は、1冊ずつ Amazon を当てずっぽうに引くより
   openBD へまとめて聞くほうが速い。読み終わり（手が止まった頃）に1回だけ投げる。 */
let scanCovT=0;
function scanCovers(list){
  clearTimeout(scanCovT);
  scanCovT=setTimeout(()=>fillCoversFor(list.splice(0)),2500);
}
document.addEventListener('keydown',e=>{
  if(!hid.on) return;
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA') return;      // 手入力の邪魔をしない
  const now=Date.now();
  if(now-hid.t>HID_GAP) hid.buf='';
  hid.t=now;
  if(/^[0-9]$/.test(e.key)){ hid.buf+=e.key; return; }
  if(e.key!=='Enter') return;
  const code=hid.buf; hid.buf='';
  if(code) hidAdd(code);
});

async function hidAdd(code){
  const log=document.getElementById('ulog'); if(!log) return;
  const row=(text,color)=>{
    if(log.querySelector('.meta')) log.innerHTML='<div class="rows"></div>';
    const box=log.querySelector('.rows')||log;
    const d=document.createElement('div'); d.className='r';
    const a=document.createElement('span'); a.textContent=text;   // textContent なので何が来ても安全
    const b=document.createElement('span'); b.textContent=color==='ok'?'追加':'—';
    b.style.color=color==='ok'?'var(--jade)':'var(--alert)';
    d.append(a,b); box.prepend(d);
    document.getElementById('ucount').textContent=hid.n+'冊';
  };
  if(!isISBN13(code)){ row(`ISBN として正しくありません（${code}）`,'ng'); return; }
  if(books.some(b=>b.isbn===code)){ row('もう棚にあります','ng'); return; }
  const job=viewJob('usb:'+code);
  let b=null; try{ b=await add(code,{own:addOwn,quiet:true,signal:job.signal}); }catch(e){}
  if(!job.current()||!hid.on) return;
  if(b){ hid.n++; row(b.title,'ok'); hid.got.push(b); scanCovers(hid.got); }
  else row(`見つかりませんでした（${code}）`,'ng');
}

function openScanUSB(){
  hid={buf:'',t:0,on:true,n:0,got:[]};
  openWith(`
    <h2>連続スキャン</h2>
    <p class="meta">USBバーコードリーダーで、裏表紙の <b>978</b> で始まる方を続けて読ませてください。
      画面はこのままで大丈夫です。入力欄を選ぶ必要はありません。</p>
    ${'BarcodeDetector' in window?'':`<p class="meta">この端末はカメラでの読み取りに対応していません
      （iPhone / iPad など）。リーダーが無ければ「探す」からタイトルや ISBN で登録できます。</p>`}
    <div class="lab">追加するときの持ちかた</div>
    <div class="seg" id="uo">${OWNS.map(o=>
      `<button data-v="${o.id}" class="${addOwn===o.id?'on':''}">${o.label}</button>`).join('')}</div>
    <div class="lab">読み取り<span style="float:right" id="ucount">0冊</span></div>
    <div id="ulog"><p class="meta" style="padding:10px 0">待っています…</p></div>`);
  document.getElementById('uo').onclick=e=>{
    const t=e.target.closest('[data-v]'); if(!t) return;
    addOwn=t.dataset.v;
    [...document.getElementById('uo').children].forEach(x=>x.classList.toggle('on',x===t));
  };
}

document.getElementById('scan').onclick=async()=>{
  if(scanStarting||stream) return;             // 許可待ちの連打で二重にカメラを開かない
  // カメラが使えない端末（Windows の Chrome など）はUSBリーダー用の画面へ回す
  if(!('BarcodeDetector' in window)){ openScanUSB(); return; }
  if(!isSecure()){ toast('カメラは https か localhost でのみ使えます',true); return; }
  const video=document.getElementById('video');
  const seq=++scanSeq; scanStarting=true;
  let acquired=null;
  try{
    // 読取形式の非対応は、カメラの許可を求める前にUSB／検索の案内へ回す。
    let det;
    try{
      if(typeof BarcodeDetector.getSupportedFormats==='function'&&
        !(await BarcodeDetector.getSupportedFormats()).includes('ean_13')) throw new Error('unsupported');
      if(seq!==scanSeq) return;
      det=new BarcodeDetector({formats:['ean_13']});
    }catch(e){
      if(seq===scanSeq){ openScanUSB(); toast('この端末はカメラ読取に対応していません。USBリーダーか「探す」を使ってください',true); }
      return;
    }
    acquired=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
    // 許可待ちの間に閉じられた場合、遅れて届いたストリームも必ず停止する。
    if(seq!==scanSeq){ acquired.getTracks().forEach(t=>t.stop()); return; }
    stream=acquired; scanRequest=new AbortController(); video.srcObject=stream; await video.play();
    if(seq!==scanSeq) return;                 // stopScan が停止済み
    document.getElementById('scanner').classList.add('on');
    document.getElementById('log').innerHTML=''; camGot=[];
    try{ history.pushState({sc:1},''); }catch(e){}   // 戻るキーで閉じられるようにする

    loop=setInterval(async()=>{
    if(busy) return; busy=true;
    try{
      const [code]=await det.detect(video);
      if(seq!==scanSeq) return;
      if(code){
        const v=code.rawValue.replace(/\D/g,'');
        if(isISBN13(v)){
          if(navigator.vibrate) navigator.vibrate(35);
          const f=document.getElementById('flash');
          f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
          if(books.some(x=>x.isbn===v)){
            pushLog('すでに棚にあります');
          }else{
            const b=await add(v,{own:'paper',quiet:true,signal:scanRequest.signal});
            if(seq!==scanSeq) return;
            if(b){ pushLog(b.series?`${b.series} ${b.vol}`:b.title); camGot.push(b); }
            else  pushLog('情報が見つかりません（'+v+'）');
          }
          await sleep(1000);
        }else if(v.startsWith('192')){
          document.getElementById('hint').textContent='それは下段です。上段（978…）を読ませてください';
        }
      }
    }catch(e){}
      finally{ if(seq===scanSeq) busy=false; }
    },260);
  }catch(e){
    if(seq===scanSeq){
      stopScan();
      toast(e.name==='NotAllowedError'
        ?'カメラの利用が許可されませんでした。「探す」やUSBリーダーでも登録できます'
        :'カメラを開始できませんでした。「探す」やUSBリーダーでも登録できます',true);
    }else if(acquired){ acquired.getTracks().forEach(t=>t.stop()); }
  }finally{ if(seq===scanSeq) scanStarting=false; }
};
function pushLog(t){
  const box=document.getElementById('log');
  const d=document.createElement('div'); d.textContent=t; box.appendChild(d);
  while(box.children.length>3) box.removeChild(box.firstChild);
}
// カメラは必ず止める。止め忘れるとレンズが光ったままになり、電池も食う
function stopScan(fromPop){
  scanSeq++; scanStarting=false; busy=false;
  if(scanRequest) scanRequest.abort(); scanRequest=null;
  clearInterval(loop); loop=null;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  const video=document.getElementById('video');
  video.pause(); video.srcObject=null;
  // 読んだぶんの表紙は、閉じたところでまとめて1回聞く
  if(camGot.length) fillCoversFor(camGot.splice(0));
  document.getElementById('scanner').classList.remove('on');
  document.getElementById('hint').innerHTML='裏表紙の<b>上段</b>（978…）を枠に合わせてください';
  if(!fromPop && history.state && history.state.sc){ ignorePop++; history.back(); }
}
document.getElementById('stop').onclick=()=>stopScan();

/* ══ 表紙の一括補完 ══
   表紙URLの無い本は、描画のたびに Amazon の当てずっぽうに頼っている。
   openBD は ISBN のカンマ区切りで一括照会できるので、1〜2回の通信で
   棚全体ぶんの表紙URLを埋められる。勝手には走らせない（メニューから手動）。 */
async function coverLookup(targets,signal){
  let n=0;
  for(let i=0;i<targets.length;i+=500){          // URLが長くなりすぎない単位で刻む
    const part=targets.slice(i,i+500);
    const data=await requestData('https://api.openbd.jp/v1/get?isbn='+part.map(b=>b.isbn).join(','),'json',{signal});
    if(!Array.isArray(data)) throw new Error('表紙の応答が不正です');
    data.forEach((d,j)=>{
      const c=d&&d.summary&&d.summary.cover;
      if(c&&part[j]){ part[j].cover=c; n++; }
    });
  }
  return n;
}
async function fillCovers(){
  const job=viewJob('covers');
  const targets=books.filter(b=>isISBN13(b.isbn)&&!b.cover).map(b=>Object.assign({},b));
  if(!targets.length){ toast('表紙URLの無い本はありません'); return; }
  toast(`${targets.length}冊の表紙を探しています…`);
  const t0=performance.now();
  let n=0;
  try{ n=await coverLookup(targets,job.signal); }
  catch(e){ if(job.current()) toast(errText(e),true); return; }
  if(!job.current()) return;
  if(n&&!await commitCovers(targets)) return;
  logAct('表紙補完',`${targets.length}冊中${n}冊`,performance.now()-t0);
  if(n){ render(); closeSheet(); }
  toast(n?`${n}冊の表紙が見つかりました`:'openBD にも表紙がありませんでした',!n);
}
/* まとめて追加した直後の本は表紙URLを持っていない（国会図書館は書影を返さない）。
   1冊ずつ Amazon を当てずっぽうに引く前に、openBD へ1回だけまとめて聞く。
   描画が起こす表紙取得と同じ種類の通信なので、追加操作の続きとして自動で走らせてよい。
   失敗しても黙って引き下がる——従来のフォールバック（Amazon→Google）がそのまま働く */
async function fillCoversFor(list){
  const targets=list.filter(b=>isISBN13(b.isbn)&&!b.cover).map(b=>Object.assign({},b));
  if(!targets.length) return;
  try{ if(await coverLookup(targets)&&await commitCovers(targets)) render(); }catch(e){}
}

async function commitCovers(targets){
  const covers=new Map(targets.filter(b=>b.cover).map(b=>[b.isbn,b.cover]));
  // 応答待ち中に削除した本や、利用者が設定した表紙を古い結果で戻さない。
  return changeBooks(current=>current.map(b=>!b.cover&&covers.has(b.isbn)?Object.assign({},b,{cover:covers.get(b.isbn)}):b));
}

      ${singles.length?`<div class="lab">単巻</div>`+singles.map(row).join(''):''}

    const card2=document.getElementById('card');
    card2.onclick=async e=>{

      if(e.target.closest('#tgo')){

        const label=gs.filter(g=>sel.has(g.key)).map(g=>g.series||'単巻').join('、').slice(0,40);
        if(!(await removeMany(list,label))) return;

  };
  openWith('');

}

/* ══ 端末間のファイル同期 ══
   サーバーへの自動同期ではない。旧版のJSONとも差分を比較できる。
   時計やファイルの新旧で勝者を決めず、異なる値は利用者が選ぶ。
   不在は削除の証拠にならないので、片側だけの本は既定で残す。 */
const SYNC_BACKUP='bookshelf:before-sync';
const SYNC_FIELDS=[
  {label:'書名・巻・版',keys:['title','series','vol','author','publisher','date','volumeAmbiguous']},
  {label:'持ちかた',keys:['own']}, {label:'読みかた・読了日',keys:['status','readAt']},
  {label:'アニメ',keys:['anime']}, {label:'評価',keys:['rate']},
  {label:'メモ',keys:['note']}, {label:'場所',keys:['place']}, {label:'表紙',keys:['cover']}
];
const syncStable=v=>JSON.stringify(v,(_k,x)=>x&&typeof x==='object'&&!Array.isArray(x)
  ?Object.fromEntries(Object.keys(x).sort().map(k=>[k,x[k]])):x);
const syncSignature=()=>syncStable({books,done:[...doneKeys].sort()});
const syncValues=(b,f)=>f.keys.map(k=>b[k]??null);
const syncStorage=async()=>Promise.all([KEY,META].map(async k=>window.storage
  ?(await window.storage.get(k))?.value??null:localStorage.getItem(k)));
function syncStoredSignature(raw){
  const saved=raw[0]==null?[]:JSON.parse(raw[0]), settings=raw[1]==null?{}:JSON.parse(raw[1]);
  if(!Array.isArray(saved)) throw new Error('保存データの復旧が必要です');
  validateMeta(settings);
  return syncStable({books:saved.map(normalize),done:(settings.done||[]).slice().sort()});
}
function planShelfSync(data){
  if(!data||(!Array.isArray(data)&&(typeof data!=='object'||data.app&&data.app!=='bookshelf'
    ||data.version!=null&&(!Number.isInteger(data.version)||data.version<1||data.version>3))))
    throw new Error('本棚の対応するJSONファイルを選んでください');
  const list=Array.isArray(data)?data:data.books;
  if(!Array.isArray(list)) throw new Error('本の一覧がありません');
  const incoming=list.map(normalize), local=books.map(normalize);
  const index=items=>{
    const m=new Map();
    for(const b of items){
      if(m.has(b.isbn)) throw new Error('同じISBN・登録IDが複数あります。重複を確認してからやり直してください');
      m.set(b.isbn,b);
    }
    return m;
  };
  const a=index(local), b=index(incoming);
  const plan={signature:syncSignature(),local,added:[],changed:[],onlyLocal:[],done:[],held:[],same:0};
  for(const remote of incoming){
    const own=a.get(remote.isbn);
    if(classificationIssue(remote)){
      plan.held.push({title:remote.title,reason:'題名とシリーズ・巻の分類を確認してください'}); continue;
    }
    if(!own){
      // ISBN不明の同一巻は自動で同じ本とも別の本とも決めない。
      if(remote.series&&remote.vol&&local.concat(incoming.filter(x=>x!==remote)).some(x=>
        (!isISBN13(remote.isbn)||!isISBN13(x.isbn))&&mkey(x.series||'')===mkey(remote.series)&&x.vol===remote.vol
        &&(!remote.author||!x.author||akey(x.author)===akey(remote.author)))){
        plan.held.push({title:remote.title,reason:'同じ巻の候補があります。ISBN・版・複本を確認してください'}); continue;
      }
      plan.added.push(remote); continue;
    }
    const changes=SYNC_FIELDS.map((f,i)=>({field:i,local:syncValues(own,f),remote:syncValues(remote,f)}))
      .filter(x=>syncStable(x.local)!==syncStable(x.remote));
    if(changes.length) plan.changed.push({isbn:remote.isbn,title:own.title,remote,changes});
    else plan.same++;
  }
  plan.onlyLocal=local.filter(x=>!b.has(x.isbn));
  if(!Array.isArray(data)&&Object.hasOwn(data,'done')){
    if(!Array.isArray(data.done)||data.done.some(k=>typeof k!=='string')) throw new Error('完結の印が不正です');
    const remoteDone=new Set(data.done);
    for(const key of new Set([...doneKeys,...remoteDone])){
      if(doneKeys.has(key)!==remoteDone.has(key)) plan.done.push({key,local:doneKeys.has(key),remote:remoteDone.has(key)});
    }
  }
  return plan;
}
async function applyShelfSync(plan,choices){
  return stateJob(async()=>{
    if(store.blocked.has(KEY)||store.blocked.has(META)||store.blocked.has(PENDING))
      throw new Error('元の保存データを保護しています。復旧してから反映してください');
    if(plan.signature!==syncSignature()||!plan.storage||plan.signature!==syncStoredSignature(plan.storage)
      ||syncStable(await syncStorage())!==syncStable(plan.storage))
      throw new Error('確認中に棚が変わりました。再読み込みして、ファイルを選び直してください');
    const next=plan.local.map(b=>({...b})), done=new Set(doneKeys);
    let updated=0, removed=0, added=0;
    for(let i=0;i<plan.changed.length;i++){
      const row=plan.changed[i], target=next.find(b=>b.isbn===row.isbn); let changed=false;
      for(const item of row.changes){
        const value=choices.fields[`${i}:${item.field}`];
        if(value!=='local'&&value!=='remote') throw new Error('違う値がある項目の選択を完了してください');
        if(value==='remote'){
          for(const k of SYNC_FIELDS[item.field].keys){
            if(Object.hasOwn(row.remote,k)) target[k]=row.remote[k]; else delete target[k];
          }
          changed=true;
        }
      }
      if(changed) updated++;
    }
    for(let i=0;i<plan.done.length;i++){
      const row=plan.done[i], value=choices.done[i];
      if(value!=='local'&&value!=='remote') throw new Error('完結の印の選択を完了してください');
      if(row[value]) done.add(row.key); else done.delete(row.key);
    }
    for(let i=0;i<plan.added.length;i++) if(choices.add.includes(i)){ next.push(plan.added[i]); added++; }
    for(let i=0;i<plan.onlyLocal.length;i++) if(choices.remove.includes(i)){
      const at=next.findIndex(b=>b.isbn===plan.onlyLocal[i].isbn);
      if(at>=0){ next.splice(at,1); removed++; }
    }
    const nextMeta={...metaSnapshot(),done:[...done]};
    // 同じファイルを再度確認しただけなら、前回の復旧用控えもそのまま残す。
    if(!added&&!updated&&!removed&&syncStable([...done].sort())===syncStable([...doneKeys].sort()))
      return {added,updated,removed};
    // 復旧用JSONを端末に保存できなければ、本棚の変更には進まない。
    if(await store.set(SYNC_BACKUP,{...shelfBackup(),savedAt:new Date().toISOString()})===false) return false;
    if(!await writeShelfState(next,nextMeta)) return false;
    return {added,updated,removed};
  });
}
function openDeviceSync(){
  openWith(`<h2>PC・スマホのデータを合わせる</h2>
    <p class="meta">現在はファイルを渡す手動同期です。クラウドへの自動同期は未設定です。</p>
    <ol class="meta"><li>両方の端末で先に「JSONで書き出す」で控えを保存します。</li>
    <li>片方のJSONをもう片方の端末へ渡し、「受け取ったJSONと比較する」を押します。</li>
    <li>違うメモ・読書状況を確認して反映します。反映後のJSONを元の端末にも戻してください。</li></ol>
    <p class="meta">同じURLを開くだけでは棚は同期されません。メモもファイルに含まれます。共有先は自分で選んでください。</p>
    <div class="menu"><button id="syncdownload">JSONで書き出す</button>
    <button id="syncshare">JSONを共有する</button><button id="syncread">受け取ったJSONと比較する</button>
    <button id="syncprevious">直前の反映前の控えを保存する</button></div>
    <p class="meta" id="syncmessage" role="status"></p>`);
  document.getElementById('syncdownload').onclick=exportJSON;
  document.getElementById('syncshare').onclick=shareShelf;
  document.getElementById('syncprevious').onclick=async()=>{
    const data=await store.get(SYNC_BACKUP);
    if(!data||data.app!=='bookshelf'||!Array.isArray(data.books)){ toast('この端末には反映前の控えがありません',true); return; }
    dl(JSON.stringify(data,null,2),'json','application/json');
  };
  document.getElementById('syncread').onclick=()=>{
    const view=bulkSeq;
    const input=document.createElement('input'); input.type='file'; input.accept='.json,application/json';
    input.onchange=async()=>{
      if(!input.files.length) return;
      try{
        if(input.files[0].size>20*1024*1024) throw new Error('ファイルが大きすぎます（上限20MB）');
        const data=JSON.parse(await input.files[0].text());
        await stateQueue;
        const plan=planShelfSync(data); plan.storage=await syncStorage();
        if(!sheetOpen||view!==bulkSeq) return;
        if(plan.signature!==syncStoredSignature(plan.storage))
          throw new Error('別の画面で棚が変わっています。再読み込みしてから比較してください');
        showShelfSync(plan);
      }catch(e){ const el=document.getElementById('syncmessage');
        if(el) el.textContent=e.message||'このファイルは読み込めません'; }
    };
    input.click();
  };
}
async function shareShelf(){
  const el=document.getElementById('syncmessage');
  const text=JSON.stringify(shelfBackup(),null,2);
  const file=new File([text],`bookshelf-${new Date().toISOString().slice(0,10)}.json`,{type:'application/json'});
  try{
    if(!navigator.share||!navigator.canShare||!navigator.canShare({files:[file]})){
      dl(text,'json','application/json');
      if(el) el.textContent='このブラウザではJSONを直接共有できないため、保存画面を開きました。保存したファイルを渡してください。';
      return;
    }
    await navigator.share({files:[file],title:'本棚の控え'});
    // shareの完了は受信先の保存・反映完了ではない（Windowsでは画面を開いた時点）。
    if(el) el.textContent='共有操作を終えました。受け取った端末でファイルの比較・反映を行ってください。';
  }catch(e){ if(el) el.textContent=e.name==='AbortError'?'共有を中止しました。棚は変わっていません。'
    :'共有できませんでした。「JSONで書き出す」で保存して渡してください。'; }
}
function showShelfSync(plan){
  const choices={fields:{},done:{},add:plan.added.map((_,i)=>i),remove:[]};
  const labels={paper:'紙',digital:'電子',none:'未所持',stock:'未読',now:'読書中',read:'読了',stop:'中断'};
  const display=(values,field)=>values.map((v,i)=>field===2&&i===1?(v?ymd(v):'読了日なし')
    :v==null||v===''?'（空）':v===true?'あり':v===false?'なし':labels[v]||String(v)).join(' / ');
  const select=(id,a,b)=>`<select class="sync-choice" data-choice="${id}" aria-label="採用する値">
    <option value="">選んでください</option><option value="local">この端末を残す</option><option value="remote">受け取った値を使う</option></select>
    <div class="sync-values"><p>この端末：${esc(a)}</p><p>受け取った値：${esc(b)}</p></div>`;
  openWith(`<h2>違いを確認して反映</h2>
    <p class="meta">新規${plan.added.length}冊／内容が違う${plan.changed.length}冊／同じ${plan.same}冊／保留${plan.held.length}冊。
    並び順と新刊の確認記録はこの端末の設定を残します。</p>
    ${plan.changed.map((r,i)=>`<details class="sync-book" open><summary>${esc(r.title)} <small>${esc(r.isbn)}</small></summary>
      ${r.changes.map(c=>`<div class="sync-field"><strong>${esc(SYNC_FIELDS[c.field].label)}</strong>
        ${select(`${i}:${c.field}`,display(c.local,c.field),display(c.remote,c.field))}</div>`).join('')}</details>`).join('')}
    ${plan.done.length?`<details class="sync-book" open><summary>完結の印</summary>${plan.done.map((r,i)=>
      `<div class="sync-field"><strong>${esc(r.key)}</strong>${select(`done:${i}`,r.local?'完結':'未完結',r.remote?'完結':'未完結')}</div>`).join('')}</details>`:''}
    ${plan.added.length?`<details class="sync-book" open><summary>受け取ったファイルにだけある本</summary>${plan.added.map((b,i)=>
      `<label class="sync-check"><input type="checkbox" data-add="${i}" checked>追加する：${esc(b.title)} <small>${esc(b.isbn)}</small></label>`).join('')}</details>`:''}
    ${plan.onlyLocal.length?`<details class="sync-book"><summary>この端末にだけある${plan.onlyLocal.length}冊（既定では残します）</summary>
      <p class="meta">別端末で削除した本か、この端末で新しく追加した本かは区別できません。消す本だけ選んでください。</p>
      ${plan.onlyLocal.map((b,i)=>`<label class="sync-check"><input type="checkbox" data-remove="${i}">棚から出す：${esc(b.title)} <small>${esc(b.isbn)}</small></label>`).join('')}</details>`:''}
    ${plan.held.length?`<details class="sync-book"><summary>保留する本</summary>${plan.held.map(b=>`<p class="meta">${esc(b.title)}：${esc(b.reason)}</p>`).join('')}</details>`:''}
    <p class="meta">反映直前の控えは、この端末に自動保存します。取り消したいときは同期メニューから控えを保存して、もう一度比較してください。</p>
    <p id="syncresult" class="meta" role="status"></p>
    <div class="acts"><button id="synckeep" class="ghost2">未選択はこの端末を残す</button>
    <button id="syncapply" class="save" disabled>選んだ内容を反映する</button></div>`);
  const card=document.getElementById('card'), btn=document.getElementById('syncapply');
  const update=()=>{
    card.querySelectorAll('[data-choice]').forEach(el=>{
      const key=el.dataset.choice;
      if(key.startsWith('done:')) choices.done[key.slice(5)]=el.value; else choices.fields[key]=el.value;
    });
    choices.add=[...card.querySelectorAll('[data-add]:checked')].map(el=>Number(el.dataset.add));
    choices.remove=[...card.querySelectorAll('[data-remove]:checked')].map(el=>Number(el.dataset.remove));
    btn.disabled=[...card.querySelectorAll('[data-choice]')].some(el=>!el.value);
    document.getElementById('syncresult').textContent=`追加${choices.add.length}冊／棚から出す${choices.remove.length}冊。違う値は項目ごとに選んでください。`;
  };
  card.querySelectorAll('select,input[type=checkbox]').forEach(el=>el.onchange=update);
  document.getElementById('synckeep').onclick=()=>{
    card.querySelectorAll('[data-choice]').forEach(el=>{if(!el.value) el.value='local';}); update();
  };
  btn.onclick=async()=>{
    const view=bulkSeq;
    btn.disabled=true;
    try{
      const result=await applyShelfSync(plan,choices);
      if(!result) throw new Error('保存できませんでした。反映は完了していません。保存領域を確認してやり直してください');
      render();
      logAct('端末間の反映',`追加${result.added}／更新${result.updated}／削除${result.removed}`);
      if(!sheetOpen||view!==bulkSeq){ toast('端末間の反映を保存しました'); return; }
      openWith(`<h2>この端末に反映しました</h2><p class="meta">追加${result.added}冊／更新${result.updated}冊／棚から出した${result.removed}冊。</p>
        <p class="meta">もう一方の端末も合わせるには、この結果のJSONを渡し、同じ比較・反映を行ってください。自動送信はしていません。</p>
        <div class="menu"><button id="syncfinishdownload">結果のJSONを保存する</button><button id="syncfinishshare">結果のJSONを共有する</button></div>
        <p class="meta" id="syncmessage" role="status"></p>`);
      document.getElementById('syncfinishdownload').onclick=exportJSON;
      document.getElementById('syncfinishshare').onclick=shareShelf;
    }catch(e){
      if(sheetOpen&&view===bulkSeq){ document.getElementById('syncresult').textContent=e.message; btn.disabled=false; }
      else toast(e.message,true);
    }
  };
  update();
}
/* ══ 書き出しの催促 ══
   棚は端末の中にしか無い。ブラウザのデータを消せば全部消える。
   書き出し機能があっても、きっかけが無いと押さないので、
   前回から離れたときだけ静かに促す。データを自動送信することはしない。 */
/* ══ 新刊確認の促し ══
   続きが出ていても、こちらから調べに行かないと分からない。
   自動では通信しない（勝手に外へ繋ぐのは気持ちが悪いし、
   国会図書館にも迷惑）。代わりに、間があいたときだけ静かに誘う。 */
function newHint(){
  const gs=build(books).filter(g=>g.isSeries&&!isDone(g));
  if(!gs.length) return '';
  // 作品ごとに「いつ調べたか」を持つようになったので、放置しているぶんだけを数える
  const stale=gs.filter(g=>{ const m=seriesMeta(g);
    return !m||Date.now()-(m.checkedAt||0)>=14*86400000; });
  if(!stale.length) return '';
  return `<button class="hint" id="newhint">${
    meta.newAt?`${stale.length}作品は、2週間以上あたらしい巻を調べていません`
              :`続きが出ていないか、まだ調べていません（${stale.length}作品）`
    }。確かめませんか</button>`;
}
function exportHint(){
  if(!books.length) return '';
  const at=meta.exportAt;
  const days=at?Math.floor((Date.now()-at)/86400000):0;
  const grew=at?books.length-meta.exportN:books.length;
  if(at&&days<30&&grew<20) return '';
  const why=!at ? 'まだ一度も控えを取っていません'
    : grew>=20 ? `前回の控えから${grew}冊増えました`
    : `前回の控えから${days}日たちました`;
  return `<button class="hint" id="exphint">${esc(why)}。書き出しておきませんか</button>`;
}

/* ══ 起動（v1 / v2 のデータも引き継ぐ） ══ */
function normalize(b){
  // 題名の無いレコードが混ざると、表紙や一覧の描画がそこで落ちる。
  // 読み込んだファイルが手で編集されていることもあるので、ここで最低限を保証する
  if(!b||typeof b!=='object'||Array.isArray(b)) throw new Error('本の形式が不正です');
  b=Object.assign({},b);                // 入力を直接変更しない（読み込みの事前検証）
  if(!['string','number'].includes(typeof b.isbn)) throw new Error('ISBNがありません');
  b.isbn=String(b.isbn).trim();
  if(!b.isbn||typeof b.title!=='string'||!b.title.trim()) throw new Error('ISBNまたは題名がありません');
  // 手入力の M... は保持。ハイフン付きISBNとISBN-10は同じISBN-13へ寄せる。
  const code=norm(b.isbn).replace(/[\s-]/g,'');
  const converted=isbn13from10(code);
  if(converted) b.isbn=converted;
  else if(isISBN13(code)) b.isbn=code;
  if(b.series!=null&&typeof b.series!=='string') throw new Error('シリーズ名が不正です');
  if(b.vol!=null&&b.vol!==''){
    if(!['number','string'].includes(typeof b.vol)) throw new Error('巻数が不正です');
    const v=Number(b.vol);
    if(!Number.isInteger(v)||v<1||v>200) throw new Error('巻数が不正です');
    b.vol=v;
  }else b.vol=null;
  b.title=String(b.title);
  b.author=String(b.author==null?'':b.author);
  b.publisher=String(b.publisher==null?'':b.publisher);
  b.date=String(b.date==null?'':b.date);
  { const d=ym(b.date); if(d) b.date=d; }   // 供給元ごとに形が違った刊行日を YYYYMM に揃える
  Object.keys(b).forEach(k=>{ if(k[0]==='_') delete b[k]; });  // 過去に紛れ込んだ作業フィールドを掃除
  if(!b.series&&!b.vol) Object.assign(b,parseSeries(b.title));
  if(!b.status) b.status=b.read?'read':'stock';
  delete b.read;
  if(!b.own) b.own='paper';            // 以前のデータは「紙で所持」とみなす
  b.anime=!!b.anime; b.rate=b.rate||0; b.readAt=b.readAt||0;
  b.place=String(b.place||''); b.note=String(b.note||''); b.cover=String(b.cover||'');
  return b;
}
/* 打鍵ごとに棚全体を描き直さない。手が少し止まってから1回だけ描く。
   150ms は「入力に遅れて感じない」上限あたり */
let qT=0;
document.getElementById('q').addEventListener('input',e=>{
  clearTimeout(qT);
  qT=setTimeout(()=>{
    const v=norm(e.target.value).trim().toLowerCase();
    if(v===filter) return;
    filter=v; shelfLimit=60; render();
  },150);
});
let tt;
function toast(msg,warn,action){
  const el=document.getElementById('toast');
  el.textContent=msg;
  if(action){
    const b=document.createElement('button');
    b.textContent=action.label;
    b.onclick=()=>{ el.classList.remove('on'); action.fn(); };
    el.appendChild(b);
  }
  el.classList.toggle('warn',!!warn);
  el.classList.toggle('act',!!action);
  el.classList.add('on');
  // 押せるボタンがあるときは、読む→迷う→押す の時間ぶん長く残す
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),action?6000:2200);
}
(async()=>{
  // 3つの読み込みは互いに独立なので、直列に待たず一度に引く
  const recovery=await recoverPending();
  const loadedState=await Promise.all([store.get(KEY),store.get(META),store.get(LOG)]);
  const [b0,m0,l0]=recovery&&!recovery.restored?[recovery.before.books,recovery.before.meta,loadedState[2]]:loadedState;
  let loaded=b0, sourceKey=KEY;
  let fromPrev=false;
  // v3 が「無い」ときだけ移行する。保存済み [] は利用者が空にした棚。
  if(!recovery&&store.missing.has(KEY)){
    for(const k of PREV){
      const old=await store.get(k);
      if(Array.isArray(old)&&old.length){ loaded=old; sourceKey=k; fromPrev=true; break; }
    }
  }
  // 移行・型補正の有無を比較するため、入力の控えは先に取る
  const before=fromPrev?'':JSON.stringify(loaded);
  try{
    if(loaded==null&&store.missing.has(KEY)) loaded=[];
    if(!Array.isArray(loaded)) throw new Error('棚の形式が不正です');
    books=loaded.map(normalize);
  }catch(e){ books=[]; await store.quarantine(sourceKey); store.blocked.add(KEY); }
  try{ loadMeta(m0); }catch(e){ await store.quarantine(META); loadMeta(null); }
  oplog=Array.isArray(l0)?l0:[];
  /* 読み込みに失敗したときは保存しない。空の棚で上書きすると、
     壊れていた（＝直せたかもしれない）データまで消えてしまう */
  if(recovery) toast(recovery.restored?'中断された読み込みを取り消し、元の棚に戻しました'
    :'元の棚を表示しています。復旧を保存できないため変更を停止しています。控えを取り、保存領域を空けて再起動してください',!recovery.restored);
  else if(store.bad) toast('保存データを読み込めませんでした。元の保存データは上書きせず保護しています',true);
  /* 以前は毎起動、無条件に全冊を書き戻していた。書くのは中身が実際に
     変わったとき（旧形式からの移行・normalize による補正）だけでよい */
  const migrate=!store.bad&&!recovery&&(fromPrev||JSON.stringify(books)!==before);
  render();
  if(migrate) await stateJob(()=>save(books));
  logAct('起動',`${books.length}冊`,performance.now()-T0);
})();
</script>
